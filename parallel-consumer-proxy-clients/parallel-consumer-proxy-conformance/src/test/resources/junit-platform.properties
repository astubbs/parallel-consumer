# PARALLEL BY CONSTRUCTION. The point of one suite over many bindings is running them side by side,
# so the matrix is concurrent by default rather than by opt-in. Every run owns its own engine over
# its own mock Kafka clients, so there is nothing for two of them to share.
#
# These four lines only ASK for parallelism. What proves it happened is the test that drives two
# bindings at once and measures the overlap, and that test arrives with the spawned foreign runners
# (extraction A9) - it is about two child processes genuinely in flight, which this stack has none of.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
# Four at once: each run is one JVM-hosted engine plus one child process, so this is bounded by the
# machine's cores rather than by anything in the suite.
junit.jupiter.execution.parallel.config.fixed.parallelism=4
