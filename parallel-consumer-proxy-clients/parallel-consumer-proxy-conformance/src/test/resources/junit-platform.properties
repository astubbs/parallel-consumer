# PARALLEL BY CONSTRUCTION. The point of one suite over ten languages is running them side by side
# during the implementation phase, so the matrix is concurrent by default rather than by opt-in.
# Every run owns its own engine on its own ephemeral loopback port and its own child process, so
# there is nothing for two of them to share.
#
# LanguagesRunInParallelTest is what actually proves this works; these four lines only ask for it.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
# Four at once: each run is one JVM-hosted engine plus one child process, so this is bounded by the
# machine's cores rather than by anything in the suite.
junit.jupiter.execution.parallel.config.fixed.parallelism=4
