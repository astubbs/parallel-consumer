# Copyright (C) 2026 Antony Stubbs and contributors
#
# THE ONE-COMMAND PATH for the Ruby demo (astubbs#242, plan unit U35, R20).
#
# THE BROKER IS A SIBLING, AND THAT IS A RULE RATHER THAN A LAYOUT CHOICE. Broker mode inside a
# container would otherwise require mounting the host Docker socket, and U35 forbids it: a
# documented socket mount is root-equivalent host access taught as the normal way to run the
# product. So the demo container is given an address instead of a socket. THIS BROKER SERVES THE
# NATIVE PATH TOO - demo/run.sh starts this same service and connects to its HOST listener - so
# there is one broker definition here rather than one per entry point.
#
# THE SIDECAR IS NOT A SERVICE HERE, deliberately. It would be easy to add one, and it would teach
# the wrong thing: KTD41's product model is that the client library spawns and supervises the
# sidecar itself, so the user never installs, deploys or operates a process. A compose service would
# show a deployment the product does not ask for. The demo spawns it as a child process inside its
# own container, exactly as it does natively.
#
# TWO WAYS IN, AND BOTH ARE SUPPORTED:
#
#   cd <this directory> && docker compose up      # the plain one, defaults, nothing else needed
#   demo/run.sh --docker [--records N ...]        # the same thing with the demo's flags
#
# `docker compose up` on its own is the path to keep working: it is what a reader who has never seen
# this repository will type. It needs no arguments, no environment and no wrapper script. Add
# --build after changing any source, and `docker compose down` to remove the broker afterwards.

name: pc-ruby-demo

services:
  broker:
    # Pinned as a literal because a compose file cannot derive anything. It must track
    # <kafka.version> in the root pom the same way DemoBroker#brokerImage does at run time - the
    # mapping is CP major = AK major + 4, so AK 3.9.x means CP 7.9.
    image: confluentinc/cp-kafka:7.9.0
    # THE HOST LISTENER IS WHAT THE NATIVE PATH USES, and it is why this file has one more listener
    # than the Java seed's. 29092 rather than 9092 on purpose: a reader running this demo may well
    # already have a broker on the usual port. demo/run.sh repeats the number, which is the price of
    # compose being unable to derive one.
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # QUIET. A demo is a thing someone WATCHES, and a KRaft broker at INFO emits hundreds of
      # lines of its own configuration, controller elections and log-segment chatter - which buries
      # the two tables the demo exists to show. Kafka's own warnings and errors still come through.
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bound to the service name rather than 0.0.0.0 for the sibling listener: this image formats
      # its KRaft storage with the same config it boots with, and the format step refuses a
      # non-routable ADVERTISED address. HOST binds 0.0.0.0 because it must accept a connection
      # arriving from outside the container's network, and advertises 127.0.0.1, which is where the
      # native demo actually reaches it.
      KAFKA_LISTENERS: PLAINTEXT://broker:9092,HOST://0.0.0.0:29092,CONTROLLER://broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,HOST://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The demo forms one consumer group per arm, one after another, and the default three-second
      # settling delay would be charged to every one of them.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 500
    healthcheck:
      # The demo must not start before the broker can serve an API request. Listing topics is the
      # cheapest call that proves that, and it proves more than a port being open does.
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  demo:
    build:
      # The repository, because the sidecar stage builds a Maven reactor module, which cannot build
      # without its parents and siblings. The root .dockerignore is what keeps this from uploading
      # every target/ directory in the tree; the Dockerfile explains why that pair had to exist.
      context: ../../..
      dockerfile: parallel-consumer-proxy-clients/parallel-consumer-proxy-client-ruby/demo/Dockerfile
    # A demo that has printed its tables is done. Without this, compose's default would restart a
    # container that exited cleanly and the reader would watch the whole run happen again.
    restart: "no"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      # Supplying this is what stops the demo asking to be started through run.sh.
      PC_DEMO_BOOTSTRAP: broker:9092
      # The flags demo/run.sh was called with, forwarded as one string.
      PC_DEMO_ARGS: ${PC_DEMO_ARGS:-}
      # EVERY OTHER PC_DEMO_ VARIABLE IS FORWARDED EXPLICITLY, because compose forwards nothing it
      # is not told to. The contract says every flag has an environment variable and that the
      # environment beats the defaults; without these lines that would silently stop being true the
      # moment a reader ran the container path, which is the path a reader without Ruby always
      # takes. An unset variable arrives as the empty string, which the demo reads as "not
      # supplied" - blank is never a request for zero.
      PC_DEMO_RECORDS: ${PC_DEMO_RECORDS:-}
      PC_DEMO_DELAY_MS: ${PC_DEMO_DELAY_MS:-}
      PC_DEMO_CONCURRENCY: ${PC_DEMO_CONCURRENCY:-}
      PC_DEMO_PARTITIONS: ${PC_DEMO_PARTITIONS:-}
      PC_DEMO_REPLAY_FACTOR: ${PC_DEMO_REPLAY_FACTOR:-}
      PC_DEMO_TOPIC: ${PC_DEMO_TOPIC:-}
