# Copyright (C) 2026 Antony Stubbs and contributors
#
# RuboCop configured as a BUG FINDER, not a style arbiter.
#
# The Lint/ and Security/ departments are what earn their place here: they catch shadowed
# variables, unreachable rescues, useless assignments, ambiguous blocks, `Object#send` shadowing,
# and the handful of genuinely dangerous calls. The style departments are turned down to the ones
# that change meaning rather than appearance, because a client library in ten languages cannot
# afford a formatting argument in each of them - and because a check whose output is mostly noise
# stops being read.
#
# RUN IT LOCALLY, EVERY TIME - `bundle exec rake` runs it alongside the specs, and
# `bundle exec rubocop` runs it alone. CI's clients matrix runs the same tool from this directory,
# but CI is not where a check first fires: this repo's rule is to verify on the box.
#
# THE CHECK HAS BEEN PROVEN TO FAIL. `Lint/UselessAssignment` and `Lint/ShadowedException` were
# each triggered deliberately against this configuration and watched go red before the defect was
# reverted; a check that has never failed is decoration. See docs/inflight/clients/ruby.md.

AllCops:
  # The floor this library supports, not the version it happens to be developed on. Thread::Queue#pop
  # with a timeout: is the binding constraint (Ruby 3.2), and the CI matrix pins 3.4.
  TargetRubyVersion: 3.2
  NewCops: enable
  # rubocop-rake and rubocop-rspec are suggested on every run. Neither is declined on quality -
  # both are mature - but this wave's brief is bug-finding, and their cops are almost entirely
  # about spec and rake STYLE. Revisit when the conformance suite grows past one spec.
  SuggestExtensions: false
  Exclude:
    # Generated by protoc from the FROZEN schema - never hand-edited, so never linted.
    - "lib/parallelconsumer/**/*"
    - "vendor/**/*"

# ── The bug-finding departments, at full strength ────────────────────────────
# Lint/ and Security/ are enabled by default and are deliberately left untouched: an exclusion
# here is the thing this configuration exists to prevent.

# ── Style and layout: only what changes meaning ──────────────────────────────
Style/Documentation:
  # Every class here is documented; the cop's own definition of documentation misses YARD-style
  # comments above a Struct.new assignment, which is most of the value objects.
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/ArgumentsForwarding:
  # It wants `**` and `&` with no names. This library's forwarded arguments are part of its public
  # surface and the names are how a reader of `open` learns what may be passed through; anonymous
  # forwarding makes that unreadable to buy nothing.
  Enabled: false

Layout/LineLength:
  # The repo's EditorConfig line length, applied to Ruby too.
  Max: 120

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  # Client is the whole session lifecycle in one class, deliberately: a client that splits its
  # admin loop from its executor loop across files is harder to read against the specification.
  Max: 250

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/ParameterLists:
  # ClientOptions mirrors the wire's option set; every parameter is keyword and optional.
  Max: 10
  MaxOptionalParameters: 10
