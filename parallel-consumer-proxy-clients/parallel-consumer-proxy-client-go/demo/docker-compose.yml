#
# THE ONE-COMMAND PATH for the Go demo (astubbs#242, plan unit U35, R20). It mirrors the Java
# seed's compose file beside the Java client, and the two rules below are the reason both exist in
# this shape rather than a simpler one.
#
# THE BROKER IS A SIBLING, AND THAT IS A RULE RATHER THAN A LAYOUT CHOICE. Starting a broker from
# inside the demo container would require mounting the host Docker socket, and U35 forbids it: a
# documented socket mount is root-equivalent host access taught as the normal way to run the
# product. So the containerised demo is handed an address and starts nothing. Natively, run.sh
# starts the broker on the host instead - the demo binary itself never starts one in either mode,
# which is where Go diverges from Java's Testcontainers fallback (see README.md).
#
# THE SIDECAR IS NOT A SERVICE HERE, deliberately. It would be easy to add one and it would teach
# the wrong thing: KTD41's product model is that the client library spawns and supervises the
# sidecar itself, so a user never installs, deploys or operates a process. A compose service would
# show a deployment the product does not ask for. The Go client library spawns it as a child
# process inside this container, exactly as it does natively.
#
# TWO WAYS IN, AND BOTH ARE SUPPORTED:
#
#   cd <this directory> && docker compose up      # the plain one, defaults, nothing else needed
#   demo/run.sh --docker [--records N ...]        # the same thing with the demo's flags
#
# `docker compose up` on its own is the path to keep working: it is what a reader who has never seen
# this repository will type. It needs no arguments, no environment and no wrapper script - the demo
# service runs with the demo's own defaults, and PC_DEMO_ARGS below is empty unless run.sh sets it.
# Add --build after changing any source, and `docker compose down` to remove the broker afterwards.
#
# The demo container exits when the run finishes; the broker keeps running until you stop it. run.sh
# passes --abort-on-container-exit --exit-code-from demo so that a scripted run stops on its own and
# reports the demo's exit code rather than compose's.

name: pc-go-demo

services:
  broker:
    # Pinned as a literal because a compose file cannot derive anything. run.sh READS THIS LINE for
    # the broker it starts natively, so the pin lives here once rather than in both files; keep it
    # as `image: <ref>` on one line or that read fails loudly. It must track <kafka.version> in the
    # root pom - the mapping is CP major = AK major + 4, so AK 3.9.x means CP 7.9.
    image: confluentinc/cp-kafka:7.9.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # QUIET. A demo is a thing someone WATCHES, and a KRaft broker at INFO emits hundreds of
      # lines of its own configuration, controller elections and log-segment chatter - which buries
      # the two tables the demo exists to show. Kafka's own warnings and errors still come through.
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_TOOLS_LOG4J_LOGLEVEL: WARN
      # ROOT ALONE IS NOT ENOUGH, and this was measured rather than assumed: the cp-kafka image
      # writes kafka=INFO, kafka.controller=TRACE and state.change.logger=TRACE into its own
      # log4j config, and a named logger beats the root. With only the root set, one demo run
      # interleaved 927 broker lines with 35 of the demo's own. These are the named loggers that
      # actually produce the noise.
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.server=WARN,kafka.coordinator=WARN,kafka.log=WARN,kafka.network=WARN,kafka.request.logger=WARN,state.change.logger=WARN,org.apache.kafka=WARN"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bound to the service name, not 0.0.0.0: this image formats its KRaft storage with the same
      # config it boots with, and the format step refuses a non-routable advertised address.
      KAFKA_LISTENERS: PLAINTEXT://broker:9092,CONTROLLER://broker:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # The demo forms one consumer group per arm per replay, and the default three-second settling
      # delay would be charged to every one of them. run.sh sets the same value natively.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 500
    healthcheck:
      # The demo must not start before the broker can serve an API request. Listing topics is the
      # cheapest call that proves that, and it proves more than an open port does.
      test: ["CMD", "kafka-topics", "--bootstrap-server", "broker:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  demo:
    build:
      # The repository, because the sidecar is a JVM application built by a Maven reactor module
      # that cannot build without its parents and siblings. The root .dockerignore is what keeps
      # this from uploading every target/ directory in the tree; the Dockerfile explains the pair.
      context: ../../..
      dockerfile: parallel-consumer-proxy-clients/parallel-consumer-proxy-client-go/demo/Dockerfile
    # A demo that has printed its tables is done. Without this, compose's default would restart a
    # container that exited cleanly and the reader would watch the whole run happen again.
    restart: "no"
    depends_on:
      broker:
        condition: service_healthy
    environment:
      # Supplying this is what stops the demo asking for a broker it cannot start.
      PC_DEMO_BOOTSTRAP: broker:9092
      # The flags demo/run.sh was called with, forwarded as one string.
      PC_DEMO_ARGS: ${PC_DEMO_ARGS:-}
      # EVERY OTHER DIAL, forwarded explicitly. Compose passes nothing it is not told to, so a
      # missing line here is a dial the container silently ignores while the run still prints a
      # fingerprint claiming otherwise. Caught across seven languages at once by
      # bin/ci-demo-conformance.sh, which is why that check exists. Adding a flag means adding it
      # here too.
      PC_DEMO_RECORDS: ${PC_DEMO_RECORDS:-}
      PC_DEMO_DELAY_MS: ${PC_DEMO_DELAY_MS:-}
      PC_DEMO_CONCURRENCY: ${PC_DEMO_CONCURRENCY:-}
      PC_DEMO_PARTITIONS: ${PC_DEMO_PARTITIONS:-}
      PC_DEMO_REPLAY_FACTOR: ${PC_DEMO_REPLAY_FACTOR:-}
      PC_DEMO_TOPIC: ${PC_DEMO_TOPIC:-}
