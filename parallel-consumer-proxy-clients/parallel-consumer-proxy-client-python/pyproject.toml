#
# Build scaffolding for the Python proxy client (astubbs#242). It declares no dependencies on
# purpose - the module proves the interpreter reaches a running program, and anything fetched
# would put the network between toolchain presence and that answer.

[project]
name = "parallel-consumer-proxy-client"
version = "0.0.0"
description = "Parallel Consumer proxy client - build scaffolding"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
