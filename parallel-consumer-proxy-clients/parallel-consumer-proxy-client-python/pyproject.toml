# Copyright (C) 2026 Antony Stubbs and contributors
#
# The Python client's own build file. The pom.xml beside it is a thin wrapper that drives THIS
# under -Dpc.foreignClients; an ordinary Maven build runs no Python at all.
#
# Publishing to PyPI is a later wave's: the version below tracks the Maven project's, and the
# package is installed from a checkout (`make install`) until then.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-consumer"
version = "0.6.0.0.dev0"
description = "Parallel Consumer for Python - ordered concurrent Kafka consumption without the GIL ceiling"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Antony Stubbs and contributors" }]
keywords = ["kafka", "parallel", "consumer", "concurrency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]
# grpcio only. The generated stubs are committed, so protobuf codegen (grpcio-tools) is a
# development dependency and never a user's - a wheel needs no protoc, and an sdist install needs
# no toolchain.
dependencies = ["grpcio>=1.60", "protobuf>=4.25"]

[project.optional-dependencies]
# Static analysis lives here, not in a CI-only install step: `make lint` and the clients workflow's
# Python row run the SAME binaries out of this venv, so the two cannot pin different versions and
# drift (docs/client-static-analysis.md). Both analysers carry an upper bound - an unbounded linter
# reddens the lane on a release day for reasons unrelated to the diff, which is how a real finding
# learns to look like noise. types-grpcio is typeshed's grpc stubs: without them mypy sees the whole
# channel API as Any and the strict pass has nothing to check.
dev = [
    "grpcio-tools==1.73.0",
    "pytest>=8.0",
    "ruff>=0.9,<0.17",
    "mypy>=1.15,<3",
    "types-grpcio>=1.60",
]

[project.urls]
Homepage = "https://github.com/astubbs/parallel-consumer"
Issues = "https://github.com/astubbs/parallel-consumer/issues"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker. Without it a type checker ignores this package's annotations entirely - including
# in this repo's own test suite, which is how the gap was found - so the strict pass over src/ would
# be checking code nobody downstream can benefit from. Shipping the marker is what makes the
# annotations part of the API rather than internal decoration.
[tool.setuptools.package-data]
parallel_consumer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Short timeouts everywhere in the suite; this bound is the backstop for a test that hangs on a
# sidecar that never answers, so it fails the build rather than the job's wall clock.
markers = ["sidecar: needs the test-mode sidecar from the proxy module's test jar"]

[tool.ruff]
line-length = 100
# The generated stubs are protoc's output, not this project's code - reformatting them would be
# undone by the next `make proto`. poc/ is the preserved specification probe: deliberately ugly,
# deliberately unmaintained, and kept as evidence rather than as source.
extend-exclude = ["src/parallel_consumer/_generated", "poc", ".venv"]

[tool.ruff.lint]
# Bug-finding sets, not cosmetics: F is pyflakes (undefined names, unused imports, shadowing), B is
# bugbear (mutable default args, loop-variable capture, except-without-raise-from), S is flake8-
# bandit - the SAME checks the `bandit` tool runs, in-process, which is why bandit itself is not a
# separate dependency here. E/W/UP/SIM/RUF are kept from the module's first wave.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "S"]

# Bandit's three findings on this tree, exempted where each is the file's declared job rather than a
# risk. Narrow on purpose: an exemption wide enough to cover a future mistake is not an exemption.
[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting IS the assert statement; S101 would ban the test suite's only verb.
"tests/**" = ["S101"]
# The generator drives protoc and git by name, from a fixed argv this file builds itself - there is
# no untrusted input to reach either.
"tools/**" = ["S603", "S607"]
# Spawning the JVM sidecar from an argv this module builds is the module's entire purpose, and its
# three asserts narrow an Optional immediately before the same attribute is used - stripped under
# -O they buy an AttributeError one line later, which is what S101 exists to prevent elsewhere. Any
# OTHER file that reaches for assert as a validation guard still fails.
"src/parallel_consumer/sidecar.py" = ["S603", "S101"]

# TYPE CHECKING. mypy runs in two passes with different strictness, and the split is deliberate:
#   src   --strict            the shipped surface, fully annotated, no implicit Any anywhere
#   tests --check-untyped-defs bodies are checked without demanding annotations on every test
#                             function - the value there is catching an attribute that cannot
#                             exist, not decorating 40 test signatures
# Both are `make typecheck`; docs/client-static-analysis.md states the policy and the exact commands.
[tool.mypy]
python_version = "3.10"
# poc/ is the preserved specification probe, kept as evidence and never maintained.
exclude = ["^poc/", "^\\.venv/", "^build/"]
# A stale `# type: ignore` is itself an error, so the inline suppressions below cannot outlive the
# mypy or typeshed release that made them unnecessary.
warn_unused_ignores = true

# protoc's output, checked by nobody: it is regenerated wholesale by `make proto` and any finding in
# it is a bug report for protobuf, not for this module. `follow_imports = skip` also stops mypy
# inferring a shape for the generated classes that the next codegen could invalidate.
[[tool.mypy.overrides]]
module = ["parallel_consumer._generated.*"]
ignore_errors = true
follow_imports = "skip"

# grpcio-tools is a build-time generator with no stubs published; the file that drives it is checked,
# the library it drives is not.
[[tool.mypy.overrides]]
module = ["grpc_tools.*"]
ignore_missing_imports = true
