# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Collapse routine non-major bumps into ONE reviewable PR per run instead of
    # a swarm of one-PR-per-dependency. This is the "big dep upgrade PR" we thought
    # we already had - we never actually configured grouping, so every dep came in
    # separately (that's how jackson-databind arrived as its own PR astubbs#76).
    open-pull-requests-limit: 10
    groups:
      maven-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Deps we manage by hand or that are deferred majors. Declaring the ignores HERE
    # (version-controlled + self-documenting) is better than `@dependabot ignore` PR
    # comments, whose ignore conditions live invisibly in Dependabot's state and give
    # future maintainers no clue why a dependency silently stopped updating.
    # Full rationale for each: docs/inflight/deps-deferred-majors.md.
    #
    # SCOPE EVERY IGNORE TO THE UPDATE YOU ACTUALLY FEAR. A bare `dependency-name` with
    # no `update-types` silences the dependency completely, including the patch release
    # you are waiting for - and an ignore is invisible: nothing reports the PR that was
    # never opened. Write a blanket ignore only when the dependency is FROZEN, meaning
    # you want no movement of any size until a stated condition is met (byte-buddy
    # below is the one honest example). If you expect it to move again, say which sizes
    # are dangerous and let the rest through.
    ignore:
      # Module-local, test-scoped pin coupled to WireMock's Jackson. Bumping it
      # globally forces WireMock onto an incompatible Jackson and breaks VertxTest.
      # Line changes stay hand-managed, via the curated versions-maven-plugin sweep.
      # See parallel-consumer-example-metrics/pom.xml.
      #
      # Patches allowed, minor/major blocked - narrowed for the same reason as the
      # jackson-bom entry below, and deliberately kept the same shape as it, since the
      # two pins are siblings. The recorded hazard is a LINE change; a patch inside the
      # pinned line touches one test-scoped dependency in one example module and is
      # exactly how a future advisory against it would be fixed. The whole-tree CVE scan
      # resolves test scope, so it WILL report such an advisory - and a blanket ignore
      # would leave that red with no automated route to green.
      - dependency-name: "com.fasterxml.jackson.core:jackson-databind"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # The second Jackson pin: the jackson-bom import in
      # parallel-consumer-example-streams, which holds that module at 2.18.9. It needs
      # the same hand management as the databind pin above, and it is a *different*
      # coordinate, so the rule above does not cover it.
      #
      # This one is not just hygiene. Jackson's fixed-version ranges are per-line, and
      # an automated bump can move you INTO a vulnerability: CVE-2026-59889 was
      # introduced in 2.18.0 and fixed only in 2.18.9, and CVE-2026-54518 applies to
      # 2.21.0-2.21.3 only. The root pom greenlights CVE-2026-54518 as a false positive
      # *because this module resolves 2.18.9*; a bump into 2.21.0-2.21.3 would make that
      # finding real while the exclusion silently hid it. Leaving the LINE is therefore a
      # hand-managed decision, and the exclusion list gets re-checked when it happens.
      #
      # Allow patches within the pinned line; block minor/major - the same shape as the
      # micrometer entry below, but here the patch allowance is load-bearing rather than
      # tidy. This started out blanket, which was wrong in a way worth recording: every
      # danger named above is a LINE change (2.18 -> 2.21), while a patch inside 2.18 is
      # the exact thing we are waiting for. The root pom's TEMPORARY exclusions for
      # CVE-2026-68497 and CVE-2026-19032 retire when jackson-databind 2.18.10 reaches
      # Central - a patch bump IS the retirement mechanism - and a blanket ignore
      # suppressed the only PR that would have announced it. Neither id is in OSV, NVD or
      # GHSA, so no Dependabot alert can arrive instead: the ignore was covering the one
      # notification we were relying on. bin/check-cve-exclusions.sh is the backstop for
      # when that happens anyway. See docs/inflight/deps-cve-backlog.md.
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Frozen workaround pin, NOT a dep to track upward: byte-buddy is held at
      # mockito's version because wiremock-jre8 2.35.2 drags in an ancient byte-buddy
      # that breaks mockito (MockitoInitializationException). A bump buys nothing and
      # risks re-breaking it. Remove this pin entirely when wiremock moves to 3.x
      # (which drops the stale transitive) - do not bump it in the meantime.
      #
      # Blanket ON PURPOSE, and the only entry here that should be: the desired state is
      # frozen, so there is no update size we want. Not an oversight left behind when the
      # two Jackson entries were scoped - if a byte-buddy advisory ever lands, the answer
      # is the wiremock 3.x move, not a patch.
      - dependency-name: "net.bytebuddy:*"
      # micrometer 1.13+ renamed the Prometheus registry package -> breaks CoreApp.
      # Allow patches within the pinned line; block minor/major until CoreApp migrates.
      - dependency-name: "io.micrometer:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Deferred majors - each needs a deliberate migration, not a Dependabot PR.
      - dependency-name: "org.apache.kafka:*"          # Kafka 4 (needs Java 11 baseline)
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit.jupiter:*"         # JUnit 6 (needs Java 17 + ArchUnit engine)
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit.platform:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.testcontainers:*"        # Testcontainers 2.x
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.vertx:*"                  # Vert.x 5
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.smallrye.reactive:mutiny" # Mutiny 3
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.tomakehurst:wiremock-jre8" # WireMock 3 (artifact renamed)
        update-types: ["version-update:semver-major"]
  # Re-enabled 2026-08-06. It was switched off in a470ab0b (2022) with the reason
  # "Repo doesn't use github actions anymore" - true then, and long since false: the
  # entire CI estate is Actions, across 24 workflow files. Nothing had bumped an action
  # version in four years, and drift went unnoticed until a human spotted a new file
  # authored at actions/checkout@v4 while 21 other uses were on @v6.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # NOT grouped, unlike the maven ecosystem above - the opposite trade applies here.
    # Grouping buys less noise, and actions bump a few times a YEAR, so there is little
    # noise to buy off. What it costs is isolation, and an action has repo-wide reach: a
    # bad actions/checkout or setup-java breaks every workflow at once. In a grouped PR
    # of five bumps you cannot tell which one broke CI, and cannot merge the safe four.
    # One PR per action keeps each independently testable and revertable.
    #
    # This does NOT fragment an action across versions: Dependabot bumps every use of a
    # given action in one PR regardless, so all 24 actions/checkout uses move together
    # and bin/check-action-versions.sh stays green.
    #
    # No open-pull-requests-limit on purpose. The default cap exists to stop a swarm of
    # Java dependency PRs; actions produce a trickle, and a limit here would silently
    # withhold an update rather than reduce work.
    ignore:
      # Our three own forks (check-dependencies.yml, maven.yml x2). Each is pinned to a
      # SHA that is AHEAD of that fork's newest tag - unreleased work sitting on a branch -
      # so Dependabot would advance them to newer commits on that branch. That is a
      # hand-managed decision tied to changes we make in those repos, not an upgrade to
      # take automatically.
      #
      # This ignore is a WORKAROUND, not a policy: remove it once astubbs#212 is done and the
      # three reference immutable release tags, at which point they should be watched like
      # any other action. See astubbs#212 for the per-fork state and what "done" looks like.
      - dependency-name: "astubbs/*"

  # ══ The proxy clients' seven foreign ecosystems (astubbs#242) ═════════════════════════
  #
  # Until these blocks existed, `maven` and `github-actions` were the ONLY two ecosystems
  # declared, while the language-proxy clients had brought seven more into the tree. Nothing
  # updated any of them and nothing said so - the gap surfaced when a gRPC CVE was found by a
  # CI scan rather than by a bot, on a version pinned when the branch started.
  #
  # THESE ENTRIES DO NOTHING UNTIL THE CLIENT MODULES ARE ON `master`, AND THAT IS NOT A
  # DEFECT - it is the thing to know before concluding they are broken. Dependabot reads the
  # DEFAULT BRANCH: the manifests below live only on the proxy branch today, and GitHub's
  # dependency graph for master currently holds maven and actions packages and nothing else
  # (`gh api repos/astubbs/parallel-consumer/dependency-graph/sbom`). Both channels start the
  # day astubbs/parallel-consumer#293 merges. It also means Dependabot could not have caught
  # the stale gRPC pin, then or now - only a check that runs on the BRANCH can, which is what
  # the per-language audit steps in .github/workflows/clients.yml are for.
  #
  # NO `target-branch` ANYWHERE BELOW, deliberately. Pointing these at the proxy branch would
  # make them work sooner and cost the more valuable half: security updates always target the
  # default branch, so an ecosystem scoped with `target-branch` gets version updates only.
  # Waiting is the cheaper mistake.
  #
  # DAILY AND GROUPED, per the maintainer's call, with the frequency to come down if it is
  # noisy. THE NOISE OBJECTION IS WEAKER THAN THE MODULE COUNT SUGGESTS, and it was measured
  # rather than assumed - each client is a thin facade over generated stubs, so the DIRECT
  # dependency counts per manifest are:
  #
  #     go.mod            2   (+11 indirect, incl. the pinned generator/analyser tools)
  #     Cargo.toml        9   (7 runtime, 1 dev, 1 build)
  #     package.json      8   (2 runtime, 6 dev)
  #     pyproject.toml    7   (2 runtime, 5 dev)
  #     Gemfile           6   (2 runtime, 4 dev)
  #     *.csproj          6   (across three projects; versions centralised in
  #                            Directory.Build.props)
  #     Package.swift     5   (22 pins resolved, transitives included)
  #
  # 43 direct dependencies across all seven. Grouped, the steady state is at most one PR per
  # ecosystem per run and usually none - the maven block alone watches more than this.
  # No `open-pull-requests-limit` for the same reason the actions block gives: the default cap
  # exists to stop a swarm, and a limit that withheld a bump here would be silently costing
  # coverage on the ecosystems that have just acquired it.
  #
  # GROUPED FOLLOWS THE MAVEN TRADE, NOT THE ACTIONS ONE. An action has repo-wide reach, which
  # is why those arrive one PR at a time and stay independently revertable; a foreign client's
  # dependency reaches exactly one module, whose whole build, test, conformance and lint suite
  # is one CI row. A broken bump reddens that row and nothing else, so the isolation a
  # per-dependency PR buys is worth less here than the review attention grouping saves.
  # Minor and patch group; MAJORS ARRIVE SINGLY AND UNGROUPED - the maven shape, for the same
  # reason: a major is a migration and wants its own PR, but must never be silently ignored.
  #
  # NO IGNORES ON ANY OF THESE, AND THAT IS A DECISION. Nothing here is hand-managed yet, and
  # this file's own rule says an ignore is invisible - nothing reports the PR that was never
  # opened - so one written on speculation is worse than the bump it pre-empts. What a reviewer
  # does need to know is the one real coupling, which is a REVIEW note rather than a
  # suppression: every client commits its generated stubs, so a bump to a code generator or to
  # the protobuf/gRPC runtime it generated against (go.mod's `tool` directives,
  # `grpc-tools`/`google-protobuf` in the Gemfile, `grpcio-tools` in the dev extra,
  # `Grpc.Tools`) means regenerating those stubs in the same PR. Grouping helps here: the
  # runtime and its generator move together in one PR rather than in two that pass separately.
  #
  # C++ IS NOT COVERED BY ANYTHING, and is listed here so it does not read as an oversight.
  # parallel-consumer-proxy-client-cpp has no package manager to point an updater at - its
  # CMakeLists.txt resolves everything through find_package/PkgConfig against system packages
  # from the runner image, so there is no manifest, no lockfile, and no version for a bot to
  # bump. Dependabot supports no C++ ecosystem, and neither does anything else we would adopt.
  # Its dependencies move when the image does.
  #
  # The three JVM clients (Java, Kotlin, Scala) need no entry: they are Maven modules, so the
  # `maven` block at the top of this file and the whole-tree OSS Index lane already cover them.

  - package-ecosystem: "gomod"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-go"
    schedule:
      interval: "daily"
    groups:
      go-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The Go benchmark harnesses. Not product code, but their manifests still rot: an unbumpable
  # client library skews the cross-client comparison the bench exists to make. Weekly is enough -
  # a bench arm's dependency moving is a re-measurement trigger, not a security surface.
  - package-ecosystem: "gomod"
    directory: "/bench/franz"
    schedule:
      interval: "weekly"
    groups:
      go-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/bench/llingr"
    schedule:
      interval: "weekly"
    groups:
      go-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-rust"
    schedule:
      interval: "daily"
    # READ A `minor` HERE AS A MAJOR WHEN REVIEWING. Every crate this module depends on is
    # pre-1.0 (tonic 0.14, prost 0.14), and Cargo's compatibility rule for 0.x makes 0.14 -> 0.15
    # a BREAKING change - while Dependabot still classifies it semver-minor and so groups it.
    # Deliberately not split into its own ungrouped entry: the module's four tonic/prost crates
    # have to move together or the generated code stops compiling, so a grouped PR is the shape
    # that can actually be merged. What it costs is that "non-major" is not a safety claim on
    # this row, and the CI row is what establishes safety instead.
    groups:
      cargo-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-typescript"
    schedule:
      interval: "daily"
    groups:
      npm-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "bundler"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-ruby"
    schedule:
      interval: "daily"
    groups:
      bundler-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # pyproject.toml, PEP 621 style with a setuptools backend. Dependabot reads `[project]`
  # dependencies and `[project.optional-dependencies]` - so both the two runtime pins and the
  # five-entry `dev` extra (ruff, mypy, pytest, grpcio-tools, types-grpcio) are watched.
  # `[build-system] requires` is NOT: `setuptools>=68` is outside every updater here, and the
  # only thing that moves it is a human. Named because an unwatched line inside a watched file
  # is exactly the shape that reads as covered.
  - package-ecosystem: "pip"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-python"
    schedule:
      interval: "daily"
    groups:
      pip-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The directory holds Bz.Stub.ParallelConsumer.Proxy.Client.sln, which is what lets one entry
  # reach all three projects (src/ plus the two under tests/) rather than needing a directory
  # each. Their versions are centralised in Directory.Build.props - $(GrpcVersion),
  # $(ProtobufVersion) - which is the .NET side of the fix the root pom's grpc.version got.
  - package-ecosystem: "nuget"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-dotnet"
    schedule:
      interval: "daily"
    groups:
      nuget-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Swift Package Manager. Dependabot matches Package.swift against Package.resolved and skips
  # any dependency whose URL differs between the two, silently - both files are in this
  # directory and the URLs agree today, so if a swift-side bump ever stops arriving, check that
  # first (dependabot/dependabot-core#10296). Nothing else watches this module: Swift has no
  # dependency auditor to put in the CI lane either, which is recorded in clients.yml's audit
  # step, so this entry is its ONLY coverage.
  - package-ecosystem: "swift"
    directory: "/parallel-consumer-proxy-clients/parallel-consumer-proxy-client-swift"
    schedule:
      interval: "daily"
    groups:
      swift-non-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
