# PR Checklist gate - makes .github/PULL_REQUEST_TEMPLATE.md's checklist actually binding.
#
# The template is only a passive nudge (and `gh --body-file` PRs skip it entirely), so this check
# enforces it two ways for human-authored PRs:
#   1. The checklist must be PRESENT - a human PR with zero task-list items fails (otherwise dropping
#      the template is a silent bypass: no boxes -> nothing to be "unchecked" -> vacuous pass).
#   2. Every box present must be resolved - ticked `[x]`, or left `- [ ] ... N/A - <reason>`.
# Real bot PRs (Dependabot/Renovate etc., GitHub user type "Bot") don't use the template and are
# exempt entirely. Re-runs on body edits.
#
# It then enforces the changelog issue-reference convention on top. That gate's logic lives in
# .github/scripts/changelog-ref-gate.js so it can be unit tested; this job runs those tests first.

name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # listFiles, to read the CHANGELOG.adoc patch

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: "PR Checklist"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Needed for the changelog gate's logic module and its unit tests. Only the PR's own tree is
      # checked out, with no credentials - nothing here consumes secrets.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The gate's own logic is subtle enough to have shipped two real misjudgements already, so it
      # is unit tested and the tests run before the gate does.
      - name: Self-test the changelog gate logic
        run: node .github/scripts/changelog-ref-gate.test.js

      - name: Self-test the issue-reference gate logic
        run: node .github/scripts/issue-ref-gate.test.js

      - name: Self-test the roadmap stage gate logic
        run: node .github/scripts/roadmap-stage-gate.test.js

      # The local mirror (bin/check-issue-refs.sh) fetches the PR body via gh to honour the
      # `issue-refs: N/A` opt-out the way this workflow does; that plumbing is shell, not gate
      # logic, so it has its own self-test.
      - name: Self-test the local issue-reference checker's body plumbing
        run: bash bin/test-check-issue-refs.sh

      # Runs BEFORE the gate below, per bin/AGENTS.md. It tests the script's ARGUMENT PARSING, which
      # is a permission boundary rather than a formatting concern: the reviewer is granted
      # `bin/todo-index.sh --check` exactly so it can ask whether the index is stale without being
      # able to rewrite the tree it is inspecting, and the grant is only worth its wording while the
      # script refuses everything else. It also asserts both allowlists still grant the exact command
      # rather than a `:*` prefix - the form that let `--check=false` through
      # (astubbs/parallel-consumer#286).
      - name: Self-test the marker index argument parsing
        run: bash bin/test-todo-index.sh

      # docs/todo-index.md is generated from the markers in the tree, so it can silently stop
      # matching them. Entries are keyed by marker TEXT, not line number, so this only fires when a
      # marker is actually added, removed or reworded - editing above one no longer churns the file.
      - name: Verify the marker index matches the tree
        run: bin/todo-index.sh --check

      - name: Verify checklist is present and resolved (checked or N/A)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Real bots (Dependabot/Renovate) don't use the template - exempt them.
            // This is a GitHub-assigned account type, not something a fork PR can spoof via its body.
            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - checklist gate skipped.`);
              return;
            }

            const body = pr.body || "";
            let boxes = 0;
            const offenders = [];
            for (const line of body.split(/\r?\n/)) {
              // Match a markdown task-list item: "- [ ] text" / "- [x] text"
              const m = line.match(/^\s*[-*]\s*\[( |x|X)\]\s*(.*)$/);
              if (!m) continue;
              boxes++;
              const checked = m[1].toLowerCase() === "x";
              const text = (m[2] || "").trim();
              const naMarked = /\bN\/?A\b/i.test(text);
              if (!checked && !naMarked) offenders.push(text || "(empty item)");
            }

            // A human PR with no checklist at all is a template bypass, not an exemption.
            if (boxes === 0) {
              core.setFailed(
                "No PR checklist found - paste the checklist from .github/PULL_REQUEST_TEMPLATE.md and " +
                "resolve each box (tick `[x]` or mark `N/A - <reason>`). Bots are exempt; humans are not."
              );
              return;
            }

            if (offenders.length) {
              core.setFailed(
                "Incomplete PR checklist - tick each box [x] or mark it 'N/A - <reason>':\n" +
                offenders.map(o => `  - [ ] ${o}`).join("\n")
              );
            } else {
              core.info(`PR checklist OK (${boxes} box(es), all checked or marked N/A).`);
            }

      # A user-visible changelog entry should say WHICH reported problem or request it addresses, so
      # a reader can follow it back. Fork and upstream issues both count.
      #
      # This replaces an earlier rule requiring the entry to cite its own PR. That was a nuisance by
      # construction: the PR number does not exist until the PR is opened, so every PR needed a
      # second push purely to add the reference - which in turn double-triggered the review workflow
      # (astubbs#109). An issue number is known before the work starts.
      #
      # Build & CI is exempt - see SECTIONS_REQUIRING_AN_ISSUE in the gate module for why.
      # Issue references: below #1000 a reference must name its repo - `astubbs#NN` for this fork,
      # `confluentinc#NN` for the original (AGENTS.md -> Issue references). The fork's numbers sit
      # inside confluentinc's range, so a bare number there resolves against whichever repo the reader
      # happens to be in - and often resolves to a real but unrelated issue, which looks fine and is
      # not. Every confluentinc issue is mirrored here, so there is almost always a fork number to
      # cite instead.
      #
      # Deliberately narrow: added lines only, and the files in EXEMPT_PATHS are skipped because a
      # bare number legitimately means confluentinc there. A naive sweep rewrote three of them
      # wrongly, which is why they are named in the gate module rather than left to judgement.
      #
      # THE PR BODY IS CHECKED TOO. It is the surface humans actually read, and a bare `#200` renders
      # there as a working link to the wrong issue - the failure mode this gate exists for, on its
      # most visible page. `gate.prBodyEntry` presents the body to the SAME suspectRefs call as a
      # synthetic file, so there is no second copy of the matching rule; it only drops fenced code
      # blocks, which GitHub does not autolink. The `edited` trigger above already re-runs this job
      # when a body changes, so a body-only fix does not need a push.
      - name: Verify issue references name their repo (diff and PR body)
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-ref-gate.js`);
            const pr = context.payload.pull_request;

            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - issue reference gate skipped.`);
              return;
            }
            if (gate.findOptOut(pr.body || "")) {
              core.info("issue-refs: N/A opt-out present - skipping.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });

            let hits = gate.suspectRefs([...files, gate.prBodyEntry(pr.body)]);

            // File-scoped opt-out (`issue-refs: exempt-file`) is judged against file CONTENT, not
            // the patch, so it holds however small the diff. Fetched only for files that actually
            // have hits - usually none. The control flow lives in the gate module (NO SECOND COPY
            // OF THE RULE); this caller supplies the contents-API reader and the logging.
            hits = await gate.dropFileOptedOutHits(hits, async (path) => {
              const res = await github.rest.repos.getContent({
                ...context.repo, path, ref: pr.head.sha, mediaType: { format: "raw" },
              });
              return String(res.data);
            }, {
              onDrop: (path) => core.info(`${path}: issue-refs: exempt-file present - its hits dropped.`),
              onError: (path, e) => core.info(`${path}: file opt-out check unavailable (${e.message}) - hits kept.`),
            });

            if (hits.length === 0) {
              core.info(
                `No unqualified references below #${gate.QUALIFY_BELOW} on added lines or in the PR body.`);
              return;
            }

            core.setFailed(gate.formatFailure(hits, {
              repo: `${context.repo.owner}/${context.repo.repo}`,
            }));

      - name: Verify new changelog entries cite an issue
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/changelog-ref-gate.js`);
            const pr = context.payload.pull_request;

            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - changelog reference gate skipped.`);
              return;
            }

            // Escape hatch, mirroring the checklist's own N/A convention: a PR that touches the
            // changelog WITHOUT adding an entry of its own (fixing a typo in an older entry, say)
            // can opt out with `changelog-ref: N/A - <reason>` on its own line in the PR body.
            const optOut = gate.findOptOut(pr.body);
            if (optOut) {
              core.info(`Opted out via PR body: "${optOut}"`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const changelog = files.find(f => f.filename === "CHANGELOG.adoc");
            // No patch also covers GitHub omitting it for very large diffs - accepted gap: a giant
            // changelog rewrite would skip the check rather than fail it.
            if (!changelog || !changelog.patch) {
              core.info("No CHANGELOG.adoc change in this PR - nothing to check.");
              return;
            }

            // The section comes from the CHANGELOG itself, not the patch: git has no funcname
            // pattern for asciidoc, so a hunk header here reads `endif::[]` rather than the
            // heading, and entries are too long for three lines of context to reach one.
            const fs = require("fs");
            const changelogText = fs.readFileSync(
              `${process.env.GITHUB_WORKSPACE}/CHANGELOG.adoc`, "utf8");
            const missing = gate.entriesMissingIssue(changelog.patch, changelogText);

            if (missing.length === 0) {
              core.info("Changelog OK - every new entry that needs an issue reference has one.");
              return;
            }

            core.setFailed(
              `New CHANGELOG.adoc entr${missing.length === 1 ? "y does" : "ies do"} not cite an issue.\n` +
              `Entries under ${gate.SECTIONS_REQUIRING_AN_ISSUE.join(" / ")} should say which reported problem or request they address.\n` +
              `Link the issue explicitly - a bare #NN is ambiguous, since issues and PRs share one number sequence:\n` +
              `  fork:     (https://github.com/${context.repo.owner}/${context.repo.repo}/issues/NN[#NN])\n` +
              `  upstream: (upstream https://github.com/confluentinc/parallel-consumer/issues/NN[#NN])\n` +
              `If there genuinely is no issue, put "changelog-ref: N/A - <reason>" on its own line in the PR body.\n\n` +
              `Entr${missing.length === 1 ? "y" : "ies"} missing one:\n` +
              missing.map(l => `  ${l.trim().slice(0, 160)}`).join("\n")
            );

      # The roadmap's stage ladder says how real each entry is, and its own rule is that the PR
      # advancing a track moves the stage in the same change (docs/data/roadmap.yaml, `stages`
      # block). This step is what catches a miss: when the BASE branch's roadmap names this PR as
      # an entry's carrier (`pull_request: astubbs#NNN`), the PR must touch the roadmap or opt out
      # with `roadmap-stage: N/A - <reason>` in its body. Base, not head, is read deliberately:
      # master is the authority on which entries currently claim this PR.
      - name: Verify a roadmap-carrying PR moves its entry's stage
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/roadmap-stage-gate.js`);
            const pr = context.payload.pull_request;

            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - roadmap stage gate skipped.`);
              return;
            }
            const optOut = gate.findOptOut(pr.body || "");
            if (optOut) {
              core.info(`Opted out via PR body: "${optOut}"`);
              return;
            }

            let roadmapText = "";
            try {
              const res = await github.rest.repos.getContent({
                ...context.repo, path: gate.ROADMAP_PATH, ref: pr.base.sha,
                mediaType: { format: "raw" },
              });
              roadmapText = String(res.data);
            } catch (e) {
              core.info(`No ${gate.ROADMAP_PATH} on the base ref (${e.message}) - nothing to check.`);
              return;
            }

            const claims = gate.entriesClaimingPr(roadmapText, pr.number);
            if (claims.length === 0) {
              core.info("No roadmap entry names this PR as its carrier - nothing to check.");
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            if (gate.touchesRoadmap(files)) {
              core.info(
                `Roadmap entr${claims.length === 1 ? "y" : "ies"} ` +
                `${claims.map(c => c.id).join(", ")} name this PR and it touches ` +
                `${gate.ROADMAP_PATH} - OK.`);
              return;
            }

            core.setFailed(gate.formatFailure(claims, pr.number));
