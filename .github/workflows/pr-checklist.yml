# PR Checklist gate - makes .github/PULL_REQUEST_TEMPLATE.md's checklist actually binding.
#
# The template is only a passive nudge (and `gh --body-file` PRs skip it entirely), so this check
# enforces it two ways for human-authored PRs:
#   1. The checklist must be PRESENT - a human PR with zero task-list items fails (otherwise dropping
#      the template is a silent bypass: no boxes -> nothing to be "unchecked" -> vacuous pass).
#   2. Every box present must be resolved - ticked `[x]`, or left `- [ ] ... N/A - <reason>`.
# Real bot PRs (Dependabot/Renovate etc., GitHub user type "Bot") don't use the template and are
# exempt entirely. Re-runs on body edits.

name: PR Checklist

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read # listFiles, to read the CHANGELOG.adoc patch

concurrency:
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checklist:
    name: "PR Checklist"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify checklist is present and resolved (checked or N/A)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Real bots (Dependabot/Renovate) don't use the template - exempt them.
            // This is a GitHub-assigned account type, not something a fork PR can spoof via its body.
            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - checklist gate skipped.`);
              return;
            }

            const body = pr.body || "";
            let boxes = 0;
            const offenders = [];
            for (const line of body.split(/\r?\n/)) {
              // Match a markdown task-list item: "- [ ] text" / "- [x] text"
              const m = line.match(/^\s*[-*]\s*\[( |x|X)\]\s*(.*)$/);
              if (!m) continue;
              boxes++;
              const checked = m[1].toLowerCase() === "x";
              const text = (m[2] || "").trim();
              const naMarked = /\bN\/?A\b/i.test(text);
              if (!checked && !naMarked) offenders.push(text || "(empty item)");
            }

            // A human PR with no checklist at all is a template bypass, not an exemption.
            if (boxes === 0) {
              core.setFailed(
                "No PR checklist found - paste the checklist from .github/PULL_REQUEST_TEMPLATE.md and " +
                "resolve each box (tick `[x]` or mark `N/A - <reason>`). Bots are exempt; humans are not."
              );
              return;
            }

            if (offenders.length) {
              core.setFailed(
                "Incomplete PR checklist - tick each box [x] or mark it 'N/A - <reason>':\n" +
                offenders.map(o => `  - [ ] ${o}`).join("\n")
              );
            } else {
              core.info(`PR checklist OK (${boxes} box(es), all checked or marked N/A).`);
            }

      # AGENTS.md's changelog reference convention ("link the PR/issue") was being missed routinely,
      # for a structural reason rather than carelessness: the entry is written BEFORE the PR exists,
      # so at authoring time there is no number to cite and nothing later prompts you to return. Four
      # PRs in a row (#100-#103) shipped an entry with no self-reference until a human spotted each
      # one. That is exactly the kind of "you must remember" rule worth making mechanical.
      - name: Verify new changelog entries reference this PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.user && pr.user.type === "Bot") {
              core.info(`Author ${pr.user.login} is a Bot - changelog reference gate skipped.`);
              return;
            }

            // Escape hatch, mirroring the checklist's own N/A convention: a PR that touches the
            // changelog WITHOUT adding an entry of its own (fixing a typo in an older entry, say)
            // can opt out by putting `changelog-ref: N/A - <reason>` in the PR body.
            // Anchored to its own line, and the reason is mandatory - otherwise a body that merely
            // QUOTES the syntax mid-prose (like this PR's own description) silently disables the gate.
            const body = pr.body || "";
            const optOut = body.match(/^\s*changelog-ref:\s*N\/?A\b\s*-\s*\S[^\n]*/im);
            if (optOut) {
              core.info(`Opted out via PR body: "${optOut[0].trim()}"`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const changelog = files.find(f => f.filename === "CHANGELOG.adoc");
            // No patch also covers GitHub omitting it for very large diffs - accepted gap: a giant
            // changelog rewrite would skip the check rather than fail it.
            if (!changelog || !changelog.patch) {
              core.info("No CHANGELOG.adoc change in this PR - nothing to check.");
              return;
            }

            // Only genuinely NEW entry lines matter (asciidoc bullets, "* ..."). Git shows an edit
            // to an existing single-line entry as an adjacent -/+ pair, so each "+" bullet first
            // consumes an unmatched "-" bullet from the same change block (that's an edit, exempt);
            // only leftover "+" bullets are new entries. Entries are single-line by convention -
            // a citation on a wrapped continuation line would not be seen.
            const isBullet = l => /^\s*\*\s+\S/.test(l);
            const addedEntries = [];
            let removedBullets = 0;
            for (const line of changelog.patch.split(/\r?\n/)) {
              if (line.startsWith("-")) {
                if (isBullet(line.slice(1))) removedBullets++;
              } else if (line.startsWith("+")) {
                if (isBullet(line.slice(1))) {
                  if (removedBullets > 0) removedBullets--;
                  else addedEntries.push(line.slice(1));
                }
              } else {
                removedBullets = 0; // context line or hunk header ends the change block
              }
            }

            if (addedEntries.length === 0) {
              core.info("CHANGELOG.adoc changed but no new entry lines added - nothing to check.");
              return;
            }

            // \b stops #100 matching inside #1000.
            const ref = new RegExp(`(pull/${pr.number}\\b|#${pr.number}\\b)`);
            const referencing = addedEntries.filter(l => ref.test(l));

            if (referencing.length === 0) {
              core.setFailed(
                `New CHANGELOG.adoc entr${addedEntries.length === 1 ? "y does" : "ies do"} not reference this PR (#${pr.number}).\n` +
                `AGENTS.md: "a bare #NN refers to this fork ... and link the PR/issue".\n` +
                `Add e.g. (https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${pr.number}[#${pr.number}]) to the entry.\n` +
                `If this PR deliberately adds no entry of its own, put "changelog-ref: N/A - <reason>" in the PR body.\n\n` +
                `Entr${addedEntries.length === 1 ? "y" : "ies"} added:\n` +
                addedEntries.map(l => `  ${l.trim().slice(0, 160)}`).join("\n")
              );
              return;
            }

            core.info(`Changelog reference OK (${referencing.length}/${addedEntries.length} new entr(y/ies) cite #${pr.number}).`);
