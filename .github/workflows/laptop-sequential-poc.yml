# PoC: run the integration suite SEQUENTIALLY on a self-hosted runner.
#
# Why sequential: enabling JUnit parallel execution is ~7-10x faster on real
# cores but leaves the integration suite flaky (~2/104 fail per run, different
# tests each run - test-level concurrency races, see
# docs/solutions/test-flakiness/parallel-integration-tests-flaky-under-concurrency-2026-07-28.md).
# Sequential has no such races, so this proves a *reliable, green* integration
# run on the dedicated `mac-laptop` runner, offloaded from GitHub. On this branch
# the `ci` profile already sets parallel-tests=false, so `bin/ci-integration-test.sh`
# runs sequentially with no override.
#
# SECURITY (public repo + self-hosted runner):
#   This workflow must NEVER run untrusted fork-PR code on the home machine. A
#   `pull_request` trigger is unsafe here: for pull_request events GitHub uses the
#   workflow file from the PR head, so a fork could edit THIS file (delete any
#   in-workflow same-repo guard) and run arbitrary code on the runner. So we do
#   NOT trigger on pull_request. Instead: `push` to this repo's own branch (only
#   collaborators with write access can push - forks cannot) plus manual
#   `workflow_dispatch`. Neither can be driven by an external fork, so no
#   in-workflow guard is needed. Never add `pull_request` or `pull_request_target`.

name: Laptop Sequential PoC

on:
  push:
    # Only pushes to this repo's branch (write access required) reach the runner.
    branches: [dev/self-hosted-runner]
  workflow_dispatch:

concurrency:
  # One run at a time on the single self-hosted runner.
  group: laptop-seq-poc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sequential-integration:
    name: "Integration (sequential, self-hosted)"
    # No guard needed: push (write-access only) and workflow_dispatch cannot be
    # driven by an external fork. See the SECURITY note at the top of this file.
    runs-on: [self-hosted, performance]
    continue-on-error: true      # PoC / FYI - never a required gate
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # Don't cache here - self-hosted runners persist .m2 across runs already.
          cache: ''

      - name: Show environment
        run: |
          java -version
          docker --version
          docker info | head -20

      - name: Run integration suite (sequential)
        run: |
          # No -Dparallel-tests override: the ci profile defaults to false here,
          # so this runs one test at a time (reliable, no concurrency races).
          time bin/ci-integration-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laptop-sequential-integration-reports-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 30
