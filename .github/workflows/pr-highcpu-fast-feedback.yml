# Optional, NON-GATING fast feedback on a self-hosted high-CPU runner (many-core Linux, native Docker).
#
# Two jobs: (1) a matrix of unit + integration + mutation that run concurrently on real cores, and
# (2) a SEPARATE, isolated Performance job that `needs` the matrix so the throughput benchmark measures on a
# quiet box (it's hypersensitive to co-runner load - grumpy solo 1m54 vs 7m18 sharing the box). Far faster
# than GitHub's 2-core gate. The runner may be offline at any time, so these jobs are FYI only:
# continue-on-error + not-required means an offline runner never blocks a merge (the required gate stays
# GitHub-hosted, see maven.yml). When the runner is offline the jobs simply queue and are skipped by the guard.
#
# SECURITY (public repo + self-hosted runner): guarded to SAME-REPO pull requests only, so a fork PR's
# untrusted code NEVER runs on the self-hosted machine (RCE). pull_request (no secrets), never pull_request_target.
#
# IMPORTANT - this `if:` guard lives IN the PR-head workflow file, so a fork PR could edit it out in the same
# PR. The real backstop is a GitHub repo setting, NOT this file: Settings -> Actions -> General -> "Fork pull
# request workflows from outside collaborators" MUST be set to "Require approval for ALL outside collaborators"
# (the default only gates FIRST-TIME contributors - a fork author with one prior merged PR would otherwise be
# auto-approved and could reach this self-hosted runner). Keep that setting on, or don't trigger on
# `pull_request` at all (mirror self-hosted-tests.yml). See docs/SELF_HOSTED_RUNNER.md.

name: PR High-CPU Fast Feedback

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-highcpu-fast-feedback-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  highcpu-build-test:
    name: "Build & Test - ${{ matrix.suite-name }} (high-CPU self-hosted, optional)"
    # Same-repo PRs only: fork PRs are untrusted and must NOT execute on the self-hosted machine.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, highcpu]
    continue-on-error: true      # optional / FYI - never a required gate (the runner may be offline)
    timeout-minutes: 60
    strategy:
      fail-fast: false           # each suite is independent
      matrix:
        include:
          # Doubled again to probe the ceiling: Unit 2 forks PER CORE (2C = ~64 JVMs on 32 cores), Integration
          # 16 brokers. Deliberately oversubscribed - watch for it getting SLOWER (fork/JVM startup churn beats
          # the added parallelism) or OOM (16 Testcontainers Kafka brokers + 64 forks vs 48GB RAM).
          - suite-name: "Unit"
            cmd: "bin/ci-unit-test.sh -DforkCount=2C"
          - suite-name: "Integration"
            cmd: "bin/ci-integration-test.sh -DforkCount=16 -DreuseForks=true"
          # Mutation (PIT) is CPU-bound (not a throughput benchmark), so it shares the box with unit/integration.
          # PIT runs one minion JVM per thread; cranked 2 -> 16 (was tuned for GitHub's 2 cores). Peak heap ~=
          # threads x 2g = ~32g, fits in 48GB. -Dverbose streams per-mutation progress; drop once eyeballed.
          - suite-name: "Mutation (PIT)"
            cmd: "bin/ci-mutation-test.sh -Dverbose=true -Dthreads=16"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Show environment
        run: |
          java -version
          echo "cpus: $(nproc)"
          docker --version
          docker info | head -20

      - name: ${{ matrix.suite-name }} tests
        run: time ${{ matrix.cmd }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: highcpu-fast-feedback-reports-${{ matrix.suite-name }}-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 14

  # Performance is a THROUGHPUT benchmark, so its wall-clock is dominated by measured pipeline speed and is
  # hypersensitive to ANY co-runner load (not just CPU saturation). It therefore runs in its OWN job that
  # `needs` the matrix, so it measures on a quiet box. `!cancelled()` (not `success()`) so it still runs even
  # when a matrix suite is red (they're continue-on-error / FYI).
  highcpu-performance:
    name: "Build & Test - Performance (high-CPU self-hosted, ISOLATED)"
    needs: [highcpu-build-test]
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, highcpu]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Show environment
        run: |
          java -version
          echo "cpus: $(nproc)"
          uptime

      - name: Performance tests (isolated - box should be quiet)
        run: time bin/performance-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: highcpu-fast-feedback-reports-Performance-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 14
