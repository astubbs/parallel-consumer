# Optional, NON-GATING fast feedback on a self-hosted high-CPU runner (many-core Linux, native Docker).
#
# Runs unit + integration + performance + mutation as separate matrix jobs concurrently on real cores - far
# faster than GitHub's 2-core gate. The runner may be offline at any time, so these jobs are FYI only:
# continue-on-error + not-required means an offline runner never blocks a merge (the required gate stays
# GitHub-hosted, see maven.yml).
#
# TRIGGER - workflow_dispatch ONLY for now: with no `[self-hosted, highcpu]` runner registered yet, a
# `pull_request:` trigger would leave these jobs QUEUED FOREVER as eternally-pending checks on every PR
# (the exact pollution that got pr-mac-fast-feedback.yml's PR trigger disabled). Re-add `pull_request:`
# below once the runners are registered AND reliably online. Run on demand meanwhile:
# `gh workflow run highcpu --ref <branch>` or Actions -> highcpu -> Run workflow.
#
# Tuning (measured on this 16c/32t box): unit forks 1-per-core (1C=32); more (2C) is flat, so 1C is the knee.
# Integration is capped at 8 Kafka-broker forks (16 was SLOWER - per-broker overhead beats the parallelism).
# Performance runs concurrently too: it's just a correctness gate here, and its *timing* is noisy under load
# (accurate benchmarking belongs in a separate isolated/on-demand run - highcpu runner solo is ~1m54 vs GitHub ~3m50).
#
# SECURITY (public repo + self-hosted runner): guarded to SAME-REPO pull requests only, so a fork PR's
# untrusted code NEVER runs on the self-hosted machine (RCE). pull_request (no secrets), never pull_request_target.
#
# IMPORTANT - this `if:` guard lives IN the PR-head workflow file, so a fork PR could edit it out in the same
# PR. The real backstop is a GitHub repo setting, NOT this file: Settings -> Actions -> General -> "Fork pull
# request workflows from outside collaborators" MUST be set to "Require approval for ALL outside collaborators"
# (the default only gates FIRST-TIME contributors - a fork author with one prior merged PR would otherwise be
# auto-approved and could reach this self-hosted runner). Keep that setting on, or don't trigger on
# `pull_request` at all (mirror self-hosted-tests.yml). See docs/SELF_HOSTED_RUNNER.md.

name: highcpu

on:
  # was: pull_request: — re-enable when a [self-hosted, highcpu] runner is registered and reliably online
  # (until then it would only queue eternally-pending PR checks). See the TRIGGER note above.
  workflow_dispatch:

# NOTE: concurrency is JOB-level (per suite), not workflow-level - see the job's `concurrency:` block.
# A single workflow-level group made every new push's fast suites queue ~5 minutes behind the previous
# run's Mutation (PIT) job: cancel-in-progress signalled it, but the maven/PIT JVM tree rides out the
# runner's full cancellation grace before force-kill, and the group only frees once the old run fully
# completes. Per-suite groups mean a push's Unit/Integration/Performance start within seconds (their
# predecessors finish or die fast); only Mutation queues behind old Mutation - fine for an advisory job.

permissions:
  contents: read

jobs:
  highcpu-build-test:
    # Check name shows as "highcpu / <suite> (optional)".
    name: "${{ matrix.suite-name }} (optional)"
    # Same-repo PRs only: fork PRs are untrusted and must NOT execute on the self-hosted machine.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, highcpu]
    continue-on-error: true      # optional / FYI - never a required gate (the runner may be offline)
    timeout-minutes: 60
    # Per-suite superseding: a new push cancels only ITS OWN suite's previous run, so fast suites start
    # within seconds instead of queueing behind the old run's slow-dying Mutation job (see header note).
    concurrency:
      group: highcpu-${{ matrix.suite-name }}-${{ github.head_ref || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false           # each suite is independent
      matrix:
        include:
          # Fork-only sweet spot. (fork x threads was measured: SAFE - JUnit thread-parallelism no longer races,
          # Unit went green - but NOT faster (forking already saturates the cores), so no reason to keep it.
          # Useful finding for the inflight "Step 2" thread-parallelism question.)
          # Unit: 1 fork PER CORE (1C = 32). Integration: 8 broker-forks (16 was slower).
          - suite-name: "Unit"
            cmd: "bin/ci-unit-test.sh -DforkCount=1C"
          - suite-name: "Integration"
            cmd: "bin/ci-integration-test.sh -DforkCount=8 -DreuseForks=true"
          # Performance: a correctness gate here (timing is noisy under concurrency - that's fine).
          - suite-name: "Performance"
            cmd: "bin/performance-test.sh"
          # Mutation (PIT): one minion JVM per thread. threads=16 (~2g heap each ~= RAM ceiling on 48GB). Biggest
          # future win is scope restriction (mutate only changed classes on PRs), not more threads. See inflight.
          - suite-name: "Mutation (PIT)"
            cmd: "bin/ci-mutation-test.sh -Dverbose=true -Dthreads=16"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Show environment
        run: |
          java -version
          echo "cpus: $(nproc)"
          docker --version
          docker info | head -20

      - name: ${{ matrix.suite-name }} tests
        run: time ${{ matrix.cmd }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: highcpu-fast-feedback-reports-${{ matrix.suite-name }}-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 14
