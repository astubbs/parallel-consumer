# Copyright (C) 2026 Antony Stubbs and contributors
#
# Publishes a SNAPSHOT to Maven Central after the "CI" workflow passes on master.
#
# master is ALWAYS a -SNAPSHOT. Real releases are cut by release.yml (tag-as-truth), NOT here.
# This workflow only ever publishes snapshots — it does not detect, tag, or release anything, and
# it never scans git history. (An earlier version scanned history for a "prepare release" commit
# and re-released an ancient upstream commit; that logic is deleted. See
# docs/plans/2026-07-28-release-pipeline-hardening.md.)
#
# Required secrets: MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, MAVEN_GPG_PRIVATE_KEY, MAVEN_GPG_PASSPHRASE

name: Publish snapshot to Maven Central

on:
  workflow_run:
    workflows: ["CI"]
    branches: [ master ]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-snapshot:
    name: Publish snapshot
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Guard - master must be a -SNAPSHOT
        run: |
          V=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          case "$V" in
            *-SNAPSHOT) echo "Publishing snapshot $V" ;;
            *) echo "::error::master is at a non-SNAPSHOT version ($V). Releases go through release.yml, not this workflow."; exit 1 ;;
          esac

      - name: Deploy snapshot to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # Examples are sample code, not library artifacts — excluded from the deploy.
          ./mvnw --batch-mode -Pmaven-central -Pci \
            -pl '!:parallel-consumer-examples,!:parallel-consumer-example-core,!:parallel-consumer-example-metrics,!:parallel-consumer-example-streams,!:parallel-consumer-example-vertx,!:parallel-consumer-example-reactor' \
            clean deploy -DskipTests
