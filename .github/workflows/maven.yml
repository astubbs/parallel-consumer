# PR builds:
#   Default Kafka version (3.9.1) split into unit, integration, and performance
#   suites in parallel for fast feedback, plus an experimental Kafka 4.x
#   compatibility check.
#
# Push builds (master):
#   Single full build on default Kafka version (3.9.1) to gate SNAPSHOT publishing.
#
# Caching strategy:
#   All jobs use explicit cache/restore with restore-keys fallback to the
#   prepare-deps rotating cache. Do NOT use setup-java's built-in `cache: maven`
#   anywhere - its immutable keys can freeze an incomplete cache permanently.
#   See docs/solutions/build-errors/maven-central-timeout-azure-west-regions-2026-04-21.md

name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # ── Shared ────────────────────────────────────────────────────────────

  # Pre-warm the Maven dependency cache so all downstream jobs start with
  # everything local. Without this, jobs on Azure West US regions hit
  # Maven Central CDN timeouts (see docs/solutions/build-errors/).
  prepare-deps:
    name: "cache"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # No `cache: maven` - see caching strategy note at top of file
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Download all dependencies
        run: ./mvnw --batch-mode -Pci dependency:go-offline -DincludeScope=test -U
      - name: Save Maven cache (rotating key)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}

  # ── PR Builds ──────────────────────────────────────────────────────────

  # Default Kafka version: split suites for fast, parallel feedback.
  # Uses the same scripts as local development (ci-unit-test.sh, etc.)
  test:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: "Unit Tests"
            cmd: "bin/ci-unit-test.sh"
            timeout: 15
          - suite: integration
            name: "Integration Tests"
            # Forked (process-parallel) mode: each JVM fork gets its own TestContainers
            # broker, so tests don't contend one shared broker. Reliable AND parallel,
            # without masking anything (each test runs on an uncontended broker). See
            # docs/solutions/test-flakiness/. forkCount=4 matches the self-hosted measurement.
            cmd: "bin/ci-integration-test.sh -DforkCount=4 -DreuseForks=true"
            timeout: 60
          - suite: performance
            name: "Performance Tests"
            cmd: "bin/performance-test.sh"
            timeout: 60
          # Chaos Pain Suite - the per-PR ambient tripwire. It ran on the self-hosted `highcpu` box
          # until 2026-08-26, on the premise that it needed many real cores to provoke anything.
          # Measured head-to-head on the SAME commit (d8beb162f), that premise did not survive:
          # hosted 13m59s vs self-hosted 12m16s, both green. 14% of wall-clock is not worth a shared
          # physical machine, and the sharing was the root of every scheduling problem the highcpu
          # lane had - a hosted runner gives each job its own VM, so co-residency cannot happen.
          #
          # bin/chaos-test.sh needed no change to move here, which is the tell that the premise was
          # never load-bearing: it passes no forkCount and no -Dparallel-tests, so the suite was
          # never configured to exploit those cores.
          #
          # GATING, like the suite it replaces: a chaos RED is a real finding, so this entry is
          # deliberately NOT `optional`. bin/chaos-test.sh excludes @Quarantined scenarios (the
          # Quarantine Lane owns them) and flags a zero-tests-selected window loudly in the job
          # summary rather than impersonating a green - read that before trusting a pass.
          # On-demand seeded hunts (specific seed/reps) stay in chaos-pain.yml.
          - suite: chaos
            name: "Chaos Pain Suite"
            cmd: "bin/chaos-test.sh"
            timeout: 60
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    # NO continue-on-error: every suite in this matrix gates. If you add an advisory trial lane, give
    # the entry an `optional` key and set `continue-on-error: ${{ matrix.optional == 'true' }}` -
    # actionlint rejects a matrix property no entry defines, so the expression cannot sit here unused.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}

      # CHAOS ONLY. The self-hosted lane used to upload these as
      # `highcpu-fast-feedback-reports-Chaos Pain Suite-*`; moving chaos here would otherwise have
      # dropped them silently - a regression nothing goes red for. They are load-bearing for
      # diagnosis rather than a nicety: a chaos failure is read out of the failsafe XML, and
      # docs/solutions/workflow-issues/gh-run-view-log-truncation.md exists because the job LOG is
      # unreliable for this suite - the artifact survives where the log stream does not. Cited from
      # docs/inflight/bug-857-family.md; keep the name greppable if you rename it.
      - name: Upload chaos test reports
        if: always() && matrix.suite == 'chaos'
        uses: actions/upload-artifact@v7
        with:
          name: chaos-suite-reports-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 14

      # PERFORMANCE ONLY, and the retention is deliberately not the chaos lane's 14 days above.
      # Those reports diagnose ONE failure and are read within days. These are the accumulation
      # itself: docs/inflight/perf-throughput-regression-gate.md defers a throughput gate until
      # somebody has seen the real spread, and until this step existed the only surviving copy of any
      # number was the PC-THROUGHPUT lines inside the job log - which is exactly the artefact
      # docs/solutions/workflow-issues/gh-run-view-log-truncation.md says truncates silently when read
      # the obvious way. A short window here would defeat the purpose of collecting at all.
      #
      # THIS IS A STOPGAP AND SHOULD NOT BE READ AS THE GATE'S PRECONDITION BEING MET. An artifact is
      # per-run and still expires, so a distribution still means downloading N runs by hand
      # (`gh run download <run-id> -n performance-throughput-<n>`). It replaces log-scraping with a
      # machine-readable file; it does not accumulate. Storing a series durably was considered and
      # declined - no data branch, no write grant (operator decision, 2026-09-01).
      - name: Upload throughput summary
        if: always() && matrix.suite == 'performance'
        uses: actions/upload-artifact@v7
        with:
          name: performance-throughput-${{ github.run_number }}
          path: '**/target/performance-throughput.txt'
          retention-days: 90
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ${{ matrix.suite }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mutation testing (PIT). ci-mutation-test.sh scopes to the classes CHANGED vs the PR base
  # (GITHUB_BASE_REF), so it's fast enough for the 2-core hosted runner - the full internal.* sweep would
  # time out here (which is why it used to be self-hosted-only).
  #
  # ADVISORY ABOUT SCORES, NOT ABOUT ITSELF. `continue-on-error: true` stays - it keeps a mutation
  # result from failing the workflow run, while the check ROW still renders red when the step fails
  # (measured, see docs/inflight/ci-mutation-lane-skip-reads-as-a-pass.md). So red was always
  # honest here and green never was: measured 2026-08-25 over the last 40 pull_request runs of this
  # workflow, 40 green ticks and zero mutants scored, because every path out of the script exited 0.
  # The step below reads bin/ci-mutation-test.sh's exit code instead and reacts to each state
  # separately - survivors still fail nothing, but a lane that could not run, or ran and measured
  # nothing, now goes red. The exit-code contract lives in that script's header;
  # docs/inflight/ci-mutation-testing.md has the measurement.
  mutation:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    name: "Mutation Tests (PIT, PR-scoped)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true      # advisory - never gates merge; a failed STEP still reddens the row
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # ci-mutation-test.sh diffs vs the PR base to scope to changed classes
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Self-test the mutation verdict
        # Ahead of the lane it protects, the same ordering repo-hygiene.yml and pr-checklist.yml use.
        # Seconds, no maven: it feeds canned PIT logs through the verdict and asserts the exit codes.
        run: bash bin/test-ci-mutation-test.sh

      - name: Mutation testing (changed classes only)
        run: |
          set +e
          bin/ci-mutation-test.sh
          rc=$?
          set -e
          case "$rc" in
            0) echo "PIT scored mutants - see the job summary for the survivor list." ;;
            3) echo "::notice::PIT had nothing in scope: no core main-source class in a decidable package changed." ;;
            2) echo "::error::PIT could not run, or ran and scored nothing. This is a broken lane, not a clean PR."
               exit 1 ;;
            *) echo "::error::PIT exited ${rc}."
               exit "$rc" ;;
          esac

  # Quarantine AUDIT: the seconds-fast enforcement job on every PR - registry drift and broken owner
  # claims are real, actionable errors that turn it red. It does NOT run any tests (that is
  # the Quarantine Lane workflow: every PR push + every merge to master + dispatch) so the PR checks list gets its verdict in seconds.
  # Discipline: no quarantine without diagnosis; quarantine is master-state, not PR-state. See the
  # @Quarantined javadoc (parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/Quarantined.java).
  quarantine-audit:
    if: github.event_name == 'pull_request'
    name: "quarantine: audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Enforce registry (docs/quarantined-tests.md matches @Quarantined annotations)
        run: bin/check-quarantine-registry.sh
      - name: Verify owner claims (each quarantined test's fix PR exists, is open, and removes the quarantine)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check-quarantine-owners.sh

  # Documentation-data AUDIT: structure only. docs/features/*.yaml and docs/data/*.yaml are
  # hand-written and a documentation generator reads them, so a malformed file or a missing required
  # field produces a broken generated page rather than a loud error. This checks that each file
  # parses, declares its kind, carries what that kind requires, and points at README anchors that
  # exist. It deliberately does NOT check whether the claims are true - nothing can, and a check that
  # implied otherwise would be worse than none.
  docs-data-audit:
    if: github.event_name == 'pull_request'
    name: "docs data: audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install the YAML parser the check needs
        run: python3 -m pip install --quiet pyyaml
      # Self-test first, same as the copyright and sigpipe scanners: this guard has twice shipped
      # green on a failure it was written to catch, so the cases that pin those gaps have to run
      # where a regression is visible. It mutates the corpus one way at a time and restores it, so
      # the guard step below still sees an untouched tree.
      - name: Self-test the guard (each case is a gap it once had)
        run: bash bin/test-check-docs-data.sh
      - name: Validate release-documentation data structure
        run: bin/check-docs-data.sh

  # Experimental Kafka 4.x compatibility check. Non-blocking.
  # DISABLED pending the Kafka 4.x migration work: the experimental 4.x build currently fails and just adds
  # a red X of noise to every PR (it is continue-on-error, so it never gated merges). Re-enable by restoring
  # the `if: github.event_name == 'pull_request'` condition below when the Kafka 4 work starts. See docs/inflight/ci-disabled-jobs-and-runner-load.md.
  test-kafka-compat:
    if: false # was: github.event_name == 'pull_request' — re-enable when Kafka 4.x work begins
    needs: prepare-deps
    name: "compat: kafka 4.x (experimental)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test (Kafka 4.x)
        run: bin/ci-build.sh '[3.9.1,5)'
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ak-experimental
          token: ${{ secrets.CODECOV_TOKEN }}

  # Duplicate code detection using both PMD CPD and jscpd engines.
  # See https://github.com/astubbs/duplicate-code-cross-check
  duplicate-detection:
    if: github.event_name == 'pull_request'
    name: "dups: clones"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-cross-check@c828d78862927d89f6b851a7b0fdba9af6875b3b # v1 + astubbs/duplicate-code-cross-check#8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # SCAN EVERYTHING. There is nothing here to exclude, and three earlier attempts at a
          # whitelist all failed the same way - silently under-scanning a repo that keeps growing.
          # The listed version missed the five `parallel-consumer-examples/*` modules and all of
          # `bin`/`.github`, which is where the duplication this job exists for actually hid; a
          # `find -mindepth 2` version encoded "is this code?" as "how deep is it?"; a
          # `<packaging>pom</packaging>` version needed grepping XML internals.
          #
          # What a whitelist would be protecting against, checked rather than assumed:
          #   * build output - `target/` has ZERO tracked files and this job checks out without
          #     building, so it is not on disk. (If a build step is ever added ABOVE this one, that
          #     stops being true: jscpd still ignores `**/target/**` by default, CPD would not.)
          #   * `.git`, node_modules, vendor - already excluded by the action's own scan and by
          #     jscpd's default ignore pattern.
          #   * CPD's language auto-detect is winner-take-all, so a wider scan could in principle
          #     switch it off Java. It cannot here: java is 244 files against 37 xml, the next
          #     CPD-mappable extension, and md/sh/yaml are not mappable at all. Worth re-checking
          #     if a large module in another language ever lands.
          directories: '.'
          # THE TWO GUARDS DO DIFFERENT JOBS, and only one of them is denominator-proof.
          #
          # `max-increase` (+0.1%, the default) is the per-PR regression guard: base and head are
          # measured with the same configuration, so it never needs manual recalibration as the repo
          # grows. It is the one that actually catches a change introducing duplication.
          #
          # THAT IS SCALE-PROOF, NOT SENSITIVITY-PROOF, and the difference was easy to overclaim.
          # The delta is still a percentage over the same enlarged denominator, so a fixed amount of
          # newly duplicated code now produces a SMALLER percentage-point increase than it did
          # against four Java directories - by the same ~17x the reading fell (1.89% -> 0.11%). So
          # widening the scan raised the absolute quantity of new duplication needed to trip +0.1%,
          # in the opposite direction from what "scan everything" is for. Unlike the cap, nothing
          # about it LOOKS wrong afterwards, which is why it is written down here rather than
          # noticed later. Raised in review on astubbs/parallel-consumer#320.
          #
          # `max-duplication` is the backstop against SLOW ACCUMULATION, which the increase guard
          # cannot see: twenty PRs each adding +0.09% all pass, and together they are +1.8%.
          #
          # RE-BASELINED against a measured corpus, 2026-08-19, on astubbs/parallel-consumer#320,
          # the change that widened both engines from four Java module directories to the whole
          # repo. The old 5% caps were justified by "the repo baseline is already ~4.2% jscpd" -
          # true then, meaningless after, because widening the scan grew the DENOMINATOR far faster
          # than it grew duplication: CPD went 1.89% -> 0.11% and jscpd 2.52% -> 1.17% while the
          # duplicated-line counts both went UP (721 -> 811 and 949 -> 981). A 5% ceiling over a
          # 0.11% reading cannot fire, which is a guard that has quietly stopped guarding.
          #
          # Headroom is deliberately generous rather than tight - this is a drift backstop, not the
          # regression check - but it can now fire before the number becomes absurd.
          #
          # THIS NUMBER IS CORPUS-RELATIVE. Anything that materially changes what is scanned (a new
          # module, a large docs import, another directory) moves the baseline, so re-read the
          # reported percentage and re-argue the cap rather than assuming it still means something.
          cpd-max-duplication: '0.5'    # measured baseline 0.11%
          jscpd-max-duplication: '2'    # measured baseline 1.17%

  # File similarity detection - finds files that are semantically similar overall
  file-similarity:
    if: github.event_name == 'pull_request'
    name: "dups: similarity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-detection-tool@74adf74b65b6a288b21ba957d7d7bef43831ee65 # master: base-vs-PR comparison + ce-review fixes
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Scan everything, same reasoning as the clones job. `file_extensions: java` is what
          # keeps this engine off `bin/`, and that restriction is deliberate rather than incidental:
          # it compares whole files for semantic likeness, and the shell scripts are similar BY
          # DESIGN - every check-*.sh shares a header, an argument shape and an exit-code convention
          # with its test-check-*.sh twin. An 80%-similarity threshold pointed at them yields
          # findings that are all correct and all unactionable, which is how a check gets ignored.
          directories: '.'
          file_extensions: 'java'
          ignore_below: 30
          fail_above: 80
          warn_above: 50
          one_comment: true
          compare_with_base: true
          max_increase: 10

  # Meta's Infer, every Java checker it ships - not just RacerD. RacerD is the only detector here
  # that finds races WITHOUT being told where to look: Error Prone's GuardedBy only fires where
  # somebody wrote the annotation, and this codebase has none, so the racing-double seam tests can
  # only re-prove seams already found by hand. RacerD infers which locks protect which state from
  # how the code uses them, and it is still why this lane exists. Alongside it, bin/infer-test.sh
  # also runs pulse (null derefs, resource leaks), starvation (deadlock via lock-order inversion),
  # and the checkers enabled by --annotation-reachability --bufferoverrun --cost --loop-hoisting
  # --scope-leakage - `--racerd-only` used to disable everything but RacerD, including two checkers
  # that are on by default, which is why the flag is gone and the lane was renamed from RacerD to
  # Infer to match what it actually runs.
  #
  # AN IDENTITY SET, not a count. config/infer-known-findings.txt records which findings are known,
  # keyed on bug type plus class.method. A bare count ceiling could not distinguish "one finding
  # fixed" from "one finding swapped for a different one" - both leave the total unchanged - which an
  # independent cross-model review caught, and which is the same reports-green-while-it-changed class
  # this lane exists to police. One line per known identity, checked in, so both directions are a
  # visible diff.
  #
  # Fails BOTH ways: a new identity is a new finding, and a known one that stops firing means
  # somebody fixed it without ratcheting the file.
  infer:
    if: github.event_name == 'pull_request'
    name: "static: infer"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-

      # Keyed on the version alone - the toolchain changes only when we bump it, which makes this a
      # better cache key than the pom-hash ones above. Unpacked it is ~950 MB, so the TARBALL is what
      # gets cached and it is unpacked per run: the repo-wide cache budget is 10 GB and several jobs
      # already hold ~/.m2.
      - name: Restore the Infer toolchain
        id: infer-cache
        uses: actions/cache@v4
        with:
          path: ~/infer-dist/infer.tar.xz
          key: infer-linux-x86_64-v1.3.0

      - name: Download Infer
        if: steps.infer-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/infer-dist
          curl -sSL --fail -o ~/infer-dist/infer.tar.xz \
            https://github.com/facebook/infer/releases/download/v1.3.0/infer-linux-x86_64-v1.3.0.tar.xz

      # Runs UNCONDITIONALLY, not only on a cache miss, because the cache is the mutable half. A
      # fresh download arrives over TLS from a pinned release URL; a restored one arrives from a
      # writable store keyed by a string anyone with write access to a branch can populate. Verifying
      # only what was just downloaded would check the half that is already the safer of the two, and
      # then unpack the other half unexamined.
      #
      # The digest was taken from two independent fetches of the pinned URL and the tarball confirmed
      # to be an Infer distribution. If this step ever fails, do not "fix" it by re-recording the
      # digest from whatever arrived - that is the failure mode it exists to catch. Bump the cache key
      # to force a clean download and see whether the digest returns; a genuine upstream re-cut of a
      # published tag is the rarer explanation and should be confirmed against the release page.
      - name: Verify the Infer archive against its pinned digest
        run: |
          echo "02be62ba931cb43e2d42bbf7abf4bd9a410cf8464cce5453934e25c90a825850  $HOME/infer-dist/infer.tar.xz" \
            | sha256sum --check --strict -

      - name: Unpack and confirm it runs
        run: |
          mkdir -p ~/infer
          tar -xJf ~/infer-dist/infer.tar.xz -C ~/infer --strip-components=1
          ~/infer/bin/infer --version

      # Asserts the ceiling in both directions. Analysis itself is ~11s over core's 73 files; the
      # timeout is for the download on a cache miss.
      # INFER_BIN and INFER_JDK are set here rather than in an `env:` block on purpose. An earlier
      # version set all three in `env:` AND overrode two of them inline, so the env values were dead
      # - and worse, wrong: INFER_BIN pointed at the workspace, while the unpack step above puts the
      # toolchain in $HOME/infer. Deleting the inline prefix, which is exactly what a later tidy-up
      # would do, would have pointed the lane at nothing. `$HOME` and `$JAVA_HOME` are not available
      # to `env:` at all, which is what forced the inline form in the first place.
      - name: Infer
        run: INFER_BIN="$HOME/infer/bin/infer" INFER_JDK="$JAVA_HOME" bash bin/infer-test.sh

  # SpotBugs static analysis - finds null derefs, concurrency issues, resource leaks.
  # Whole reactor, main AND test code, with fb-contrib and find-sec-bugs detectors loaded.
  # Suppression is by rule in config/spotbugs-exclude.xml; the registry that justifies every entry is
  # docs/inflight/static-spotbugs-rule-registry.md.
  spotbugs:
    if: github.event_name == 'pull_request'
    name: "static: spotbugs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      # No baseline restore, and no baseline job: suppression is by RULE now, in the checked-in
      # config/spotbugs-exclude.xml the pom points at, with every entry justified in
      # docs/inflight/static-spotbugs-rule-registry.md. The job this replaces regenerated an exclude
      # filter on every push to master, keyed on class + method + bug type, and recorded nothing
      # about what it swallowed.
      #
      # test-compile, not compile: the pom sets includeTests, and target/test-classes has to exist
      # for that to mean anything. Whole reactor, not `-pl parallel-consumer-core -am` - `-am` adds
      # only the parent pom, so vertx, reactor, mutiny and the examples went unanalysed.
      #
      # `spotbugs:check` IS THE REPORTING HALF, and it is not optional. `spotbugs:spotbugs` writes
      # spotbugsXml.xml and prints not one finding - the build log says "Skipping ... report goal"
      # and nothing else - so every bit of reporting was GitHub-side: annotations, the sticky comment,
      # the check run. Anyone running the build locally got total silence over hundreds of findings,
      # which review caught by asking the obvious question nobody had: "do they at least get reported,
      # and in the mvn build output?"
      #
      # `failOnError=false` keeps it advisory, so this changes what the lane SAYS and not what it
      # gates - the staged position the rule registry documents, with its own trigger for making
      # findings blocking. What `check` adds that neither the annotations nor the sticky comment give
      # is the RULE NAME on every line, which is the one thing needed to tier a finding in that
      # registry:
      #   [ERROR] Medium: ... UTAO_JUNIT_ASSERTION_ODDITIES_ACTUAL_CONSTANT
      #
      # Not bound to a lifecycle phase on purpose: SpotBugs at effort=Max over the whole reactor is
      # minutes, and paying that on every local `mvn test` would get the plugin switched off. Run the
      # same two goals by hand when you want the list.
      - name: Compile and run SpotBugs
        run: ./mvnw --batch-mode -Pci test-compile spotbugs:spotbugs spotbugs:check -Dspotbugs.failOnError=false
      - name: Post SpotBugs annotations on PR
        if: always()
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        with:
          path: '**/target/spotbugsXml.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post SpotBugs summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find . -path "*/target/spotbugsXml.xml" -type f').toString().trim().split('\n').filter(f => f);
            let body;
            if (files.length === 0) {
              body = `## SpotBugs Report\n\nNo SpotBugs XML report found. The compile or analysis step may have failed.\n`;
            } else {
              let totalBugs = 0;
              for (const f of files) {
                const content = fs.readFileSync(f, 'utf8');
                const matches = content.match(/<BugInstance/g);
                totalBugs += matches ? matches.length : 0;
              }
              const baselineNote = ' (rule-level exclusions only - see docs/inflight/static-spotbugs-rule-registry.md)';
              if (totalBugs === 0) {
                body = `## :white_check_mark: SpotBugs Report\n\nNo bugs found${baselineNote}.\n`;
              } else {
                body = `## :warning: SpotBugs Report\n\n**${totalBugs} bug(s) found**${baselineNote}. See the annotations on the Files Changed tab for details.\n`;
              }
            }
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(c => c.body.includes('SpotBugs Report'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Dependency vulnerability scanning - GitHub's own dependency review
  dependency-scan:
    if: github.event_name == 'pull_request'
    name: "deps: vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # github-script is MIT, but the license lookup returns null for
          # floating major tags (@v7 -> "7.*.*"), so it warns as "unknown"
          allow-dependencies-licenses: pkg:githubactions/actions/github-script

  # ── Push Builds (master) ───────────────────────────────────────────────

  # Single full build on default Kafka version to gate SNAPSHOT publishing.
  # Uses the same ci-build.sh script that PRs use for Kafka compat testing.
  build:
    if: github.event_name == 'push'
    needs: prepare-deps
    name: "full build (master)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test
        run: bin/ci-build.sh
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: default
          token: ${{ secrets.CODECOV_TOKEN }}
