# PR builds:
#   Default Kafka version (3.9.1) split into unit, integration, and performance
#   suites in parallel for fast feedback, plus an experimental Kafka 4.x
#   compatibility check.
#
# Push builds (master):
#   Single full build on default Kafka version (3.9.1) to gate SNAPSHOT publishing.
#
# Caching strategy:
#   All jobs use explicit cache/restore with restore-keys fallback to the
#   prepare-deps rotating cache. Do NOT use setup-java's built-in `cache: maven`
#   anywhere - its immutable keys can freeze an incomplete cache permanently.
#   See docs/solutions/build-errors/maven-central-timeout-azure-west-regions-2026-04-21.md

name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # ── Shared ────────────────────────────────────────────────────────────

  # Pre-warm the Maven dependency cache so all downstream jobs start with
  # everything local. Without this, jobs on Azure West US regions hit
  # Maven Central CDN timeouts (see docs/solutions/build-errors/).
  prepare-deps:
    name: "Prepare Maven Cache"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # No `cache: maven` - see caching strategy note at top of file
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Download all dependencies
        run: ./mvnw --batch-mode -Pci dependency:go-offline -Dlicense.skip -DincludeScope=test -U
      - name: Save Maven cache (rotating key)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}

  # ── PR Builds ──────────────────────────────────────────────────────────

  # Default Kafka version: split suites for fast, parallel feedback.
  # Uses the same scripts as local development (ci-unit-test.sh, etc.)
  test:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: "Unit Tests"
            cmd: "bin/ci-unit-test.sh"
            timeout: 15
          - suite: integration
            name: "Integration Tests"
            # Forked (process-parallel) mode: each JVM fork gets its own TestContainers
            # broker, so tests don't contend one shared broker. Reliable AND parallel,
            # without masking anything (each test runs on an uncontended broker). See
            # docs/solutions/test-flakiness/. forkCount=4 matches the self-hosted measurement.
            cmd: "bin/ci-integration-test.sh -DforkCount=4 -DreuseForks=true"
            timeout: 60
          - suite: performance
            name: "Performance Tests"
            cmd: "bin/performance-test.sh"
            timeout: 60
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ${{ matrix.suite }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Experimental Kafka 4.x compatibility check. Non-blocking.
  test-kafka-compat:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    name: "Kafka Compat (experimental 4.x)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test (Kafka 4.x)
        run: bin/ci-build.sh '[3.9.1,5)'
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ak-experimental
          token: ${{ secrets.CODECOV_TOKEN }}

  # Duplicate code detection using both PMD CPD and jscpd engines.
  # See https://github.com/astubbs/duplicate-code-cross-check
  duplicate-detection:
    if: github.event_name == 'pull_request'
    name: "Duplicate Code Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-cross-check@d3140ef6e9a4adf68c9f729a789e8b7ec8d058f7 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'parallel-consumer-core/src parallel-consumer-vertx/src parallel-consumer-reactor/src parallel-consumer-mutiny/src'
          cpd-max-duplication: '5'
          jscpd-max-duplication: '4'

  # File similarity detection - finds files that are semantically similar overall
  file-similarity:
    if: github.event_name == 'pull_request'
    name: "File Similarity Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-detection-tool@4e302e720f86c4e95f709196bae21333a9696937 # feat/base-vs-pr-comparison
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directories: 'parallel-consumer-core/src,parallel-consumer-vertx/src,parallel-consumer-reactor/src,parallel-consumer-mutiny/src'
          file_extensions: 'java'
          ignore_below: 30
          fail_above: 80
          warn_above: 50
          one_comment: true
          compare_with_base: true
          max_increase: 10

  # SpotBugs static analysis - finds null derefs, concurrency issues, resource leaks.
  # Uses a baseline from the base branch so only NEW bugs introduced by the PR are
  # reported. The baseline is generated by the push build and cached.
  spotbugs:
    if: github.event_name == 'pull_request'
    name: "SpotBugs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Restore SpotBugs baseline
        id: spotbugs-baseline
        uses: actions/cache/restore@v4
        with:
          path: .spotbugs-baseline.xml
          key: spotbugs-baseline-${{ github.base_ref }}-${{ hashFiles('**/src/main/**/*.java') }}
          restore-keys: |
            spotbugs-baseline-${{ github.base_ref }}-
            spotbugs-baseline-
      - name: Compile and run SpotBugs
        run: |
          EXCLUDE_ARG=""
          if [ -f .spotbugs-baseline.xml ]; then
            EXCLUDE_ARG="-Dspotbugs.excludeFilterFile=.spotbugs-baseline.xml"
            echo "Using baseline — only new bugs will be reported"
          else
            echo "No baseline found — reporting all bugs (first run on this base branch)"
          fi
          ./mvnw --batch-mode -Pci compile spotbugs:spotbugs -Dlicense.skip $EXCLUDE_ARG -pl parallel-consumer-core -am
      - name: Post SpotBugs annotations on PR
        if: always()
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        with:
          path: '**/target/spotbugsXml.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post SpotBugs summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const hasBaseline = fs.existsSync('.spotbugs-baseline.xml');
            const files = execSync('find . -path "*/target/spotbugsXml.xml" -type f').toString().trim().split('\n').filter(f => f);
            let body;
            if (files.length === 0) {
              body = `## SpotBugs Report\n\nNo SpotBugs XML report found. The compile or analysis step may have failed.\n`;
            } else {
              let totalBugs = 0;
              for (const f of files) {
                const content = fs.readFileSync(f, 'utf8');
                const matches = content.match(/<BugInstance/g);
                totalBugs += matches ? matches.length : 0;
              }
              const baselineNote = hasBaseline
                ? ' (new bugs only — baseline from base branch excluded)'
                : ' (no baseline available — showing all bugs)';
              if (totalBugs === 0) {
                body = `## :white_check_mark: SpotBugs Report\n\nNo bugs found${baselineNote}.\n`;
              } else {
                body = `## :warning: SpotBugs Report\n\n**${totalBugs} bug(s) found**${baselineNote}. See the annotations on the Files Changed tab for details.\n`;
              }
            }
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(c => c.body.includes('SpotBugs Report'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Dependency vulnerability scanning - GitHub's own dependency review
  dependency-scan:
    if: github.event_name == 'pull_request'
    name: "Dependency Vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # Mutation testing (PIT) - verifies test assertions are meaningful.
  # Non-blocking: posts a PR comment with mutation score but doesn't
  # gate merge. TODO: move to the self-hosted runner (self-hosted-tests.yml) for speed.
  mutation-testing:
    if: github.event_name == 'pull_request'
    name: "Mutation Testing (PIT)"
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 300
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      # Restore PIT history for incremental analysis — only re-mutates
      # code that changed since last run. PIT writes its history to /tmp/
      # with a filename derived from groupId.artifactId.version, ignoring
      # explicit -DhistoryInputLocation CLI flags when -DwithHistory is set.
      - name: Restore PIT history cache
        uses: actions/cache@v4
        with:
          path: /tmp/*_pitest_history.bin
          key: pit-history-${{ github.base_ref }}-${{ hashFiles('**/src/main/**/*.java') }}
          restore-keys: |
            pit-history-${{ github.base_ref }}-
            pit-history-
      # -Djacoco.skip=true    prevents Jacoco from injecting its agent into PIT
      #                        minions (PIT has its own coverage; Jacoco's agent
      #                        causes UNKNOWN_ERROR crashes).
      # -DjvmArgs=-Xmx1g      gives minion JVMs 1GB heap (default too small).
      # -DtimeoutConstant/Factor  generous per-mutation timeout for CI hardware
      # -Dthreads=1            I/O-bound tests; parallelism adds contention not speed
      # -DwithHistory          incremental: skips re-mutating unchanged code.
      #                        PIT writes history to /tmp/{groupId}.{artifactId}...
      #                        which we cache above via actions/cache.
      # targetClasses: internal.* only — the core engine where mutations matter most.
      #   Broadening to io.confluent.parallelconsumer.* hit GitHub's 6h job cap (#41).
      - name: Run PIT mutation testing
        run: |
          ./mvnw --batch-mode -Pci test-compile org.pitest:pitest-maven:mutationCoverage \
            -Dlicense.skip \
            -Djacoco.skip=true \
            -DtargetClasses="io.confluent.parallelconsumer.internal.*" \
            -DtargetTests="io.confluent.parallelconsumer.*" \
            -DjvmArgs=-Xmx1g \
            -DtimeoutConstant=30000 -DtimeoutFactor=3.0 \
            -Dthreads=1 \
            -DwithHistory \
            -pl parallel-consumer-core -am
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: '**/target/pit-reports/**'
      - name: Post PIT summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const files = execSync('find . -path "*/pit-reports/*/mutations.csv" -type f').toString().trim().split('\n').filter(f => f);
            let body;
            if (files.length === 0) {
              body = `## :x: Mutation Testing (PIT) Report\n\n`;
              body += `**PIT did not produce a report.** Most commonly this means a test failed in the baseline (PIT runs all tests unmodified first to establish green) and PIT aborted before mutating. See the "Run PIT mutation testing" step logs for the failing test, then either fix it or add it to \`-DexcludedTestClasses\` in the workflow.\n`;
            } else {
              let killed = 0, survived = 0, noCov = 0, total = 0;
              for (const f of files) {
                const lines = fs.readFileSync(f, 'utf8').split('\n').filter(l => l.trim());
                for (const line of lines) {
                  total++;
                  if (line.includes('KILLED')) killed++;
                  else if (line.includes('SURVIVED')) survived++;
                  else if (line.includes('NO_COVERAGE')) noCov++;
                }
              }
              const score = total > 0 ? ((killed / total) * 100).toFixed(1) : '0';
              body = `## Mutation Testing (PIT) Report\n\n`;
              body += `| Metric | Value |\n|--------|-------|\n`;
              body += `| Mutations generated | ${total} |\n`;
              body += `| Killed (detected) | ${killed} |\n`;
              body += `| Survived (missed) | ${survived} |\n`;
              body += `| No coverage | ${noCov} |\n`;
              body += `| **Mutation score** | **${score}%** |\n\n`;
              body += `Full HTML report available as artifact: \`pit-report\`\n`;
            }
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(c => c.body.includes('Mutation Testing (PIT) Report'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # ── Push Builds (master) ───────────────────────────────────────────────

  # Generate SpotBugs baseline for PR comparisons. Runs on every push to
  # master so PR builds can exclude known bugs and only report new ones.
  spotbugs-baseline:
    if: github.event_name == 'push'
    name: "SpotBugs Baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Compile and generate SpotBugs XML
        run: ./mvnw --batch-mode -Pci compile spotbugs:spotbugs -Dlicense.skip -pl parallel-consumer-core -am
      - name: Convert SpotBugs results to exclude filter
        run: |
          # Transform the SpotBugs XML into an exclude filter that can be
          # passed to future runs via -Dspotbugs.excludeFilterFile. Each
          # BugInstance becomes a Match element keyed on class + method + bug type.
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('parallel-consumer-core/target/spotbugsXml.xml')
          root = tree.getroot()
          out = ET.Element('FindBugsFilter')
          for bug in root.findall('.//BugInstance'):
              match = ET.SubElement(out, 'Match')
              cls = bug.find('Class')
              method = bug.find('Method')
              if cls is not None:
                  ET.SubElement(match, 'Class', name=cls.get('classname', ''))
              if method is not None:
                  ET.SubElement(match, 'Method', name=method.get('name', ''))
              ET.SubElement(match, 'Bug', pattern=bug.get('type', ''))
          ET.ElementTree(out).write('.spotbugs-baseline.xml', xml_declaration=True, encoding='utf-8')
          print(f'Baseline: {len(root.findall(\".//BugInstance\"))} bugs excluded')
          "
      - name: Cache SpotBugs baseline
        uses: actions/cache/save@v4
        with:
          path: .spotbugs-baseline.xml
          key: spotbugs-baseline-${{ github.ref_name }}-${{ hashFiles('**/src/main/**/*.java') }}

  # Single full build on default Kafka version to gate SNAPSHOT publishing.
  # Uses the same ci-build.sh script that PRs use for Kafka compat testing.
  build:
    if: github.event_name == 'push'
    needs: prepare-deps
    name: "Build and Test"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test
        run: bin/ci-build.sh
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: default
          token: ${{ secrets.CODECOV_TOKEN }}
