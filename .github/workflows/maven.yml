# PR builds:
#   Default Kafka version (3.9.1) split into unit, integration, and performance
#   suites in parallel for fast feedback, plus an experimental Kafka 4.x
#   compatibility check.
#
# Push builds (master):
#   Single full build on default Kafka version (3.9.1) to gate SNAPSHOT publishing.
#
# Caching strategy:
#   All jobs use explicit cache/restore with restore-keys fallback to the
#   prepare-deps rotating cache. Do NOT use setup-java's built-in `cache: maven`
#   anywhere - its immutable keys can freeze an incomplete cache permanently.
#   See docs/solutions/build-errors/maven-central-timeout-azure-west-regions-2026-04-21.md

name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # ── Shared ────────────────────────────────────────────────────────────

  # Pre-warm the Maven dependency cache so all downstream jobs start with
  # everything local. Without this, jobs on Azure West US regions hit
  # Maven Central CDN timeouts (see docs/solutions/build-errors/).
  prepare-deps:
    name: "cache"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # No `cache: maven` - see caching strategy note at top of file
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Download all dependencies
        run: ./mvnw --batch-mode -Pci dependency:go-offline -DincludeScope=test -U
      # go-offline resolves declared dependencies and plugin JARs, but NOT the platform protoc /
      # protoc-gen-grpc-java EXECUTABLES that protobuf-maven-plugin resolves for itself at generate
      # time. Left cold, every downstream job fetches them from Central and inherits the Azure West
      # US CDN route lottery in docs/solutions/build-errors/ ("Maven Central download timeouts") -
      # a 240s hang, then a hard NullPointerException out of Aether rather than a retry. Measured on
      # astubbs/parallel-consumer#293: in one run "Unit Tests" fetched protoc in 272ms while
      # "Integration Tests" hung the full 240s on the identical URL, and it failed 2 of 6
      # consecutive runs. The classifier is linux-x86_64 because this job declares ubuntu-latest.
      - name: Warm plugin-resolved protoc binaries
        run: |
          set -euo pipefail
          evaluate() {
            ./mvnw -q --batch-mode -pl parallel-consumer-proxy-protocol \
              -Dexpression="$1" -DforceStdout \
              org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate 2>/dev/null | tail -1
          }
          # A renamed property makes help:evaluate print "null object or invalid expression", which
          # dependency:get would happily turn into a warm of the wrong coordinate - warming nothing
          # is indistinguishable from a cache hit until it fails four jobs downstream, so require a
          # version-shaped answer rather than merely a non-empty one.
          require_version() {
            case "$2" in
              [0-9]*) : ;;
              *) echo "::error::$1 did not resolve to a version from parallel-consumer-proxy-protocol/pom.xml (got '$2') - the protoc cache warm would be a silent no-op"; exit 1 ;;
            esac
          }
          protoc_version=$(evaluate proxy.protoc)
          grpc_version=$(evaluate grpc.version)
          require_version proxy.protoc "$protoc_version"
          require_version grpc.version "$grpc_version"
          get() {
            ./mvnw --batch-mode -ntp \
              org.apache.maven.plugins:maven-dependency-plugin:3.11.0:get -Dartifact="$1"
          }
          get "com.google.protobuf:protoc:${protoc_version}:exe:linux-x86_64"
          get "io.grpc:protoc-gen-grpc-java:${grpc_version}:exe:linux-x86_64"
          # Assert the binaries are on disk: the exit code says the goal ran, only the file says the
          # cache this job exists to populate actually got populated.
          test -s ~/.m2/repository/com/google/protobuf/protoc/"${protoc_version}"/protoc-"${protoc_version}"-linux-x86_64.exe
          test -s ~/.m2/repository/io/grpc/protoc-gen-grpc-java/"${grpc_version}"/protoc-gen-grpc-java-"${grpc_version}"-linux-x86_64.exe
      # The same class of miss as protoc above, in a different plugin: scala-maven-plugin resolves
      # the Scala COMPILER and the zinc compiler-bridge sources jar for itself at scala:compile time,
      # so neither is a declared dependency and go-offline leaves both cold. Measured on
      # astubbs/parallel-consumer#293, run 32008526667: "Unit Tests" spent 4m01s on
      # scala-compiler-2.13.18.jar before Central gave up and it fell to the mirror, then was still
      # fetching compiler-bridge_2.13-1.12.0-sources.jar 3m12s later when the lane's 15-minute cap
      # killed it - the same CDN route lottery documented above, and it cost the whole job.
      #
      # Warmed by COMPILING the module rather than by naming coordinates: the bridge version comes
      # from the plugin's own zinc dependency and no pom property carries it, so a `dependency:get`
      # would need a literal that rots silently the next time the plugin is bumped - warming the
      # wrong coordinate being indistinguishable from a cache hit is the defect the block above
      # exists to prevent. -am keeps this to the scala module's own reactor chain.
      - name: Warm scala-maven-plugin's compiler and zinc bridge
        run: |
          set -euo pipefail
          # `package`, not `compile`: the scala module's -am chain includes
          # parallel-consumer-proxy-protocol, which depends on parallel-consumer-core's TEST-JAR, and
          # that artifact does not exist until core is packaged - a compile-only run resolves it
          # against Central and 404s. The root pom's maven-release-plugin comment records the same
          # trap for the same reason.
          ./mvnw --batch-mode -ntp -Pci -pl :parallel-consumer-proxy-client-scala -am -DskipTests package
          # Assert by glob, not by version, for the same reason the compile is version-free: the
          # point is that the cache got populated, and a run that resolved nothing must go red here
          # rather than four minutes into a downstream lane.
          test -n "$(find ~/.m2/repository/org/scala-lang/scala-compiler -name 'scala-compiler-*.jar' -print -quit 2>/dev/null)"
          test -n "$(find ~/.m2/repository/org/scala-sbt -name 'compiler-bridge_*-sources.jar' -print -quit 2>/dev/null)"
      - name: Save Maven cache (rotating key)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}

  # ── PR Builds ──────────────────────────────────────────────────────────

  # Default Kafka version: split suites for fast, parallel feedback.
  # Uses the same scripts as local development (ci-unit-test.sh, etc.)
  test:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: "Unit Tests"
            cmd: "bin/ci-unit-test.sh"
            timeout: 15
          - suite: integration
            name: "Integration Tests"
            # Forked (process-parallel) mode: each JVM fork gets its own TestContainers
            # broker, so tests don't contend one shared broker. Reliable AND parallel,
            # without masking anything (each test runs on an uncontended broker). See
            # docs/solutions/test-flakiness/. forkCount=4 matches the self-hosted measurement.
            cmd: "bin/ci-integration-test.sh -DforkCount=4 -DreuseForks=true"
            timeout: 60
          - suite: performance
            name: "Performance Tests"
            cmd: "bin/performance-test.sh"
            timeout: 60
          # The reference demo, through BOTH of its entry points. Separate from the integration
          # suite because ReferenceDemoIT proves the demo's ARMS work while this proves the way a
          # reader actually starts it - the Maven classpath step, the forked JVM the spawned
          # sidecar depends on, the image build, the compose broker, and the exit code a scripted
          # caller sees. Every failure this demo has had lived in that gap, and none of them was a
          # logic error a unit test could have caught. It also covers the java-grpc-uds arm on a
          # developer machine that cannot run it: the container is Linux whatever the host is.
          - suite: demo
            name: "Demo (both entry points)"
            cmd: "bin/ci-demo-test.sh"
            timeout: 30
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: ${{ matrix.name }}
        run: ${{ matrix.cmd }}
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ${{ matrix.suite }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Mutation testing (PIT). ci-mutation-test.sh scopes to the classes CHANGED vs the PR base
  # (GITHUB_BASE_REF), so it's fast enough for the 2-core hosted runner - the full internal.* sweep would
  # time out here (which is why it used to be self-hosted-only). Advisory / non-gating.
  mutation:
    if: github.event_name == 'pull_request'
    needs: prepare-deps
    name: "Mutation Tests (PIT, PR-scoped)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true      # advisory - never gates merge
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # ci-mutation-test.sh diffs vs the PR base to scope to changed classes
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Mutation testing (changed classes only)
        run: bin/ci-mutation-test.sh

  # Quarantine AUDIT: the seconds-fast enforcement job on every PR - registry drift and broken owner
  # claims are real, actionable errors that turn it red. It does NOT run any tests (that is
  # the Quarantine Lane workflow: every PR push + every merge to master + dispatch) so the PR checks list gets its verdict in seconds.
  # Discipline: no quarantine without diagnosis; quarantine is master-state, not PR-state. See the
  # @Quarantined javadoc (parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/Quarantined.java).
  quarantine-audit:
    if: github.event_name == 'pull_request'
    name: "quarantine: audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Enforce registry (docs/quarantined-tests.md matches @Quarantined annotations)
        run: bin/check-quarantine-registry.sh
      - name: Verify owner claims (each quarantined test's fix PR exists, is open, and removes the quarantine)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check-quarantine-owners.sh

  # Documentation-data AUDIT: structure only. docs/features/*.yaml and docs/data/*.yaml are
  # hand-written and a documentation generator reads them, so a malformed file or a missing required
  # field produces a broken generated page rather than a loud error. This checks that each file
  # parses, declares its kind, carries what that kind requires, and points at README anchors that
  # exist. It deliberately does NOT check whether the claims are true - nothing can, and a check that
  # implied otherwise would be worse than none.
  docs-data-audit:
    if: github.event_name == 'pull_request'
    name: "docs data: audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install the YAML parser the check needs
        run: python3 -m pip install --quiet pyyaml
      # Self-test first, same as the copyright and sigpipe scanners: this guard has twice shipped
      # green on a failure it was written to catch, so the cases that pin those gaps have to run
      # where a regression is visible. It mutates the corpus one way at a time and restores it, so
      # the guard step below still sees an untouched tree.
      - name: Self-test the guard (each case is a gap it once had)
        run: bash bin/test-check-docs-data.sh
      - name: Validate release-documentation data structure
        run: bin/check-docs-data.sh

  # Protocol freeze gate: the proxy wire schema may only GAIN, never change (the language-proxy
  # plan's freeze, astubbs#242). `buf breaking` in the FILE category - configured in
  # parallel-consumer-proxy-protocol/buf.yaml, FILE because WIRE would tolerate source-breaking
  # renames the compatibility promise forbids - compares the PR's schema against the frozen one on
  # origin/master. bin/check-proto-breaking.sh passes with a notice while master has no frozen
  # schema yet, so the job arms itself the moment the freeze lands.
  #
  # It also carries the schema's STATIC ANALYSIS - `buf lint`, via bin/check-proto-lint.sh - because
  # the two share a toolchain install and a checkout, and splitting them would buy a second job for
  # one binary. The job's NAME is deliberately unchanged: it is a required check, and renaming a
  # required check silently un-gates every open PR. The lint runs FIRST: a schema that does not lint
  # is a schema whose breaking-change comparison is answering a question nobody asked yet. The
  # protocol earns its own analysis because it is the artifact all eleven clients are generated
  # from - one defect there arrives in every language at once (docs/client-static-analysis.md).
  proto-breaking:
    if: github.event_name == 'pull_request'
    name: "proto: breaking"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # the baseline is origin/master, which a shallow clone lacks
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Lint the schema (buf lint)
        run: bin/check-proto-lint.sh
      # Self-test first, the same order as the docs-data and copyright scanners: this gate's
      # ability to say no was demonstrated once, by hand, and never since - so the cases that pin
      # it (a deletion, a renumber, a rename, and a renamed module that must not re-enter the
      # "nothing frozen yet" branch) run here, where a regression is visible. It mutates the schema
      # one way at a time and restores it, so the gate below still sees an untouched tree.
      - name: Self-test the gate (prove it can still say no)
        run: bash bin/test-check-proto-breaking.sh
      - name: Enforce the frozen schema (additions only)
        run: bin/check-proto-breaking.sh

  # Experimental Kafka 4.x compatibility check. Non-blocking.
  # DISABLED pending the Kafka 4.x migration work: the experimental 4.x build currently fails and just adds
  # a red X of noise to every PR (it is continue-on-error, so it never gated merges). Re-enable by restoring
  # the `if: github.event_name == 'pull_request'` condition below when the Kafka 4 work starts. See docs/inflight/ci-disabled-jobs-and-runner-load.md.
  test-kafka-compat:
    if: false # was: github.event_name == 'pull_request' — re-enable when Kafka 4.x work begins
    needs: prepare-deps
    name: "compat: kafka 4.x (experimental)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test (Kafka 4.x)
        run: bin/ci-build.sh '[3.9.1,5)'
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: ak-experimental
          token: ${{ secrets.CODECOV_TOKEN }}

  # Duplicate code detection using both PMD CPD and jscpd engines.
  # See https://github.com/astubbs/duplicate-code-cross-check
  duplicate-detection:
    if: github.event_name == 'pull_request'
    name: "dups: clones"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-cross-check@d3140ef6e9a4adf68c9f729a789e8b7ec8d058f7 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The four Java proxy-client modules are listed DELIBERATELY, and the nine non-JVM
          # client modules are omitted DELIBERATELY: this is an include list (there is no
          # exclusion parameter), and ten clients implementing one architecture in one shape is
          # the intended outcome, not accidental duplication - listing them would fail the build
          # for doing exactly what was asked. The Java clients are different: they are Java, in
          # the reactor, and structurally deduplicated through the shared api module, so two
          # near-identical Java transport implementations SHOULD fail this gate. (astubbs#242)
          directories: 'parallel-consumer-core/src parallel-consumer-vertx/src parallel-consumer-reactor/src parallel-consumer-mutiny/src parallel-consumer-proxy/src parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-api/src parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-direct/src parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-grpc/src parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-harness/src'
          cpd-max-duplication: '5'
          # Absolute cap set to 5% (matching PMD CPD). The repo baseline is already ~4.2% jscpd,
          # so a 4% cap fails on every PR (including the base branch itself) regardless of the change.
          # The real regression guard is the per-engine "max increase vs base" check (+0.1%).
          jscpd-max-duplication: '5'

  # File similarity detection - finds files that are semantically similar overall
  file-similarity:
    if: github.event_name == 'pull_request'
    name: "dups: similarity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astubbs/duplicate-code-detection-tool@74adf74b65b6a288b21ba957d7d7bef43831ee65 # master: base-vs-PR comparison + ce-review fixes
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Same include-list reasoning as duplicate-detection above: the four Java proxy-client
          # modules are in scope on purpose, the nine non-JVM clients are out of scope on purpose.
          # Note the separator differs - comma here, space above. (astubbs#242)
          directories: 'parallel-consumer-core/src,parallel-consumer-vertx/src,parallel-consumer-reactor/src,parallel-consumer-mutiny/src,parallel-consumer-proxy/src,parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-api/src,parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-direct/src,parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-grpc/src,parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-harness/src'
          file_extensions: 'java'
          ignore_below: 30
          fail_above: 80
          warn_above: 50
          one_comment: true
          compare_with_base: true
          max_increase: 10

  # SpotBugs static analysis - finds null derefs, concurrency issues, resource leaks.
  # Uses a baseline from the base branch so only NEW bugs introduced by the PR are
  # reported. The baseline is generated by the push build and cached.
  spotbugs:
    if: github.event_name == 'pull_request'
    name: "static: spotbugs"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Restore SpotBugs baseline
        id: spotbugs-baseline
        uses: actions/cache/restore@v4
        with:
          path: .spotbugs-baseline.xml
          key: spotbugs-baseline-${{ github.base_ref }}-${{ hashFiles('**/src/main/**/*.java') }}
          restore-keys: |
            spotbugs-baseline-${{ github.base_ref }}-
            spotbugs-baseline-
      - name: Compile and run SpotBugs
        run: |
          EXCLUDE_ARG=""
          if [ -f .spotbugs-baseline.xml ]; then
            EXCLUDE_ARG="-Dspotbugs.excludeFilterFile=.spotbugs-baseline.xml"
            echo "Using baseline — only new bugs will be reported"
          else
            echo "No baseline found — reporting all bugs (first run on this base branch)"
          fi
          ./mvnw --batch-mode -Pci compile spotbugs:spotbugs $EXCLUDE_ARG -pl parallel-consumer-core -am
      - name: Post SpotBugs annotations on PR
        if: always()
        uses: jwgmeligmeyling/spotbugs-github-action@v1.2
        with:
          path: '**/target/spotbugsXml.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Post SpotBugs summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const hasBaseline = fs.existsSync('.spotbugs-baseline.xml');
            const files = execSync('find . -path "*/target/spotbugsXml.xml" -type f').toString().trim().split('\n').filter(f => f);
            let body;
            if (files.length === 0) {
              body = `## SpotBugs Report\n\nNo SpotBugs XML report found. The compile or analysis step may have failed.\n`;
            } else {
              let totalBugs = 0;
              for (const f of files) {
                const content = fs.readFileSync(f, 'utf8');
                const matches = content.match(/<BugInstance/g);
                totalBugs += matches ? matches.length : 0;
              }
              const baselineNote = hasBaseline
                ? ' (new bugs only — baseline from base branch excluded)'
                : ' (no baseline available — showing all bugs)';
              if (totalBugs === 0) {
                body = `## :white_check_mark: SpotBugs Report\n\nNo bugs found${baselineNote}.\n`;
              } else {
                body = `## :warning: SpotBugs Report\n\n**${totalBugs} bug(s) found**${baselineNote}. See the annotations on the Files Changed tab for details.\n`;
              }
            }
            const comments = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.data.find(c => c.body.includes('SpotBugs Report'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Dependency vulnerability scanning - GitHub's own dependency review
  dependency-scan:
    if: github.event_name == 'pull_request'
    name: "deps: vulnerabilities"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # github-script is MIT, but the license lookup returns null for
          # floating major tags (@v7 -> "7.*.*"), so it warns as "unknown"
          allow-dependencies-licenses: pkg:githubactions/actions/github-script

  # ── Push Builds (master) ───────────────────────────────────────────────

  # Generate SpotBugs baseline for PR comparisons. Runs on every push to
  # master so PR builds can exclude known bugs and only report new ones.
  spotbugs-baseline:
    if: github.event_name == 'push'
    name: "static: spotbugs baseline"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: prepare-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Compile and generate SpotBugs XML
        run: ./mvnw --batch-mode -Pci compile spotbugs:spotbugs -pl parallel-consumer-core -am
      - name: Convert SpotBugs results to exclude filter
        run: |
          # Transform the SpotBugs XML into an exclude filter that can be
          # passed to future runs via -Dspotbugs.excludeFilterFile. Each
          # BugInstance becomes a Match element keyed on class + method + bug type.
          python3 -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('parallel-consumer-core/target/spotbugsXml.xml')
          root = tree.getroot()
          out = ET.Element('FindBugsFilter')
          for bug in root.findall('.//BugInstance'):
              match = ET.SubElement(out, 'Match')
              cls = bug.find('Class')
              method = bug.find('Method')
              if cls is not None:
                  ET.SubElement(match, 'Class', name=cls.get('classname', ''))
              if method is not None:
                  ET.SubElement(match, 'Method', name=method.get('name', ''))
              ET.SubElement(match, 'Bug', pattern=bug.get('type', ''))
          ET.ElementTree(out).write('.spotbugs-baseline.xml', xml_declaration=True, encoding='utf-8')
          print(f'Baseline: {len(root.findall(\".//BugInstance\"))} bugs excluded')
          "
      - name: Cache SpotBugs baseline
        uses: actions/cache/save@v4
        with:
          path: .spotbugs-baseline.xml
          key: spotbugs-baseline-${{ github.ref_name }}-${{ hashFiles('**/src/main/**/*.java') }}

  # Single full build on default Kafka version to gate SNAPSHOT publishing.
  # Uses the same ci-build.sh script that PRs use for Kafka compat testing.
  build:
    if: github.event_name == 'push'
    needs: prepare-deps
    name: "full build (master)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Build and Test
        run: bin/ci-build.sh
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: '**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-it/jacoco.xml'
          flags: default
          token: ${{ secrets.CODECOV_TOKEN }}
