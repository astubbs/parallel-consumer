# Cut a release (tag-as-truth, dispatch-triggered).
#
# maven-release-plugin's release:prepare bumps poms, makes the two release commits, tags vX,
# and pushes them to master. We then check out that EXACT tag and deploy it. The tag is the
# single source of truth — nothing scans git history (that antipattern re-released an ancient
# upstream commit; see docs/plans/2026-07-28-release-pipeline-hardening.md).
#
# Requires:
#   RELEASE_PAT  - fine-grained PAT (repo Contents: write) owned by a repo admin; used so the
#                  release:prepare push bypasses the master ruleset's pull_request rule. The
#                  "Repository admin" role must be in the ruleset's bypass list.
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE

name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release version, e.g. 0.6.0.0'
        required: true
      developmentVersion:
        description: 'Next development version, e.g. 0.6.0.1-SNAPSHOT'
        required: true
      dryRun:
        description: 'Dry run (no commits/tags/deploy)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT }}   # admin PAT → prepare's push bypasses the ruleset

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Refuse to release a red master
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(git rev-parse HEAD)
          CONCL=$(gh run list --workflow "CI" --branch master --limit 15 \
            --json headSha,conclusion --jq "[.[] | select(.headSha==\"$SHA\")][0].conclusion")
          if [ "$CONCL" != "success" ]; then
            echo "::error::Latest 'CI' workflow run for master $SHA is '${CONCL:-not found}', not success. Refusing to release."
            exit 1
          fi

      # A release must not ship while known-failing tests are held out of the gating suites - the
      # quarantine lane exists to keep PR merges honest, not to let a release skip its tests.
      # Runs on dry runs too (as a warning) so a rehearsal surfaces that a real release would block.
      - name: Refuse to release with quarantined tests
        run: |
          source bin/lib/quarantine-common.sh
          if [ -n "$(quarantined_files)" ]; then
            echo "Quarantined tests present (registry: docs/quarantined-tests.md):"
            grep -rnE --include='*.java' --exclude-dir=target "$QUARANTINE_ANNOTATION_ERE" . || true
            if [ "${{ inputs.dryRun }}" = "true" ]; then
              echo "::warning::Dry run: a REAL release would be BLOCKED - known-failing tests are quarantined out of the gating suites. Land the owning fix PRs and re-enable before releasing."
            else
              echo "::error::Refusing to release: known-failing tests are quarantined out of the gating suites (docs/quarantined-tests.md). Land the owning fix PRs and re-enable them first."
              exit 1
            fi
          else
            echo "No quarantined tests - release may proceed."
          fi

      - name: Guard - tag must not already exist
        run: |
          if git rev-parse "refs/tags/v${{ inputs.releaseVersion }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.releaseVersion }} already exists."; exit 1
          fi

      - name: Extract the release notes
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          # CHANGELOG.md is Markdown, so the release body is its `## <version>` section verbatim -
          # nothing is converted. It is extracted here, before release:prepare commits, tags or
          # deploys anything, so a missing or empty section fails while it is still cheap. There is
          # no fallback body: an auto-generated commit list on the release page is indistinguishable
          # from the curated notes having silently vanished (astubbs#197). CHANGELOG.md is identical
          # at master and at the tag, because release:prepare only rewrites poms. A dry run rehearses
          # this step too, and the notes land in the job summary either way.
          awk -v h="## $RELEASE_VERSION" '
            $0 == h {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no '## $RELEASE_VERSION' section, or it is empty. Refusing to release without notes."
            exit 1
          fi
          {
            echo "## Release notes for v$RELEASE_VERSION"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: release:prepare (build+install, commits + tag vX; pushes to master)
        # preparationGoals=clean install (in pom.xml): the modules cross-depend on core's test-jar,
        # which only exists after core is packaged+installed, so a poms-only "validate" prepare cannot
        # resolve it. -DskipTests keeps it fast; the "refuse red master" guard already gated on tests.
        run: |
          ./mvnw --batch-mode release:prepare \
            -DreleaseVersion=${{ inputs.releaseVersion }} \
            -DdevelopmentVersion=${{ inputs.developmentVersion }} \
            -DdryRun=${{ inputs.dryRun }} \
            -Darguments="-DskipTests"

      - name: Deploy the release tag to Maven Central
        if: ${{ !inputs.dryRun }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # Tag = source of truth: deploy exactly what prepare tagged. Examples are excluded (sample code).
          git checkout "v${{ inputs.releaseVersion }}"
          ./mvnw --batch-mode -Pmaven-central -Pci \
            -pl '!:parallel-consumer-examples,!:parallel-consumer-example-core,!:parallel-consumer-example-metrics,!:parallel-consumer-example-streams,!:parallel-consumer-example-vertx,!:parallel-consumer-example-reactor' \
            clean deploy -DskipTests

      - name: Wait for Maven Central to serve the release
        if: ${{ !inputs.dryRun }}
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          # The deploy above returns once Central has VALIDATED the bundle (pom.xml, central-publishing:
          # waitUntil). Publishing is Central's side and took over thirty minutes for 0.6.0.0, past the
          # plugin's own ceiling - which failed the run with every artefact already published and left
          # the release page unposted. So the wait is here, long, and a warning when it runs out: the
          # artefacts are Central's responsibility once validated, and the release page still goes up.
          URL="https://repo1.maven.org/maven2/bz/stub/parallelconsumer/parallel-consumer-core/$RELEASE_VERSION/parallel-consumer-core-$RELEASE_VERSION.pom"
          for i in $(seq 1 90); do
            if curl -sfI "$URL" >/dev/null; then echo "$RELEASE_VERSION is fetchable from Maven Central"; exit 0; fi
            sleep 60
          done
          echo "::warning::$RELEASE_VERSION was validated by Central but is not fetchable from repo1 after 90 minutes. Check https://central.sonatype.com/publishing/deployments before announcing."

      - name: GitHub release
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          # The body is the `## <version>` section of CHANGELOG.md, extracted and validated by the
          # "Extract the release notes" step BEFORE anything was committed, tagged or deployed.
          # Deliberately NOT --generate-notes: a commit-list body is what a reader gets when the
          # curated notes silently go missing, which is the failure this pipeline had (astubbs#197).
          gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Clean release plugin state
        if: always()
        run: ./mvnw --batch-mode release:clean || true
