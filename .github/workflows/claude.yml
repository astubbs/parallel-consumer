name: Claude Code

# The COMMENT route: `@claude ...` on a PR, a review, or an issue.
#
# For reviews specifically this is the counterpart to
# .github/workflows/claude-code-review-dispatch.yml, and until that dispatch route works it is
# the only route there is. Three things follow, and all are load-bearing:
#
#   1. It has to be able to clear `claude-review`, which is what `refresh-gate` below does. A
#      review that posts and leaves the required check red is indistinguishable from no review.
#   2. It runs the SAME curated execution allowlist as the dispatch route, so it is not a weaker
#      reviewer - see "WHAT THIS ROUTE MAY EXECUTE". What differs is the procedure: a dispatch
#      runs the packaged `/code-review:code-review` and accepts a `-f focus` steer, while this
#      one answers whatever the comment actually said.
#   3. It is the ONLY route that can open inline review comments, because the action installs
#      that server for entity events and `workflow_dispatch` is not one. Since unresolved review
#      threads are what mechanically gate a merge here, findings raised by comment can block and
#      findings raised by dispatch cannot.
#
# Because it can execute, the allowlist is withheld in two cases - a fork head, and an untrusted
# commenter - both decided in `pr-context` and both leaving the reply itself intact.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Bounded for the same reason the dispatch reviewer is: the allowlist below lets this job run
    # the unit and integration suites and arbitrary `./mvnw` goals, and a wedged suite - or a
    # Docker/broker call that never returns - would otherwise hold a hosted runner until GitHub's
    # multi-hour default. `@claude` is comment-triggered, so several can be started in a row.
    timeout-minutes: 30
    # Consumed by `refresh-gate`, which needs all three and must NOT check anything out to get
    # them. Same split, and the same reasoning, as the dispatch workflow's two jobs.
    outputs:
      # The ACTION's own verdict, not the step's. `steps.claude.outcome` is the step's, and the
      # step reports success on at least one path where the action ran nothing at all - measured
      # on run 31466885778. `conclusion` is empty on every such path.
      review_conclusion: ${{ steps.claude.outputs.conclusion }}
      # Empty when the trigger was an issue rather than a PR, which is what stops `refresh-gate`
      # trying to clear a gate that does not exist.
      pr_number: ${{ steps.pr-context.outputs.pr }}
      reviewed_sha: ${{ steps.pr-context.outputs.sha }}
    env:
      # Defined here so the two carve-outs in `pr-context` - fork head, untrusted commenter -
      # switch one value rather than editing a list in several places.
      # KEEP IN SYNC with `--allowedTools` in claude-code-review-dispatch.yml.
      REVIEW_TOOL_ALLOWLIST: 'mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(bin/ci-unit-test.sh:*),Bash(./bin/ci-unit-test.sh:*),Bash(bin/ci-integration-test.sh:*),Bash(./bin/ci-integration-test.sh:*),Bash(bin/check-copyright-headers.sh:*),Bash(./bin/check-copyright-headers.sh:*),Bash(bin/check-shell-sigpipe.sh:*),Bash(./bin/check-shell-sigpipe.sh:*),Bash(bin/check-docs-data.sh:*),Bash(./bin/check-docs-data.sh:*),Bash(bin/test-check-docs-data.sh:*),Bash(./bin/test-check-docs-data.sh:*),Bash(bin/test-check-shell-sigpipe.sh:*),Bash(./bin/test-check-shell-sigpipe.sh:*),Bash(bin/test-check-copyright-headers.sh:*),Bash(./bin/test-check-copyright-headers.sh:*),Bash(bin/test-check-review-posted.sh:*),Bash(./bin/test-check-review-posted.sh:*),Bash(bin/check-quarantine-registry.sh:*),Bash(./bin/check-quarantine-registry.sh:*),Bash(bin/check-quarantine-owners.sh:*),Bash(./bin/check-quarantine-owners.sh:*),Bash(bin/todo-index.sh:*),Bash(./bin/todo-index.sh:*),Bash(node .github/scripts/issue-ref-gate.test.js:*),Bash(node .github/scripts/changelog-ref-gate.test.js:*),Bash(gh run view:*),Bash(gh run list:*),Bash(actionlint:*),Bash(./mvnw:*),Bash(mvnw:*)'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # This job holds no write grant, but the token still has no business being left in
          # .git/config. `refresh-gate` is where the write grant lives, and it checks out nothing.
          persist-credentials: false

      # Resolves which PR (if any) this trigger is about, and the head it pointed at BEFORE
      # Claude ran. Captured here rather than in `refresh-gate` for the same reason the dispatch
      # workflow captures it in `review`: the refresh job must not have to fetch anything to
      # learn what was reviewed, and the SHA has to be the one the review actually covered.
      - name: Resolve the PR this trigger is on, and the head it pointed at
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # `issue.pull_request` is present only when the issue IS a pull request; an
          # `issue_comment` on a plain issue has an issue number and no PR behind it.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Whoever wrote the thing that triggered this run. Exactly one of these is non-empty
          # per event, so the `??` chain collapses to the right one.
          TRIGGER_ASSOCIATION: >-
            ${{ github.event.comment.author_association
            || github.event.review.author_association
            || github.event.issue.author_association }}
        run: |
          set -euo pipefail

          # WHO MAY MAKE THIS ROUTE EXECUTE THINGS.
          #
          # The allowlist below can run `./mvnw` with arbitrary goals and this repo's scripts, in
          # a job holding CLAUDE_CODE_OAUTH_TOKEN. The workflow trigger itself is only "a comment
          # containing @claude", which anyone who can comment can write.
          #
          # `claude-code-action` already refuses actors without write access
          # (src/github/validation/permissions.ts, getCollaboratorPermissionLevel), and
          # `allowed_non_write_users` cannot loosen that here because it is only consulted when
          # the `github_token` input is supplied, which this workflow does not do. So this check
          # is defence in depth, not the only guard - and it is worth having precisely because
          # "the action checks it" is the kind of assumption this PR has been burned by twice.
          #
          # It withholds the ALLOWLIST rather than refusing the run, so the failure mode if this
          # list of associations is ever wrong is a trusted user getting a read-only reviewer -
          # visible and annoying - rather than `@claude` silently doing nothing for them.
          trusted_author=false
          case "$TRIGGER_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) trusted_author=true ;;
            *) echo "::notice::Trigger author association is" \
                    "'${TRIGGER_ASSOCIATION:-<none>}', not OWNER/MEMBER/COLLABORATOR." \
                    "Answering without execution tools." ;;
          esac

          # The allowlist, or nothing if the author is not trusted. The fork head case is handled
          # separately below and emits an empty value directly - the two carve-outs are
          # independent, and either one alone withholds execution.
          tools_for_trusted_author() {
            if [ "$trusted_author" = "true" ]; then
              printf '%s' "--allowedTools \"$REVIEW_TOOL_ALLOWLIST\""
            fi
          }

          pr=""
          case "$EVENT_NAME" in
            issue_comment)
              if [ -n "$ISSUE_IS_PR" ]; then pr="$ISSUE_NUMBER"; fi
              ;;
            pull_request_review|pull_request_review_comment)
              pr="$PR_NUMBER"
              ;;
          esac

          # Digits only. Everything downstream interpolates this into an API path and a jq
          # `tonumber`, and neither should ever see anything else.
          case "$pr" in
            ''|*[!0-9]*) pr="" ;;
          esac

          if [ -z "$pr" ]; then
            # Not a PR at all (an issue). No gate to refresh, and no PR-authored checkout
            # either - the working tree is the default branch - so the allowlist is safe here.
            echo "Not a pull-request trigger ($EVENT_NAME) - the review gate does not apply."
            {
              echo "pr="
              echo "sha="
              echo "fork_pr=false"
              echo "claude_args=$(tools_for_trusted_author)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_repo=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.repo.full_name // ""')
          sha=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')

          # A FORK PR MUST STAY RED, AND THIS IS WHERE THAT NEARLY BROKE.
          #
          # "A fork PR cannot turn the gate green" in docs/ci.md is a deliberate boundary, not an
          # oversight: the dispatched reviewer refuses fork heads outright, and the gate accepts
          # only a `claude[bot]` comment, so the two together mean a fork PR has no route to green
          # and is merged (or not) on a human's judgement instead.
          #
          # Refreshing the gate here would have quietly dissolved that. This workflow answers
          # `@claude` on ANY PR including a fork's, and the gate cannot tell a review from any
          # other finished `claude[bot]` reply - so a maintainer merely ASKING a question on a
          # fork PR would have turned its required check green. That is precisely the
          # self-asserted escape docs/ci.md rejects by name: the person who wants the merge would
          # also be the person certifying the review.
          #
          # So Claude still answers on fork PRs - it is useful, and with no execution tools it is
          # harmless - but the gate is not refreshed, because emitting no PR number is what
          # `refresh-gate` skips on.
          #
          # `fork_pr` ALSO withholds the tool allowlist. See "WHAT THIS ROUTE MAY EXECUTE" below:
          # granting `./mvnw` and the `bin/` scripts on a fork head would put PR-controlled
          # executables next to CLAUDE_CODE_OAUTH_TOKEN, which is the exact hazard the dispatched
          # reviewer refuses fork heads to avoid. A fork could replace one of the allowlisted
          # scripts and wait for the reviewer to be asked to run the checks.
          if [ "$head_repo" != "$REPO" ]; then
            echo "::notice::PR #$pr has its head in '${head_repo:-<deleted fork>}', not $REPO." \
                 "Answering the comment WITHOUT execution tools, and NOT refreshing" \
                 "claude-review: a fork PR cannot turn the gate green (docs/ci.md, 'A fork PR" \
                 "cannot turn the gate green')."
            {
              echo "pr="
              echo "sha="
              echo "fork_pr=true"
              # The whole point: no allowlist, so no execution tools on a fork head.
              echo "claude_args="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #$pr, head $sha at the time this review started."
          {
            echo "pr=$pr"
            echo "sha=$sha"
            echo "fork_pr=false"
            echo "claude_args=$(tools_for_trusted_author)"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # WHAT THIS ROUTE MAY EXECUTE, AND WHY IT IS THE SAME LIST AS THE DISPATCH ROUTE.
          #
          # This is the dispatch reviewer's curated allowlist, copied verbatim, plus the inline
          # comment tool. It was NOT granted here originally, and the gap was visible in the
          # output: on astubbs/parallel-consumer#288 the reviewer reported "tool permissions
          # blocked Bash execution ... Everything above is from static reading", on a PR whose
          # entire diff was check scripts and their tests. A reader where the change needed a
          # runner.
          #
          # The objection to copying it was that comment text is attacker-influencable in a way a
          # `workflow_dispatch` is not. That is true and it is not the operative difference: BOTH
          # routes run PR-authored code, and this is an allowlist of this repo's own scripts, not
          # a shell. The protection was never "the trigger is trusted" - it is that the list is
          # curated, that the job holding it has no write grant (see `refresh-gate`, and the
          # `persist-credentials: false` above), and that it is WITHHELD ON FORK HEADS.
          #
          # That last one is not decoration. "This route runs PR-authored code" plus "it may run
          # ./mvnw and the bin/ scripts" plus "the job holds CLAUDE_CODE_OAUTH_TOKEN" is exactly
          # the combination the dispatched reviewer refuses fork heads to avoid: a fork can
          # replace an allowlisted script and wait to be asked to run the checks. The dispatch
          # route answers it by refusing the whole review; this route answers by still replying -
          # a fork PR author asking a question is a legitimate thing - but with NO execution
          # tools, so there is nothing for replaced code to be executed by.
          #
          # `--allowedTools` here ADDS to tag mode's base tools rather than replacing them - the
          # action documents exactly that ("The base GitHub tools are always included. Use
          # --allowedTools to add additional tools", docs/configuration.md) - so the tracking
          # comment, the `mcp__github_ci__*` readers and the git tools all survive this line.
          #
          # ==> KEEP IN SYNC WITH `--allowedTools` IN claude-code-review-dispatch.yml. <==
          # The two lists are byte-identical apart from the inline-comment tool, and nothing
          # mechanical enforces that yet. A grant added to one route and missed on the other is
          # the drift that nearly lost astubbs/parallel-consumer#273's grants in a merge, and it
          # shows up as a reviewer that silently cannot run the check it was asked about. A CI
          # check that diffs the two lists is the fix and is recorded in
          # docs/inflight/ci-review-agent.md.
          #
          # `mcp__github_inline_comment__create_inline_comment` is granted here and is NOT on the
          # dispatch route's list, because it cannot be: the action installs that server only for
          # an entity event, and a `workflow_dispatch` is not one. An `issue_comment` IS, so THIS
          # route can open real review threads. That matters more than it looks - unresolved
          # review threads are what mechanically gate a merge here, so a blocking finding from
          # this route actually blocks, where the dispatch route's can only ask a human nicely.
          # Withheld entirely on a fork head - see the fork paragraph above and `pr-context`,
          # which builds this string. Empty leaves tag mode's own read-only base tools, which is
          # the degraded-but-safe reviewer a fork PR gets.
          #
          # BUILT IN SHELL, NOT IN AN EXPRESSION, AND THAT IS NOT A STYLE CHOICE. The obvious
          # `${{ fork && '' || format(...) }}` ternary is BROKEN for this case and silently so:
          # GitHub's `a && b || c` idiom relies on `b` being truthy, and the empty string is
          # falsy, so the fork branch fell straight through to the `||` and handed a fork head
          # the full allowlist - the exact thing the guard exists to prevent, with a log line
          # saying it had been withheld. Caught in review on this PR, not by a runner, because
          # (like everything else here) it cannot be exercised before it merges. If you need a
          # conditional value that can be empty, build it in `run:` where the semantics are
          # ordinary shell.
          claude_args: ${{ steps.pr-context.outputs.claude_args }}

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'
          #
          # Leave `prompt` UNSET. It is what keeps this route in tag mode: the action picks agent
          # mode the moment a prompt is present (src/modes/detector.ts), and agent mode on a
          # comment loses the tracking comment and the automatic CI reader - and would replace
          # whatever the human actually typed with a fixed instruction, which is the entire point
          # of this route.

  # Holds this workflow's only write grant, in a job that checks NOTHING out. The dispatch
  # workflow splits its jobs for the same reason and explains it at length in its header; the
  # short version is that a token which can dispatch any workflow in the repo (release.yml among
  # them) must not share a filesystem with code this workflow just ran. Do not add a checkout
  # here, and do not merge this back into `claude`.
  #
  # The body below is deliberately a near-copy of `refresh-gate` in
  # claude-code-review-dispatch.yml. Sharing it would mean either checking out the script (which
  # is the one thing this job must not do) or a composite action (same problem), so the
  # duplication is the price of the no-checkout invariant. Fix one, check the other; that
  # coupling is recorded in docs/inflight/ci-review-agent.md.
  refresh-gate:
    runs-on: ubuntu-latest
    needs: claude
    # ONLY AFTER A REVIEW THAT ACTUALLY SUCCEEDED, AND ONLY ON A PR. Refreshing unconditionally
    # is the failure mode the dispatch route already rejected: the gate accepts any fresh,
    # finished-looking `claude[bot]` comment, so refreshing after a run that failed is how an
    # error comment turns a required check green.
    #
    # Worth stating plainly, because this job makes a documented looseness reachable that
    # previously was not: the gate cannot tell a review from any other `@claude` answer, so a
    # successful non-review reply on a PR will now also refresh the gate, where before it sat
    # red until the next push. That boundary is recorded in docs/inflight/ci-review-agent.md as
    # a social rather than technical one - the gate guards against the action failing quietly,
    # not against a determined author. The alternative is worse: leaving the only working review
    # route unable to clear the check it exists to clear.
    if: needs.claude.outputs.review_conclusion == 'success' && needs.claude.outputs.pr_number != ''
    permissions:
      # The whole reason this job exists.
      actions: write
      # To read the PR's current head SHA, and nothing else.
      pull-requests: read
    steps:
      # WITHOUT THIS STEP THE GATE STAYS RED FOREVER AFTER A SUCCESSFUL REVIEW ON THIS ROUTE.
      #
      # `claude-review` is produced by .github/workflows/claude-code-review.yml, which triggers
      # only on `pull_request` events. An `@claude` comment fires no such event, and a check run
      # keeps its last conclusion until something re-runs it - so the review posts, satisfies the
      # gate's rules, and the required check still shows the red it recorded before the review
      # existed. Traced live on astubbs/parallel-consumer#288: review posted at 08:29 for the
      # current head, check still red, and a hand-run `gh run rerun ... --failed` at 08:37 was
      # the entire fix.
      #
      # Re-running the gate's existing run is what keeps the check attached to the same head
      # SHA: a re-run reports into the same check suite on that commit, whereas a fresh
      # comment-triggered run would attach its check to the default branch instead and never
      # satisfy the PR's required check.
      #
      # Never fails the job: not finding a gate run to re-run is a reason to say so, not to fail
      # a review that already happened.
      - name: Re-run the review gate so it sees this review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.claude.outputs.pr_number }}
          # The head this review covered, captured before Claude ran and carried across the job
          # boundary so this job never has to fetch the PR to learn it.
          REVIEWED_SHA: ${{ needs.claude.outputs.reviewed_sha }}
        run: |
          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          head_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')
          head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // ""')

          # The fork refusal, a second time. `pr-context` already emits no PR number for a fork
          # head, so reaching this line means something upstream changed. It is repeated rather
          # than trusted because it is a security boundary and the whole cost is one jq read of a
          # response this step already fetches - and because the failure mode is silent: a fork
          # PR going green looks exactly like a fork PR being reviewed.
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::Refusing to refresh claude-review for PR #$PR, whose head is in" \
                 "'${head_repo:-<deleted fork>}' rather than $REPO. A fork PR cannot turn the" \
                 "gate green - see docs/ci.md. Reaching this means the pr-context guard was" \
                 "bypassed; fix that rather than this."
            exit 1
          fi

          # Refuse to refresh the gate for a head this review did not look at. If the PR moved
          # while the review ran, the review covers the old commit, and re-running the gate now
          # would let a comment timestamped after the new head arrived certify code the reviewer
          # never saw. Leaving the check red asks for a fresh review, which is the honest answer.
          if [ "$head_sha" != "$REVIEWED_SHA" ]; then
            echo "::warning::PR head moved from $REVIEWED_SHA to $head_sha while this review ran," \
                 "so the review covers the older commit. Not refreshing the gate - ask for a" \
                 "fresh review of $head_sha."
            exit 0
          fi

          # head_sha ALONE DOES NOT IDENTIFY THIS PR'S GATE RUN. One head can back more than one
          # PR - the same branch opened against `master` and a release branch - and the gate runs
          # once per PR, so the SHA filter returns both runs. Taking the newest would then re-run
          # the OTHER PR's gate: that PR goes green, this one stays red, and the log line says
          # the gate was refreshed. `pull_requests[]` carries the association the SHA filter
          # drops, so select on it.
          runs=$(gh api \
            "repos/$REPO/actions/workflows/claude-code-review.yml/runs?head_sha=$head_sha&per_page=100")

          # The newest run naming this PR, chosen by `run_number` rather than by taking the first
          # element: the list is near-certainly newest-first, but that ordering is not documented,
          # and picking a superseded attempt would re-run a run the gate's `cancel-in-progress`
          # concurrency already cancelled.
          run_id=$(printf '%s' "$runs" | jq -r --arg pr "$PR" \
            '($pr | tonumber) as $n
             | ([.workflow_runs[] | select(any(.pull_requests[]?; .number == $n))]
                | max_by(.run_number) | .id) // empty')

          # `pull_requests` comes back empty on runs GitHub could not associate - classically
          # fork-head runs. Rather than fail closed on an API quirk, fall back to the newest run
          # for the SHA and say that is what happened.
          if [ -z "$run_id" ]; then
            run_id=$(printf '%s' "$runs" | jq -r '(.workflow_runs | max_by(.run_number) | .id) // empty')
            if [ -n "$run_id" ]; then
              echo "::warning::No claude-review gate run for $head_sha names PR #$PR." \
                   "Falling back to the newest run for that SHA (run $run_id)."
            fi
          fi

          if [ -z "$run_id" ]; then
            echo "::warning::No claude-review gate run found for head $head_sha - nothing to re-run." \
                 "The gate will re-evaluate on the next push to this PR."
            exit 0
          fi

          echo "Re-running the review gate (run $run_id) for head $head_sha."
          gh run rerun "$run_id" -R "$REPO" || \
            echo "::warning::Could not re-run gate run $run_id; re-run it by hand to clear claude-review."
