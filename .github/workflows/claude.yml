name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Two conditions, and the second one is load-bearing now that this job can run scripts.
    #
    # Comment-triggered workflows receive repository secrets even when the comment is on a FORK's
    # pull request - unlike `pull_request`, which withholds them from forks. That difference is the
    # whole reason claude-code-review.yml can grant script execution relatively safely and this file
    # cannot: here, `secrets.CLAUDE_CODE_OAUTH_TOKEN` is present in a job any commenter could start.
    #
    # docs/inflight/ci-review-agent.md already states the posture this encodes - "until then: trusted
    # authors only" - it just had nothing enforcing it.
    #
    # Association is read from whichever surface produced the triggering text. The `||` chain is
    # ordered, not exclusive: an `issue_comment` payload carries BOTH `comment.author_association`
    # and the parent `issue.author_association`, and only the first is the association of whoever
    # actually typed "@claude". So `comment` must stay ahead of `issue` here - reordering the chain
    # would silently start trusting the wrong person on every comment event.
    #
    # THIS GATE ALONE IS NOT SUFFICIENT, which is why the fork check below exists. It authenticates
    # the person who typed the trigger, not the person who wrote the code that would then run.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      ) && contains(
        fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # The confused deputy this job would otherwise be. The `if:` above authenticates the COMMENTER;
      # it says nothing about who wrote the code. A maintainer typing "@claude" on an outside
      # contributor's fork PR is a trusted trigger over untrusted content - and if the action checks
      # out the PR head (see the note on claude_args below, which is exactly what this repo has not
      # yet proven either way), the fork author chooses what `bin/check-docs-data.sh` contains, and
      # this job executes it with CLAUDE_CODE_OAUTH_TOKEN in the environment.
      #
      # That gap does not exist in claude-code-review.yml: `pull_request` withholds secrets from
      # forks entirely, so there is nothing worth stealing in a fork run. A comment trigger has no
      # such protection, so the trust boundary has to be drawn here instead.
      #
      # Runs before checkout so untrusted refs are never fetched. Non-PR events (`issues`) skip it.
      - name: Refuse a pull request from a fork
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cross=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)
          if [ "$cross" != "false" ]; then
            echo "::error::Refusing to run: pull request #${PR_NUMBER} comes from a fork. This job holds repository secrets and can execute scripts from the checked-out tree, so it is restricted to same-repository pull requests regardless of who triggered it. See the comments in this workflow."
            exit 1
          fi
          echo "Pull request #${PR_NUMBER} is same-repository; proceeding."

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # WHY THIS EXISTS
          #
          # This file is the ONLY reviewer available to a PR that edits claude-code-review.yml: the
          # action refuses to run when its own workflow differs from the default branch, so the
          # automatic reviewer skips itself there (see docs/inflight/ci-review-agent.md). Until now
          # that fallback passed no allow-list at all - which is not permissive. An absent list means
          # Bash is not pre-approved, and a CI run has nobody to answer the approval prompt, so every
          # script call was refused outright.
          #
          # So the one reviewer that most needs to check a claim by running it was the one least able
          # to. On astubbs#273 it verified a self-test's negative control by hand-tracing Python
          # instead of executing a one-second script, and reported the block itself: "both
          # `bash bin/test-check-docs-data.sh` and `./bin/check-docs-data.sh` returned 'this command
          # requires approval'" while `git log`, `grep` and `python3 --version` ran unprompted.
          #
          # WHAT IS GRANTED, AND WHY ONLY THIS
          #
          # Gates that let the reviewer CHECK a claim rather than infer it, per the rule in
          # bin/AGENTS.md, plus read-only `gh` queries. Deliberately NOT the Maven suites that
          # claude-code-review.yml grants: those need a JDK and a warm cache this job does not set up,
          # and a comment-triggered job holding secrets is the wrong place to run a build.
          #
          # WHAT WRITES, PRECISELY - because "read-only gates" was claimed here once and was not true.
          #
          # bin/test-check-docs-data.sh mutates files IN THE REPO TREE: it edits a corpus file, asks the
          # guard for a verdict, and copies it back, one case at a time. That is the considered
          # exception claude-code-review.yml documents at its own grant - it restores through a trap on
          # any exit, and the claim it lets a reviewer test is the one this repo has most often got
          # wrong: whether a guard catches what it says it catches.
          #
          # bin/test-check-shell-sigpipe.sh also writes, but only inside a `mktemp -d` it removes on
          # exit. It never touches the tree under review.
          #
          # bin/todo-index.sh CAN rewrite docs/todo-index.md, which is why it is granted only as
          # `--check`; the rewriting form is not reachable through this allowlist.
          #
          # Everything else granted here reads and reports. Re-audit this list when adding to it: the
          # first version of this comment called the whole set read-only, which was wrong twice over.
          #
          # bin/todo-index.sh is granted ONLY with --check. Bare, it REGENERATES docs/todo-index.md
          # (see its own usage block), which would leave the reviewer inspecting a tree it had itself
          # modified - and make any diff it then reports untrustworthy. --check is the verify mode.
          #
          # bin/check-quarantine-owners.sh is absent for a stronger reason: it is not read-only. It runs
          # `git fetch --depth=1 origin <base>` and `git fetch --depth=1 origin pull/<n>/merge`, then
          # reads FETCH_HEAD. So it reaches the network outside `gh` AND moves the checkout's fetch
          # state under the reviewer - which would make anything it inspected afterwards untrustworthy,
          # the same defect as granting bare `bin/todo-index.sh`. Its owner-claim verification is CI's
          # job (the Quarantine Audit lane), not an ad-hoc reviewer's.
          # bin/check-quarantine-registry.sh stays: it only reads the tree.
          #
          # bin/check-review-posted.sh is absent on purpose - it reads comment bodies from stdin and
          # belongs to the review job's own gate, not to an ad-hoc reviewer.
          claude_args: >-
            --allowed-tools
            "Bash(bin/check-docs-data.sh:*),Bash(./bin/check-docs-data.sh:*),Bash(bin/test-check-docs-data.sh:*),Bash(./bin/test-check-docs-data.sh:*),Bash(bin/check-shell-sigpipe.sh:*),Bash(./bin/check-shell-sigpipe.sh:*),Bash(bin/test-check-shell-sigpipe.sh:*),Bash(./bin/test-check-shell-sigpipe.sh:*),Bash(bin/check-copyright-headers.sh:*),Bash(./bin/check-copyright-headers.sh:*),Bash(bin/test-check-copyright-headers.sh:*),Bash(./bin/test-check-copyright-headers.sh:*),Bash(bin/test-check-review-posted.sh:*),Bash(./bin/test-check-review-posted.sh:*),Bash(bin/check-quarantine-registry.sh:*),Bash(./bin/check-quarantine-registry.sh:*),Bash(bin/check-issue-refs.sh:*),Bash(./bin/check-issue-refs.sh:*),Bash(bin/check-action-versions.sh:*),Bash(./bin/check-action-versions.sh:*),Bash(bin/todo-index.sh --check:*),Bash(./bin/todo-index.sh --check:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

