# Chaos Pain Suite - ON-DEMAND seeded stall hunting on the self-hosted high-CPU runner.
#
# Runs the @Tag("chaos") suite (see integrationTests.chaostests + the design doc under docs/plans/):
# seeded chaos schedules against a PC fleet with SLO probes (progress watermark, rebalance-dwell zombie
# probe, drain bound) and a correctness ledger. NEVER PR-gating. Failures are investigation food - the
# seed + chaos timeline in the logs replay the schedule, and reports upload as artifacts.
#
# This workflow is workflow_dispatch ONLY (seed replay + reps; runs QUEUE - measurements are never
# killed). The per-PR-commit chaos run lives in the highcpu fast-feedback lane
# (pr-highcpu-fast-feedback.yml, check "highcpu / Chaos Pain Suite") - both call bin/chaos-test.sh.
#
# QUARANTINE interaction: bin/chaos-test.sh EXCLUDES @Quarantined chaos scenarios - the Quarantine
# Lane owns them, and a known-RED scenario must not drown the tripwire signal. While W1
# (ChaosChurnStormIT) is quarantined under PR astubbs#80 and no other chaos scenario exists, runs select
# ZERO tests - the summary says so loudly instead of impersonating a real GREEN run.
#
# SECURITY (public repo + self-hosted runner): workflow_dispatch only - write-access-gated by
# construction, so no untrusted fork code can reach the self-hosted machine through this workflow.
# Inputs pass through env (data), never ${{ }} inside run blocks (code). See docs/self-hosted-runner.md.

name: chaos-pain

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Chaos seed (empty = random, logged in the run for replay)'
        required: false
        default: ''
      reps:
        description: 'How many times to run the suite'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: chaos-pain-${{ github.ref }}
  cancel-in-progress: false   # chaos runs are measurements - queue, never kill

jobs:
  chaos:
    name: "Chaos Pain Suite (on-demand)"
    runs-on: [self-hosted, highcpu]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Show environment
        run: |
          java -version
          echo "cpus: $(nproc)"
          docker --version

      - name: Chaos runs
        env:
          CHAOS_SEED: ${{ inputs.seed }}
          CHAOS_REPS: ${{ inputs.reps }}
        run: bin/chaos-test.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-pain-reports-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 30
