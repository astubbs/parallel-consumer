# Chaos Pain Suite - stall hunting on the self-hosted high-CPU runner.
#
# Runs the @Tag("chaos") suite (see integrationTests.chaostests + the design doc under docs/plans/):
# seeded chaos schedules against a PC fleet with SLO probes (progress watermark, rebalance-dwell zombie
# probe, drain bound) and a correctness ledger. NEVER PR-gating (not in the merge ruleset). Failures are
# investigation food - the seed + chaos timeline in the logs replay the schedule, and reports upload as
# artifacts.
#
# Triggers:
#   - workflow_dispatch (manual)  - seed replay + reps; runs QUEUE (measurements are never killed)
#   - pull_request                - one run per PR commit: duration visibility + ambient tripwire (a RED
#                                   here is a real finding - the suite is calibrated GREEN on both
#                                   assignors). Superseded commits on the same PR are CANCELLED, and a
#                                   per-run timing table lands in the job summary.
#
# SECURITY (public repo + self-hosted runner): the job is guarded to SAME-REPO pull requests only
# (head.repo == this repo), so a fork PR's untrusted code NEVER runs on the home machine (RCE). We use
# `pull_request` (untrusted-code trigger, no secrets exposed), never `pull_request_target`.
# workflow_dispatch is write-access-only by construction. See docs/SELF_HOSTED_RUNNER.md.

name: chaos-pain

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Chaos seed (empty = random, logged in the run for replay)'
        required: false
        default: ''
      reps:
        description: 'How many times to run the suite'
        required: false
        default: '1'
  pull_request:

permissions:
  contents: read

concurrency:
  # Dispatch runs are measurements - queue per ref, never kill. PR runs are per-commit feedback -
  # cancel superseded commits so the runner only measures the latest push.
  group: chaos-pain-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chaos:
    name: "Chaos Pain Suite (${{ github.event_name == 'pull_request' && 'per-PR-commit' || 'on-demand' }})"
    # Same-repo PRs only: a fork PR is untrusted code and must NOT execute on the home machine.
    # workflow_dispatch (manual, write-access-only) is always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, highcpu]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Show environment
        run: |
          java -version
          echo "cpus: $(nproc)"
          docker --version

      - name: Chaos runs
        # Inputs go through env, never ${{ }} inside run: - template substitution pastes raw text
        # into the script BEFORE bash parses it, so a seed like `$(...)` would execute on the
        # self-hosted runner (review finding, PR #83). Env vars are data, not code.
        env:
          CHAOS_SEED: ${{ inputs.seed }}
          CHAOS_REPS: ${{ inputs.reps }}
        run: |
          echo "CHAOS_START=$(date +%s)" >> "$GITHUB_ENV"
          SEED_ARG=""
          if [ -n "$CHAOS_SEED" ]; then SEED_ARG="-Dchaos.seed=$CHAOS_SEED"; fi
          REPS="${CHAOS_REPS:-1}"   # pull_request events carry no inputs - single rep
          for i in $(seq 1 "$REPS"); do
            echo "=== chaos rep $i/$REPS ==="
            time ./mvnw --batch-mode -Pci -pl parallel-consumer-core -am verify \
              -DskipUTs=true -Dlicense.skip \
              -Dincluded.groups=chaos -Dexcluded.groups=quarantined \
              ${SEED_ARG:+"$SEED_ARG"}
          done

      - name: Timing summary
        if: always()
        run: |
          {
            echo "## Chaos suite timing"
            echo ""
            if [ -n "${CHAOS_START:-}" ]; then
              total=$(( $(date +%s) - CHAOS_START ))
              printf 'Total chaos wall-clock: **%dm %02ds** (setup excluded)\n\n' $((total / 60)) $((total % 60))
            fi
            echo "| Test class | Time |"
            echo "|---|---|"
            find . -path '*/failsafe-reports/TEST-*.xml' -print0 | while IFS= read -r -d '' f; do
              tag=$(head -3 "$f" | tr '\n' ' ')
              n=$(printf '%s' "$tag" | grep -o 'name="[^"]*"' | head -1 | cut -d'"' -f2)
              t=$(printf '%s' "$tag" | grep -o 'time="[^"]*"' | head -1 | cut -d'"' -f2)
              [ -n "$n" ] && echo "| $n | ${t}s |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-pain-reports-${{ github.run_number }}
          path: '**/target/*-reports/*.xml'
          retention-days: 30
