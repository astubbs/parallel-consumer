# Cheap, repo-wide static checks: things that need no JDK, no broker and no build.
#
# Separate from copyright.yml deliberately: these checks are not about copyright and never were,
# and bolting them there left a job called "Copyright header check" doing two unrelated things.
#
# ONE LANE, DISCOVERED - and this replaced one-job-per-concern deliberately. That shape gave each
# gate its own required-status-check candidate and its own red tick, which reads well, and cost
# something that mattered more: every gate and every self-test had to be NAMED here to run at all.
# A gate added to bin/ ran nowhere until somebody remembered to wire it, and that is not
# hypothetical - the shallow-clone hook's self-test was added and was the only self-test in bin/
# that no workflow named. The failure is silent by construction: nothing goes red to tell you a
# check is not running.
#
# `bin/check-all.sh --with-tests` globs `bin/check-*.sh` and `bin/test-*.sh`, so the set cannot drift
# from what exists. It does not stop at the first failure - every check runs, and the summary names
# each one that failed with the tail of its output - so a single lane loses no attribution against
# the previous per-job layout. It runs the gates concurrently and finishes in about a minute, which
# is why splitting them across runners bought little: the wall-clock was dominated by ten checkouts,
# not by the checks.
#
# WHAT IS INTENTIONALLY NOT HERE: anything needing a broker, Docker or Infer. Those lanes live in
# maven.yml with their own setup. A JDK IS set up, because one self-test fails rather than skips
# without it - see the step below. Keep the dependency list short and explicit; the failure mode this
# guards against is a lane that passes only because of what the runner image happens to ship.
#
# THE JOB NAME IS AN API. It is a required status check in the master ruleset, and renaming it
# silently stops satisfying that ruleset - the same trap the per-job names carried. If you rename it,
# update the ruleset in the same change.

name: Repo Hygiene

# push scoped to master (matching copyright.yml and maven.yml) so PR-branch commits run once via
# the pull_request event instead of twice.
on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-hygiene-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: "repo: hygiene"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PR_NUMBER is not a convenience here - without it bin/check-branch-self-reference.sh checks HALF
    # of what it claims and still exits 0. `gh` on this runner is unauthenticated (no GH_TOKEN in
    # this workflow, by design - nothing else here needs one), so the script's `gh pr list` fallback
    # fails, the failure is swallowed, and the `#NNN` / `/pull/NNN` arm is skipped entirely - the
    # gate prints "NO PR NUMBER RESOLVED... were NOT checked" and still exits 0. That arm is the
    # gate's own motivating incident: a note citing astubbs#1 by number, with no branch name in it.
    # Job-level (not step-level) because this lane collapsed nine per-gate steps into one
    # bin/check-all.sh invocation - there is no single step to attach it to, and check-all.sh's
    # run_capture already passes PR_NUMBER through to every gate harmlessly. The event payload
    # already carries the number, so this costs nothing and needs no token.
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Gates that read history must not see a truncated graft. A shallow clone does not error
          # on `git log` or `git merge-base` - it answers, wrongly, which is the exact class
          # .claude/hooks/check-shallow-history.sh exists to stop locally.
          fetch-depth: 0

      # ubuntu-latest ships shellcheck, but an image change that removed it must fail rather than
      # silently pass - bin/check-shell-lint.sh exits 2 for "cannot run", and check-all counts an
      # exit 2 as CANNOT rather than a pass, so this makes the dependency explicit at the point a
      # reader looks.
      - name: Confirm shellcheck is present
        run: shellcheck --version

      # A JDK IS REQUIRED, and the requirement is not obvious from the job name. The self-test
      # `bin/test-check-infer.sh` FAILS rather than skips when no JDK resolves and `CI` is set - by
      # design, since on a hosted runner an unresolvable JDK means the fixture is wrong, not that the
      # check is unnecessary. Without this step the lane passes only because ubuntu-latest happens to
      # ship a default JDK, which is an undocumented dependency on the runner image and exactly the
      # kind of thing that breaks on an image bump with no code change to blame.
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          # No `cache: maven` - see the caching strategy note at the top of maven.yml

      - name: Every gate and every self-test, discovered rather than listed
        run: bash bin/check-all.sh --with-tests
