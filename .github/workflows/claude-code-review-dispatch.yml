name: review (on demand)

# THE REVIEWER. Dispatched by hand, never on push.
#
#   gh workflow run claude-code-review-dispatch.yml -R astubbs/parallel-consumer --ref master \
#     -f pr=279 \
#     -f focus="the guard's failure paths, not the docs"
#
# `--ref master` is not decoration - see "WHY --ref master" below.
#
# It used to run on every `pull_request` event, which spent a full review on every push,
# overwhelmingly on branches that were not ready for one. The cheap always-on half of that
# job now lives in .github/workflows/claude-code-review.yml, which costs nothing; this is the
# expensive half, and it runs when somebody asks for it. What satisfies that gate is stated once,
# in docs/ci.md - not restated here, because this sentence described the previous contract for
# weeks after it changed. (There is a third `claude*` workflow, claude.yml - the @claude comment
# route. It is a reviewer too, and the only one that can open inline review threads. The three
# are told apart in docs/ci.md, "The three claude* workflows".)
#
# WHAT MUST NOT BE LOST FROM THIS FILE
#
# `plugins:` and the `/code-review:code-review ... --comment` prompt are the whole reason this
# is a workflow and not a chat message. They invoke a PACKAGED REVIEW PROCEDURE. Drop either
# and the run still produces something review-shaped, so the loss is invisible: every review
# afterwards is free-form, and nobody notices for months. That is not hypothetical here - the
# `--comment` flag alone once went missing and this workflow ran green for months without
# posting a single review.
#
# The `focus` input is what a free-form mention was better at, kept without giving up the
# procedure: the steer is APPENDED to the slash command, never substituted for it.
#
# WHAT A DISPATCH TRIGGER COSTS, AND WHY IT IS PAID HERE RATHER THAN HIDDEN
#
# `claude-code-action` picks its behaviour from the EVENT, not from its inputs. On a PR or
# issue event it runs in TAG mode: it opens a tracking comment as `claude[bot]`, installs an
# MCP server for inline review comments, and installs another for reading the PR's CI. On
# every other event it runs in AGENT mode and does none of that. `workflow_dispatch` is not a
# PR event and CANNOT BE MADE INTO ONE - see "WHY THE EVENT CANNOT BE FAKED" below - so this
# workflow runs in agent mode, and three things the `pull_request`-triggered version had are
# gone. Each is compensated for below, out loud, because a capability that quietly stops
# existing is this repo's most-repeated defect:
#
#   1. NO TRACKING COMMENT, so nothing posts a `claude[bot]` issue comment on its own. Left
#      alone, the packaged procedure posts an issue comment ONLY when it finds nothing (its
#      step 7); when it finds something it posts inline comments and stops. The gate reads
#      ISSUE comments, so the reviews that matter most would never turn `claude-review` green.
#      Compensated by the FINISH WITH A SUMMARY COMMENT instruction in the system prompt below,
#      which makes the summary comment mandatory rather than a fallback. That instruction is
#      load-bearing: delete it and the gate becomes unsatisfiable on any review with findings.
#   2. NO `mcp__github_inline_comment__create_inline_comment`. The action installs that server
#      only for a PR/issue event, so on this trigger the tool does not exist. It is therefore
#      NOT in --allowedTools - a grant that cannot match reads as a capability the reviewer
#      does not have - and the blocking-findings instruction no longer asks for review threads.
#      THIS IS A REAL LOSS: an unresolved review thread is the only thing that mechanically
#      gates a merge here, so blocking findings are now prose in the summary that a human has
#      to act on. Restoring it needs a different trigger or a different posting route; see
#      docs/inflight/ci-review-agent.md.
#   3. NO `github_ci` MCP server. Replaced with plain CLI grants (`gh run list`, `gh run view`)
#      plus `additional_permissions: actions: read`, which is what gives the reviewer's own
#      token the scope to read them. NOT `gh pr checks`: it reads check RUNS, which needs the
#      `checks` permission, and `checks` is neither in the action's default token scope
#      (`contents`, `pull_requests`, `issues`) nor something `additional_permissions` is
#      documented to support - "Currently supports 'actions: read'". The workflow-run view is
#      the one this token can actually be granted.
#
# WHY THE EVENT CANNOT BE FAKED
#
# The obvious escape is to hand the action a `pull_request` payload and let tag mode run:
# `@actions/github` learns its trigger from exactly two variables, `GITHUB_EVENT_NAME` and
# `GITHUB_EVENT_PATH`. It does not work, and it was tried rather than reasoned about. The
# runner writes the `GITHUB_*` context variables into every step's environment AFTER the step's
# own `env:` block, unconditionally, so the override is silently discarded. Measured in run
# 31466525816, a step declaring both of them saw:
#
#     GITHUB_EVENT_NAME as this step sees it: 'workflow_dispatch'
#     GITHUB_EVENT_PATH as this step sees it: '/home/runner/work/_temp/_github_workflow/event.json'
#
# (`ScriptHandler.PrepareExecution` and `NodeScriptActionHandler.PrepareExecution` in
# actions/runner both end with `Environment[env.Key] = env.Value` over the github context, and
# `event_name` is on its allowlist. GitHub's own documentation says the same thing: default
# `GITHUB_*` variables cannot be overridden.) The payload file's CONTENTS are writable, but the
# event NAME is not, and the name alone decides the mode. So: do not try this again.
#
# WHY --ref master
#
# `claude-code-action` refuses to run when the workflow file invoking it differs from the
# default branch's copy - a PR must not be able to rewrite its own reviewer. A dispatch runs
# the workflow from the ref you name, so dispatching `--ref master` runs master's copy of THIS
# file, which is identical to the default branch by construction, while reviewing a PR branch
# checked out below. Reviewer and reviewed are then two different things, which is exactly what
# a `pull_request` run cannot arrange.
#
# Dispatching `--ref <the PR branch>` would defeat that and reintroduce the old trap, so do
# not: it runs the PR's copy of this file, which is the case the guard exists to refuse.
#
# WHY THIS IS TWO JOBS
#
# `review` checks out the PR and RUNS ITS CODE - the reviewer is allowed to execute this repo's
# test and check scripts, and on a PR branch those scripts are whatever the PR says they are.
# So `review` holds no write grant it does not need, and its checkout sets
# `persist-credentials: false` so the job's token is not left in .git/config next to that code.
#
# `refresh-gate` exists solely to hold the one write grant the contract does need - `actions:
# write`, to re-run the gate - in a job that checks NOTHING out. Keeping it in `review` would
# put a token that can dispatch, cancel and re-run any workflow in the repo (release.yml among
# them) in the same filesystem as PR-authored scripts.
#
# This is the fork-head refusal's question asked one level in. That guard asks "whose code is
# this?"; the split asks "what could that code reach if it turned out to be hostile?". A
# same-repository PR does mean a write-access author, but write access to a branch is not the
# same thing as a token that can fire a release. Do not merge these jobs back together.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true
      focus:
        description: 'Optional context to steer the reviewer (e.g. "the guard, not the docs")'
        required: false

# One review per PR at a time, newest wins. A superseded run is reviewing a head that has
# already moved.
concurrency:
  group: claude-review-dispatch-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Bounded because the reviewer may run test suites (see --allowedTools): a wedged suite
    # must not hold a runner indefinitely. Generous enough for a unit run on a 2-core hosted
    # box.
    timeout-minutes: 30
    # Consumed by `refresh-gate`, which needs both of these but must NOT check out PR code to
    # get them.
    outputs:
      # The ACTION's own verdict, not the step's. `steps.claude-review.outcome` is the step's,
      # and the step reports success in at least one case where the action reviewed nothing at
      # all - see "Refuse to report success for a review that did not run" below.
      review_conclusion: ${{ steps.claude-review.outputs.conclusion }}
    permissions:
      contents: read
      # The review comment is posted by the ACTION's own app token, not by this one, so what
      # this scope buys is not the posting. It is kept at write rather than narrowed because
      # nothing here has proven the workflow token is unused on that path, and a review that
      # runs for half an hour and then cannot post is a far worse failure than a scope that
      # turns out to be unnecessary. Narrowing it is a follow-up with a test behind it, not a
      # guess.
      pull-requests: write
      issues: read
      id-token: write
      # READ, never write. This job checks out the PR's own code and deliberately EXECUTES it
      # (see --allowedTools: the reviewer runs this repo's test and check scripts), so every
      # permission here is a permission handed to whatever those scripts have been changed to
      # do. `actions: write` would be enough to dispatch, cancel or re-run any workflow in the
      # repo - including release.yml's `workflow_dispatch` path - so it lives in the separate
      # `refresh-gate` job below, which checks nothing out. Read alone lets the reviewer read
      # the PR's CI results, which is worth more here than on the old push trigger: a review is
      # requested when the branch is ready, by which time the test jobs have usually finished.
      actions: read

    steps:
      # `pr` reaches a git ref and a prompt, so it is checked before either. A dispatch
      # already requires write access, so this is input hygiene rather than a trust boundary.
      # `pr` reaches a git ref and a prompt, and decides whose code runs next to the review
      # credential, so both are checked before anything is fetched.
      - name: Validate inputs and refuse fork heads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          case "$PR" in
            '' | *[!0-9]*)
              echo "::error::pr must be a PR number, got '$PR'"
              exit 1
              ;;
          esac

          # THE FORK GUARD IS NOT OPTIONAL, AND IT IS NEW WORK RATHER THAN A CARRIED-OVER RULE.
          #
          # The old reviewer ran on `pull_request`, where GitHub itself withheld secrets from
          # fork PRs - the job simply failed instead of running untrusted code beside the
          # credential. `workflow_dispatch` has no such protection: this job always holds
          # CLAUDE_CODE_OAUTH_TOKEN, and the step below checks out whatever `refs/pull/<pr>/head`
          # points at and lets the reviewer execute the repo's build and test scripts from it.
          # A maintainer dispatching a review of an external fork PR would therefore run that
          # fork's code next to the token. Dispatch permission says the DISPATCHER is trusted; it
          # says nothing about the branch being reviewed.
          #
          # So the protection the old trigger gave for free is re-established explicitly.
          #
          # BE HONEST ABOUT WHAT THIS COSTS A FORK PR. The gate accepts only a `claude[bot]`
          # comment, and this is the only thing that produces one - so refusing fork heads means a
          # fork PR has no way to turn `claude-review` green. Reading it carefully by hand is
          # still the right thing to do, but it does not satisfy the check, and the message below
          # must not imply that it does. The one path to both a real review and a green check is
          # to move the commits onto a branch in this repo; otherwise the honest escape is the
          # same one the gate documents everywhere else - merge with the check red. See
          # docs/ci.md, "A fork PR cannot turn the gate green".
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name // ""')
          if [ "$head_repo" != "$REPO" ]; then
            echo "::error::PR #$PR has its head in '${head_repo:-<deleted fork>}', not $REPO." \
                 "This job holds the review credential and executes the checked-out code, so it" \
                 "refuses fork heads. To get BOTH a review and a green claude-review, push the" \
                 "same commits to a branch in this repo and open the PR from there. Reading the" \
                 "fork PR by hand is worth doing but will NOT satisfy the gate - it accepts only" \
                 "a claude[bot] comment - so the remaining option is to merge with the check red."
            exit 1
          fi

          echo "Reviewing PR #$PR (head in $head_repo)"

      - name: Checkout the PR under review
        uses: actions/checkout@v6
        with:
          # The PR's head, NOT the ref this workflow was dispatched from. The workflow comes
          # from master (see "WHY --ref master"); the code under review comes from the PR.
          ref: refs/pull/${{ inputs.pr }}/head
          # Full history: the reviewer compares against the PR base, which a depth-1 clone
          # can't reach.
          fetch-depth: 0
          # Do NOT leave the job's token in .git/config. checkout defaults this to true, which
          # writes an authenticated header into the working copy - the same working copy whose
          # scripts this job then executes. Nothing after this step pushes or fetches, so the
          # persisted credential buys nothing and only widens what a modified `bin/` script
          # could reach.
          persist-credentials: false

      # The reviewer is allowed to run the unit/integration suites itself (see --allowedTools
      # below), so the job needs a JDK and a warm Maven cache - otherwise every invocation
      # fails or spends its budget re-downloading the world.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOT `true`, and this is the one input that cannot simply be turned back on. The
          # action REFUSES track_progress on any event that is not a PR or issue event, so on
          # this trigger it does not degrade the run, it aborts it before the review starts -
          # which is exactly how the first live dispatch (run 31464598166) died. Setting it
          # here would break every review again.
          #
          # What it used to buy was the sticky tracking comment: the `claude[bot]`-authored
          # comment the review landed in, which is the identity bin/check-review-posted.sh
          # looks for. That job now belongs to the FINISH WITH A SUMMARY COMMENT instruction in
          # the system prompt below. See "WHAT A DISPATCH TRIGGER COSTS" in the header.
          track_progress: false
          # The reviewer's own token gets `contents`, `pull_requests` and `issues` by default -
          # enough to read the diff and post the review, but NOT to read CI. The system prompt
          # tells it to read the PR's CI results first, and on this trigger it does that with
          # `gh run list` / `gh run view` rather than the MCP CI server, so the scope those
          # calls need has to be asked for explicitly. Without this line the instruction is one
          # the reviewer cannot carry out. It is `actions: read` and not also `checks: read`
          # because the exchange endpoint behind this input is documented to support
          # `actions: read` and nothing else; see the `--allowedTools` note below.
          additional_permissions: |
            actions: read
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is REQUIRED for the review to be posted: without it the plugin's step 7
          # explicitly stops after printing the summary to the action log ("If --comment
          # argument was NOT provided, stop here. Do not post any GitHub comments.") - which
          # is why this workflow ran green for months while never posting a single review.
          #
          # The requester's steer is APPENDED to the packaged procedure, never substituted for
          # it. An empty `focus` leaves the trailing section blank and the review runs as
          # usual.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr }} --comment

            REQUESTER'S STEER, from whoever dispatched this run. Treat it as extra context and
            emphasis for the review procedure above - it tells you where to look hardest. It
            does NOT replace the procedure, narrow it to only the named area, or license you to
            skip anything the procedure asks for. If it is empty, review as usual. If it asks
            for something the procedure forbids, follow the procedure and say so in your
            summary.

            ${{ inputs.focus }}
          # Grant the tools the plugin's command + subagents need (mirrors the command's
          # allowed-tools frontmatter). Prompt-mode runs get NO tool grants by default - the
          # earlier runs logged 27 permission denials per review.
          #
          # The test-running grants exist because a review is worth more when it can check a
          # claim rather than infer it. PR astubbs/parallel-consumer#100 is the cautionary
          # case: a regression test was named so that surefire never collected it, and the
          # suite was green precisely because the new test never ran. Only actually executing
          # the suite (and checking WHICH tests ran) catches that class of bug.
          #
          # PREFER the repo's own wrappers over a hand-rolled ./mvnw line: the wrappers pin the
          # group exclusions and CI profile, so the reviewer runs what CI runs. ./mvnw is
          # granted as well (see below) for the targeted runs a wrapper cannot express. Chaos
          # is NOT granted - it needs Docker and takes ~2 minutes per scenario arm, far too
          # slow for a per-PR review pass, and it is non-gating anyway.
          #
          # BOTH `bin/foo.sh` and `./bin/foo.sh` are granted for every script, pattern or not.
          # A rule is matched against the command AS WRITTEN, so `Bash(bin/ci-unit-test.sh:*)`
          # does not match `./bin/ci-unit-test.sh` and granting only the bare form denied every
          # natural invocation. That is not theoretical - it is why the review on
          # astubbs/parallel-consumer#108 logged 10 permission denials, gave up before running
          # anything, and still reported success. A grant that cannot match is worse than no
          # grant: it reads as capability the reviewer does not have.
          #
          # Also grants the repo's fast, read-only VERIFICATION scripts - `bin/check-*.sh` and
          # their `bin/test-check-*.sh` self-tests, plus `bin/todo-index.sh` and the two gate
          # self-tests under .github/scripts/ - so the reviewer can independently re-run what a
          # PR claims rather than inferring it from the diff, e.g. `bin/check-copyright-headers.sh`
          # to confirm a header claim. NOT the quarantine/test RUNNERS (quarantined-test.sh,
          # quarantine-lane-report.sh) - those execute suites, are slow, and test execution is
          # already covered by the ci-*-test.sh wrappers above.
          #
          # THOSE TWO FAMILIES ARE GRANTED AS PATTERNS ON PURPOSE. DO NOT RE-ENUMERATE THEM.
          #
          # A grant a pull request adds can never apply to that pull request, on any route: the
          # action runs the DEFAULT BRANCH's copy of the workflow (docs/ci.md, "Editing the
          # reviewer"). So a per-script grant has to land in an EARLIER pull request than the
          # script it grants - a discipline nobody keeps, and demonstrably so. Four check scripts
          # arrived with astubbs/parallel-consumer#279, all four were granted in that same pull
          # request, and its own reviewer could run none of them; the failure was then written up
          # as a mystery approval layer before anyone noticed the copy in force was master's.
          # A pattern makes the grant arrive with the CONVENTION instead, once, ahead of every
          # script that will ever follow it.
          #
          # Bash rules glob with `*` at any position and `:*` is the trailing-wildcard form, so
          # `Bash(bin/check-*.sh:*)` matches `bin/check-foo.sh` bare and with arguments.
          #
          # WHAT THE PATTERN FORM DELIBERATELY ACCEPTS: a pull request can add
          # `bin/check-<anything>.sh` and have this reviewer run it. That is not a new capability
          # on this route. The checkout below IS `refs/pull/<n>/head`, so every grant here already
          # executes the PULL REQUEST's copy - `bin/check-copyright-headers.sh` has been granted
          # for months and is whatever the branch says it is, the ci-*-test.sh wrappers run the
          # branch's Java, and `./mvnw` runs the branch's pom. The bound is unchanged and is not
          # the shape of the list: fork heads are refused outright, and dispatching requires write
          # access. (The comment route is the same in this respect, not narrower: the action
          # checks the PR's head out there too, so the pattern matches the PR's scripts on both
          # routes. Its bound is its own fork-head withholding - see claude.yml.)
          #
          # NOT WIDENED FURTHER, and the remaining enumeration is not laziness. `Bash(bin/*.sh:*)`
          # would sweep in exactly the scripts this list refuses on purpose - quarantined-test.sh,
          # quarantine-lane-report.sh, chaos-test.sh, soak-test.sh, performance-test.sh, deploy.sh
          # - so ci-unit-test.sh, ci-integration-test.sh and todo-index.sh stay named one by one.
          # `check-` and `test-check-` are the two prefixes this repo uses for fast, read-only
          # guards, and the pattern is scoped to exactly those.
          #
          # bin/test-check-docs-data.sh is the one grant that writes: it mutates a corpus file,
          # asks the guard for a verdict, and copies the file back, one case at a time. That is a
          # considered exception to "do not grant anything that writes" rather than an oversight.
          # It touches only the ephemeral runner workspace, restores through a trap on any exit,
          # and the claim it lets a reviewer test is the one this repo has most often got wrong -
          # whether the guard actually catches what it says it catches. A reviewer that cannot run
          # it is left reasoning statically about a gate whose whole history is looking green while
          # broken. (Carried across from claude-code-review.yml with
          # astubbs/parallel-consumer#273, which added the scripts; the reviewer moved out of that
          # file, so the grant had to move with it or be silently lost.)
          #
          # Every ENUMERATED grant here is a script that EXISTS ON MASTER. Granting one that only
          # exists on another branch makes the grant inert and the claim false - which is how
          # `bin/todo-index.sh` (added by astubbs/parallel-consumer#103) briefly ended up listed
          # here before the script did. The two patterns are the deliberate exception to that
          # rule, and the reason they exist: a pattern is never inert, because it is a statement
          # about a naming convention rather than about a file.
          #
          # `gh run list` and `gh run view` replace the `github_ci` MCP server, which the action
          # installs only on a PR/issue event and therefore not on this one. The system prompt
          # tells the reviewer to read the PR's CI results before running anything itself, so
          # without these two that instruction had no way to be carried out. They are read-only,
          # and the scope they need is granted by `additional_permissions: actions: read` above -
          # the grant and the permission have to move together or the calls 403.
          #
          # NOT LISTED, DELIBERATELY: `gh pr checks`. It is the obvious tool for the job and it
          # is the wrong one here, because it reads check RUNS and this token cannot be given
          # the `checks` scope to do that. The action's own token defaults are `contents`,
          # `pull_requests` and `issues` (src/github/token.ts, DEFAULT_PERMISSIONS); `checks` is
          # not among them, and `additional_permissions` is documented as "Currently supports
          # 'actions: read'" - it forwards any key you write to the token-exchange endpoint
          # without validating it, so `checks: read` would be a guess at an undocumented server
          # contract sitting in the critical path of every review. Granting a tool whose calls
          # would 403 is the astubbs/parallel-consumer#108 mistake in a second costume. Runs are
          # reachable per head SHA with `gh run list -c <sha>`, which `actions: read` does cover.
          #
          # NOT LISTED, DELIBERATELY: mcp__github_inline_comment__create_inline_comment. It was
          # granted here when this workflow ran on `pull_request`, and the tool genuinely does
          # not exist on a dispatch - the action installs its server only for a PR/issue event.
          # A grant that cannot match is worse than no grant, because it reads as a capability
          # the reviewer has (that is the astubbs/parallel-consumer#108 lesson, two paragraphs
          # up). The blocking-findings instruction was rewritten to match; see "WHAT A DISPATCH
          # TRIGGER COSTS" in the header for what that loses.
          #
          # `actionlint` is granted and is not a repo script - it ships on `ubuntu-latest`,
          # with .github/actionlint.yaml already present, so the grant can never be inert. It
          # closes a gap the reviewer raised itself on astubbs/parallel-consumer#102: it could
          # not lint a workflow PR, on a repo where workflow PRs are common.
          #
          # `git rev-parse` LETS THE REVIEWER ESTABLISH WHICH TREE IT IS STANDING IN, rather than
          # inferring it from the workflow and getting it wrong - which is what happened on the
          # comment route, and is written up in docs/ci.md under "The `@claude review this`
          # comment route". Agent mode passes through only what this list names (no base Bash at
          # all, src/modes/agent/index.ts), so without the grant the check is simply unavailable.
          # Read-only; it mutates nothing. Granted on both routes to keep the lists in step.
          #
          # ./mvnw IS granted, for the job the wrappers cannot do: running ONE test class.
          # Verifying a RED/GREEN claim means reverting the fix and re-running just the new
          # test - a targeted -Dtest=X run, seconds rather than the ~6 minutes of a full suite.
          # Without it the reviewer can only re-run everything, which it will not have time
          # for, so the most valuable check it can make - does this test actually fail without
          # the fix? - was unavailable.
          #
          # The earlier objection stands as GUIDANCE, not a ban: a hand-rolled `-pl
          # parallel-consumer-core test` line skips the
          # -Dexcluded.groups=performance,chaos,quarantined the wrappers hardcode (a past P1 -
          # that exclusion was once a silent no-op, now pinned by
          # QuarantinedAnnotationContractTest, which covers the wrappers but NOT a
          # workflow-embedded command) and drops clean/rerunFailingTestsCount. So: whole suite
          # -> wrapper, every time; ./mvnw only for a scoped -Dtest run, whose result is read
          # as "did THIS test pass", never as "the suite is green". The system prompt below
          # says so explicitly.
          #
          # NOT blanket Bash(*): this job reads attacker-influencable text (diff, PR body,
          # comments), so an enumerable allowlist is the safety margin against
          # injection-into-execution. Keep it a list. The trigger itself is bounded by
          # `workflow_dispatch` requiring write access to the repository.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(git rev-parse:*),Bash(bin/ci-unit-test.sh:*),Bash(./bin/ci-unit-test.sh:*),Bash(bin/ci-integration-test.sh:*),Bash(./bin/ci-integration-test.sh:*),Bash(bin/check-*.sh:*),Bash(./bin/check-*.sh:*),Bash(bin/test-check-*.sh:*),Bash(./bin/test-check-*.sh:*),Bash(bin/todo-index.sh:*),Bash(./bin/todo-index.sh:*),Bash(node .github/scripts/issue-ref-gate.test.js:*),Bash(node .github/scripts/changelog-ref-gate.test.js:*),Bash(gh run view:*),Bash(gh run list:*),Bash(actionlint:*),Bash(./mvnw:*),Bash(mvnw:*)"
            --append-system-prompt "You CAN run this repo's tests yourself, and should when the PR adds or changes tests, or when a claim about test results is load-bearing to your review. Use bin/ci-unit-test.sh (fast, no Docker) or bin/ci-integration-test.sh (needs Docker); do NOT run the chaos suite, it is far too slow for a review pass. You can also run the repo's fast verification scripts directly to check a claim rather than trusting the PR body - e.g. bin/check-copyright-headers.sh, bin/check-quarantine-registry.sh - invoke them by their bare path, they are executable. For a SINGLE test class, use ./mvnw directly - e.g. ./mvnw -o -pl parallel-consumer-core -Dtest=SomeTest surefire:test - which takes seconds where a full suite takes minutes. That makes the highest-value check affordable: when a PR claims a test fails without its fix, revert the fix (git stash push the source files), run just that test, and confirm it actually goes RED - a test that passes either way proves nothing, and this is the single most common defect in a regression-test PR. Two rules for scoped runs: never report a targeted -Dtest result as though the suite were green (it skips the -Dexcluded.groups the wrappers pin, and covers one class), and always restore anything you stashed. For whole-suite evidence, use the wrappers, not a hand-rolled ./mvnw line. YOUR TOOL ALLOWLIST COMES FROM THE DEFAULT BRANCH'S COPY OF THIS WORKFLOW, not from the pull request you are reviewing: this run is dispatched --ref master, and the action refuses to start from any other ref. The CODE you run is the PR's, because the checkout is refs/pull/<n>/head - but a GRANT the PR adds is NOT in effect for you. So a script the diff appears to grant coming back refused is expected rather than a defect in the PR: say so plainly, review the change by reading it, and do not report yourself as broken. Reviews are requested on demand rather than fired on every push, so by the time you are asked the CI jobs have usually finished and you can read them with gh run list -c <the PR head SHA> and gh run view - READ THEIR RESULTS FIRST and say which ones you read, then execute tests yourself for anything CI does not settle. Do not treat a green CI as evidence a NEW test ran: when a PR adds a test, verify the suite ACTUALLY COLLECTED it (surefire only picks up *Test.java, Test*.java, *Tests.java, *TestCase.java - a test named otherwise silently never runs) rather than trusting a green total. If you run out of time, or a suite fails for environmental reasons, say so explicitly instead of implying you verified it. REVIEW THE PR TITLE AND DESCRIPTION AS PART OF THE DIFF, not as decoration. They are what a future reader gets instead of the diff, and on a squash merge the title BECOMES the commit title, so an inaccurate one is permanent. Check three things. (1) COMPLETENESS: does the description cover every substantive change in the diff? Descriptions are written early and drift as commits land, so a whole fix or workstream missing from an otherwise good description is the common failure - call out what is in the diff but not described. (2) ACCURACY: do specifics match reality - counts, file and test names, flags, numbers of things granted or changed, and any claimed verification? Re-derive them from the diff rather than trusting the prose; a stale \"622 tests\" or \"two scripts\" when the diff says otherwise is a real defect. Treat a checklist item marked N/A as a claim to verify like any other, especially \"docs updated - N/A\" when the diff changes docs. (3) TERMINOLOGY: does it use words the codebase uses, and does any word mislead? Flag a term that means something specific in this repo being used loosely - for example calling cross-test state contamination a \"leak\" in a repo where \"leak\" means a memory leak. Report these as normal findings, non-blocking unless the description actively misrepresents what the code does. FINISH BY POSTING A SUMMARY COMMENT. THIS IS NOT OPTIONAL AND IT IS NOT THE SAME AS PRINTING A SUMMARY. Whatever you found or did not find, your LAST action must be to post exactly one comment on the pull request with gh pr comment. The review procedure you are running only posts a comment when it finds NOTHING; that is not enough here, because the required check claude-review is satisfied by an issue comment from you and by nothing else. A review that finds problems and posts no comment leaves the PR unmergeable and is indistinguishable from no review at all - so the run that does the most work is the one that would fail hardest. One comment, not several. YOU CANNOT OPEN INLINE REVIEW THREADS ON THIS RUN. There is no inline-comment tool available to you here, so do not attempt one and do not describe your findings as though you had raised them on the line. Blocking findings (a correctness bug, data loss or corruption, a security hole, a broken public contract, or a test that cannot do what it claims) go at the TOP of that same summary comment, under a heading that says Blocking, numbered, each naming the file and line, what breaks, and what would fix it. Say in the comment, plainly, that they are blocking and that a human must act on them, because nothing mechanical will: merges here are gated on unresolved review threads and this review cannot create one. Put everything else - context, praise, nits, non-blocking observations - in a clearly separate section below, so the two are never read as the same thing. If you are unsure whether a finding is blocking, put it in the lower section and say why you were unsure. DO NOT LEAVE AN UNTICKED TASK-LIST BOX IN THAT COMMENT. The gate reads a `- [ ]` in your comment as your own statement that you stopped partway, and it will hold claude-review red forever, because a posted comment never changes. Tick every box before posting, or use plain bullets instead. And FINISH, or say plainly that you did not - do not announce that you will continue in the background; there is no background."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # THE ACTION EXITS 0 WHEN IT REVIEWS NOTHING, AND THAT IS NOT A THEORY HERE.
      #
      # Run 31466885778 dispatched this workflow, the action refused to start - "Skipping action
      # due to workflow validation: the workflow file must ... have identical content to the
      # version on the repository's default branch" - and every step of the job, including this
      # one's predecessor, reported SUCCESS. Eleven seconds, no review, green. `refresh-gate`
      # then went and re-ran the gate on the strength of it.
      #
      # That is the failure documented in
      # docs/solutions/workflow-issues/a-check-that-reports-success-without-having-run.md, and
      # the reason bin/check-review-posted.sh exists at all. The gate caught it - `claude-review`
      # on the reviewed PR stayed red, because no review comment appeared - so nothing went
      # green that should not have. But relying on the downstream gate to notice that the
      # UPSTREAM reviewer did nothing leaves the person who dispatched it reading a green run
      # and a red check with no explanation joining them.
      #
      # `outputs.conclusion` is the action's own verdict and is set only on the path that
      # actually ran Claude; the validation-skip path returns before setting it, so an empty
      # value means "did not review". Checking it here turns a silent skip into a red job with
      # the reason attached.
      - name: Refuse to report success for a review that did not run
        env:
          # Empty when the action bailed out before reviewing; 'success' or 'failure' otherwise.
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            echo "The reviewer ran and concluded successfully."
            exit 0
          fi

          if [ -z "$CONCLUSION" ]; then
            echo "::error::The review action exited without reviewing anything - it reported no" \
                 "conclusion at all. The usual cause is its workflow-validation guard: it refuses" \
                 "to run unless THIS FILE is byte-identical to the copy on the default branch," \
                 "so a dispatch of a branch that edits this workflow always lands here. Read the" \
                 "'Run Claude Code Review' step's log for the reason. No review was posted, and" \
                 "the gate on the target PR is correctly still red."
            exit 1
          fi

          echo "::error::The review action ran but concluded '$CONCLUSION'. Treating that as no" \
               "review rather than letting the gate be refreshed toward green."
          exit 1

  # WHY THIS SURVIVED THE FRESHNESS DELETION, when almost everything around it did not.
  #
  # Removing the strict rule was expected to retire this job too, on the reasoning that a push
  # creates a fresh gate run which now greens immediately. That is true OF A PUSH, and it is not
  # the case this job exists for. The gate triggers on `pull_request` only, so the terminal flow
  # - push, then ask for a review, then merge - produces no event after the review lands, and a
  # check run keeps its last conclusion until something re-runs it. The check would sit red at
  # the value it recorded BEFORE the review existed, and the only ways out would be a dummy push
  # or a hand-run re-run, on every PR.
  #
  # That is not theory: traced live on astubbs/parallel-consumer#288, where a review posted at
  # 08:29 for the current head left `claude-review` red until a hand-run `gh run rerun --failed`
  # at 08:37. Leniency does not touch that mechanism - it changes what the gate ASKS, not when
  # it is asked.
  #
  # What leniency DID delete from here: the reviewed-SHA job output and the head-moved refusal,
  # which only mattered while the answer depended on which commit was reviewed.
  # Holds the contract's only write grant, in a job that checks NOTHING out. See "WHY THIS IS TWO
  # JOBS" in the header before changing anything here - in particular, do not add a checkout.
  refresh-gate:
    runs-on: ubuntu-latest
    needs: review
    # ONLY AFTER A REVIEW THAT ACTUALLY SUCCEEDED. An earlier revision used `always()`, with the
    # rationale that a failed review should still refresh the gate rather than leave a stale
    # verdict. That rationale was wrong, and backwards: the gate accepts any fresh,
    # finished-looking `claude[bot]` comment, and a failed run can still leave its tracking or
    # error comment behind. Refreshing the gate toward SUCCESS after a review that failed is
    # exactly how an error message turns a required check green. A failed review leaving the
    # check red is the correct outcome, not a stale one.
    #
    # `needs:` alone would already skip this job on a failed review; the explicit test keeps that
    # true if anyone ever adds `continue-on-error` to the review step.
    #
    # It tests the ACTION's conclusion, not the step's outcome, and the difference is not
    # academic. In run 31466885778 the action refused to start and the step still reported
    # success, so an outcome test passed and this job re-ran the gate for a review that never
    # happened. The action's `conclusion` output is empty on every path that did not actually
    # review, which is the distinction this job needs.
    if: needs.review.outputs.review_conclusion == 'success'
    permissions:
      # The whole reason this job exists.
      actions: write
      # To read the PR's current head SHA, and nothing else.
      pull-requests: read
    steps:
      # WITHOUT THIS STEP THE GATE STAYS RED FOREVER AFTER A SUCCESSFUL REVIEW.
      #
      # `claude-review` is produced by .github/workflows/claude-code-review.yml, which triggers
      # only on `pull_request` events. Dispatching a review fires no such event, and a check run
      # keeps its last conclusion until something re-runs it - so the review would post, satisfy
      # the gate's rules, and the required check would still show the red it recorded before the
      # review existed. Requesting a review would not actually clear the check, which is the one
      # thing this PR's whole contract promises it does.
      #
      # Re-running the gate's existing run is what keeps the check attached to the same head
      # SHA: a re-run reports into the same check suite on that commit, whereas a fresh
      # dispatch- or comment-triggered run would attach its check to the default branch instead
      # and never satisfy the PR's required check.
      #
      # Never fails the job: not finding a gate run to re-run is a reason to say so, not to fail
      # a review that already happened.
      - name: Re-run the review gate so it sees this review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          head_sha=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')

          # No head-moved comparison any more, and none is needed. The gate no longer asks
          # whether the review covered this head - only whether a finished review exists on the
          # PR - so a head that moved mid-review does not change the answer, and the reviewed
          # SHA no longer has to be carried across the job boundary. It went with the freshness
          # rule; see docs/inflight/parked-strict-review-gate-freshness.md.

          # head_sha ALONE DOES NOT IDENTIFY THIS PR'S GATE RUN. One head can back more than one
          # PR - the same branch opened against `master` and a release branch - and the gate runs
          # once per PR, so the SHA filter returns both runs. Taking the newest (what `per_page=1`
          # amounts to) would then re-run the OTHER PR's gate: that PR goes green, this one stays
          # red, and the log line says the gate was refreshed. `pull_requests[]` carries the
          # association the SHA filter drops, so select on it.
          #
          # Not --paginate, unlike the gate's check-suite read, and the difference is deliberate:
          # this list is bounded by construction. One gate run per PR per head, and a re-run
          # reuses its run rather than adding an entry, so `per_page=100` is orders of magnitude
          # of headroom. The check-suite list had 15 against a default page of 30, which is not.
          runs=$(gh api \
            "repos/$REPO/actions/workflows/claude-code-review.yml/runs?head_sha=$head_sha&per_page=100")

          # The newest run naming this PR, chosen by `run_number` rather than by taking the first
          # element. The list is near-certainly newest-first, but that ordering is not documented,
          # and picking a superseded attempt here would re-run a run the gate's
          # `cancel-in-progress` concurrency already cancelled. Same reasoning as the paginated
          # check-suite read in claude-code-review.yml: do not build the gate on an unspecified
          # order when one expression removes the assumption.
          #
          # `--arg` + `tonumber` rather than `--argjson`: the input is only known to be digits
          # (step one), and `--argjson 0284` is not valid JSON, which would abort the step over a
          # cosmetically odd but harmless PR number.
          run_id=$(printf '%s' "$runs" | jq -r --arg pr "$PR" \
            '($pr | tonumber) as $n
             | ([.workflow_runs[] | select(any(.pull_requests[]?; .number == $n))]
                | max_by(.run_number) | .id) // empty')

          # `pull_requests` comes back empty on runs GitHub could not associate - classically
          # fork-head runs, which this job already refused above. Rather than fail closed on an
          # API quirk, fall back to the newest run for the SHA and say that is what happened.
          if [ -z "$run_id" ]; then
            run_id=$(printf '%s' "$runs" | jq -r '(.workflow_runs | max_by(.run_number) | .id) // empty')
            if [ -n "$run_id" ]; then
              echo "::warning::No claude-review gate run for $head_sha names PR #$PR." \
                   "Falling back to the newest run for that SHA (run $run_id)."
            fi
          fi

          if [ -z "$run_id" ]; then
            echo "::warning::No claude-review gate run found for head $head_sha - nothing to re-run." \
                 "The gate will re-evaluate on the next push to this PR."
            exit 0
          fi

          echo "Re-running the review gate (run $run_id) for head $head_sha."
          gh run rerun "$run_id" -R "$REPO" || \
            echo "::warning::Could not re-run gate run $run_id; re-run it by hand to clear claude-review."
