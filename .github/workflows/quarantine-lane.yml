# Quarantine lane run - executes the @Quarantined tests on every PR push and after every merge to
# master, the same cadence as any other integration test, just NON-GATING: red inside the run step is
# EXPECTED while owning fix PRs are open (step-level continue-on-error keeps the check green; the
# verdict lives in the step summary), so only the fail-fast rule checks can make the job itself red.
# Per-PR runs give PRE-MERGE attribution - a PR that accidentally fixes or breaks a quarantined test
# learns it before merging; the push-to-master run keeps the canonical master-state record. No cron:
# the signal cannot change without a code change, and both kinds are covered. The seconds-fast
# per-PR rule enforcement is maven.yml's separate "Quarantine Audit" job. Manual: workflow_dispatch.

name: Quarantine Lane

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # sticky lane report comment + merge-blocking unexpected-pass threads

jobs:
  # Quarantine LANE RUN: actually executes the @Quarantined tests - known-failing-on-master tests
  # excluded from the gating suites - so we still see when they start passing (their fixes landed),
  # when they get worse, and their signal stays alive.
  #
  # WHEN IT RUNS: on EVERY PR push, and on every merge to master, plus workflow_dispatch - see the
  # `on:` block above, which is the authority. This comment used to say "runs NIGHTLY against master,
  # running per-PR added ~10min of runner noise" - a description of a superseded design that survived
  # the change to per-PR triggers, and it actively misled a reader into thinking a re-push would not
  # re-assess. It would, and does: each push gets a fresh checkout of the PR head, re-runs the registry
  # and owner-claim checks, and re-executes the lane against that code.
  #
  # Red inside the run step is EXPECTED while the owning fix PR is open; the job itself never goes red
  # for test failures (step-level continue-on-error) - only audit-class errors would, and those live in
  # quarantine-audit. So a GREEN tick here does NOT mean the quarantined tests passed: the verdict is in
  # the step summary and the sticky PR comment, not the check mark.
  test-quarantined:
    name: "tests"  # renders as "Quarantine Lane / tests" - the workflow name carries the identity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      # The scan the two checks below read their file list from, before the checks themselves -
      # bin/AGENTS.md: a self-test runs ahead of the gate it protects, and carries its own negative
      # control. It pins the .claude/.git exclusions that keep a sibling worktree's annotations out
      # of this branch's registry check, which shipped once without a test to hold them.
      - name: Self-test the quarantine scan
        run: bash bin/test-check-quarantine-registry.sh
      # Fail fast on rule violations BEFORE spending a test run - same checks as quarantine-audit,
      # here validating master's state.
      - name: Enforce registry (docs/quarantined-tests.md matches @Quarantined annotations)
        run: bin/check-quarantine-registry.sh
      - name: Verify owner claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/check-quarantine-owners.sh
      - name: Check the lane is not empty
        id: any
        run: |
          source bin/lib/quarantine-common.sh
          if [ -n "$(quarantined_files)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No @Quarantined tests - lane is empty, nothing to run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-java@v5
        if: steps.any.outputs.found == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Restore Maven cache
        if: steps.any.outputs.found == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: setup-java-Linux-x64-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            setup-java-Linux-x64-maven-
      - name: Run quarantined tests (red step here is expected, not a gate)
        id: run
        if: steps.any.outputs.found == 'true'
        continue-on-error: true
        env:
          QUARANTINE_SKIP_CHECKS: "1"  # the fail-fast steps above already ran them as gating checks
        run: bin/quarantined-test.sh -DforkCount=4 -DreuseForks=true
      - name: Report lane outcomes to the PR (sticky comment + merge-blocking threads on unexpected passes)
        if: always() && steps.any.outputs.found == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bin/quarantine-lane-report.sh
      - name: Summarize quarantine lane
        if: steps.any.outputs.found == 'true'
        run: |
          {
            echo "## Quarantine lane"
            if [ "${{ steps.run.outcome }}" = "success" ]; then
              echo "✅ **All quarantined tests PASSED** - their fixes may have landed; check whether the owning PRs have merged and the annotations can be deleted."
            else
              echo "🔴 Quarantined tests still failing - expected while their fix PRs are open."
            fi
            echo ""
            echo "### Audit - every entry needs a diagnosis + an owning fix PR (empty fixedBy = unowned)"
            echo '```'
            { source bin/lib/quarantine-common.sh && grep -rnE --include='*.java' --exclude-dir=target -A 4 "$QUARANTINE_ANNOTATION_ERE" .; } || true
            echo '```'
            echo ""
            echo "### Per-test results"
            echo '```'
            reports=$(find . -path '*/surefire-reports/*.txt' -o -path '*/failsafe-reports/*.txt')
            if [ -n "$reports" ]; then
              grep -h '<<< FAILURE\|<<< ERROR\|Tests run' $reports | sort -u | head -50
            else
              echo "(no reports found)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
