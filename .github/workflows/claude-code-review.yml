name: review gate

# The REVIEW GATE. It does not review anything, and it costs nothing to run - no Claude
# invocation, no JDK, no build. It asserts that a review exists for the CURRENT head of the
# PR, and goes red when one does not.
#
# The reviewer itself is on demand: comment `@claude review this` on the PR and
# .github/workflows/claude.yml runs it. That is a deliberate split. This workflow used to
# invoke `claude-code-action` directly on every `pull_request` event, which meant every push
# spent a full review - overwhelmingly on work that was not ready for one - and coupled
# "get CI feedback" to "spend a review" tightly enough that people batched their pushes to
# avoid it. Splitting them decouples the two: push as often as you like, ask for the review
# when the PR is ready.
#
# The obvious version of that change - just delete the `pull_request` trigger - would have
# been an own goal, because the gate lived INSIDE the reviewer's job. Killing the trigger
# would have killed the guarantee with it, and "nobody remembered to ask for a review" would
# have become silent. That is the failure class documented in
# docs/solutions/workflow-issues/a-check-that-reports-success-without-having-run.md, which
# already lists this workflow twice. Hence: cheap gate always, expensive reviewer on demand.
#
# THE JOB NAME `claude-review` IS AN API. It is a required status check in the master ruleset
# (`gh api repos/astubbs/parallel-consumer/rules/branches/master`), matched by name. Rename the
# job and the ruleset silently stops being satisfied by anything - same convention, and same
# hazard, as the job names in repo-hygiene.yml.
#
# One thing this rewrite quietly fixes: because this file no longer invokes
# `claude-code-action`, the action's workflow-validation guard no longer applies to it. A PR
# editing the gate used to lose its own review (the action refuses to run when its workflow
# file differs from the default branch); from now on only a PR editing claude.yml has that
# problem, and even then only after merge - `issue_comment` events always run the default
# branch's copy of a workflow.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Newest push wins. A superseded run has nothing to say: it would be judging a head that is
# already gone. Keyed on the PR number rather than the ref so it also covers reopened PRs.
concurrency:
  group: claude-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Unchanged from the reviewer this replaces: a bot-raised PR (Dependabot and friends) is
    # not held to the review requirement. Widening that is a separate decision from this one.
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # Two `gh api` calls and a shell script. If it has not finished in five minutes something
    # is wrong, and a wedged required check is worse than a failed one.
    timeout-minutes: 5
    # Read-only, and deliberately narrower than the reviewer job that used to live here: this
    # job posts nothing, so it holds no write scope and no `id-token`.
    #   contents        - checkout, and reading the head commit's date
    #   pull-requests   - reading the PR's comments
    #   checks          - reading when GitHub first raised checks for the head SHA
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Only bin/ is needed. The reviewer wanted full history to diff against the base;
          # the gate does not look at the code at all.
          fetch-depth: 1

      # The gate is the only thing standing between "nobody reviewed this" and a green
      # required check, so it is tested before it is trusted. Seconds, no JDK.
      - name: Self-test the review gate
        run: bash bin/test-check-review-posted.sh

      # Rationale, matching rules, the strict-vs-lenient decision, and what this deliberately
      # does NOT prove: bin/check-review-posted.sh.
      - name: Assert a review exists for this head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Segments the comment stream, and stops a comment that quotes the marker - this
          # repo's own docs do - from opening a comment of its own in it. Per-run, not secret.
          MARKER_TOKEN: ${{ github.run_id }}
        run: |
          # When the commit was made, by the author's clock. Set at commit time, which can be
          # well before the push.
          committed_at=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date')

          # When GitHub first raised checks for this SHA, i.e. effectively when it arrived.
          # Server-side, so it closes the window where somebody commits, asks for a review,
          # and only then pushes. `// empty` because a SHA can legitimately have none yet;
          # the script falls back to the committer date and says so.
          first_seen_at=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-suites" \
            --jq '[.check_suites[].created_at] | min // empty')

          # One marker line per comment, then that comment's body. Keep this marker in step
          # with bin/check-review-posted.sh and bin/test-check-review-posted.sh.
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq '.[] | "<!-- check-review-posted \(env.MARKER_TOKEN) \(.created_at) \(.user.login) -->", (.body // "")' \
            | bash bin/check-review-posted.sh \
                "$MARKER_TOKEN" "$HEAD_SHA" "$committed_at" "$first_seen_at"
