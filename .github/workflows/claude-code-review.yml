name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

# One review per PR at a time, newest wins. Without this the workflow had no concurrency group at
# all (unlike maven.yml / pr-checklist.yml / copyright.yml / the highcpu lane), so a push shortly
# after opening left BOTH runs alive and posted TWO reviews of the same PR - seen on astubbs#107, 23
# seconds apart.
#
# That pattern is not rare, it is what this repo's own rules produce: the changelog gate added in
# astubbs#104 requires the entry to cite the PR number, which does not exist until the PR is opened - so
# opening a PR is routinely followed within seconds by a push to add the reference.
#
# Keyed on the PR number rather than the ref, so it also covers reopened PRs and does not collide
# with anything else keyed on a branch name.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # Bounded because the reviewer may now run test suites (see --allowedTools): a wedged suite
    # must not hold a runner indefinitely. Generous enough for a unit run on a 2-core hosted box.
    timeout-minutes: 30
    permissions:
      contents: read
      # write, not read: the reviewer now creates INLINE review comments for blocking findings (see the
      # blocking-findings instruction in claude_args). The action may well use its own app token - the
      # summary comment already posts under `read` - but a silently-failing inline comment would mean a
      # blocking finding never gates the merge, which is the whole point. Drop back to read if it proves
      # unnecessary.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: the reviewer compares against the PR base, which a depth-1 clone can't reach.
          fetch-depth: 0

      # The gate at the bottom of this job is the only thing standing between "the action reviewed
      # nothing" and a green required check, so it gets tested before it is trusted. Seconds, no JDK.
      - name: Self-test the review gate
        run: bash bin/test-check-review-posted.sh

      # The reviewer is allowed to run the unit/integration suites itself (see --allowedTools below),
      # so the job needs a JDK and a warm Maven cache - otherwise every invocation fails or spends
      # its budget re-downloading the world.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post visible "review in progress" status on the PR (sticky tracking comment) so it's clear a
          # review is running, not just silent until it finishes.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is REQUIRED for the review to be posted: without it the plugin's step 7
          # explicitly stops after printing the summary to the action log ("If --comment argument
          # was NOT provided, stop here. Do not post any GitHub comments.") - which is why this
          # workflow ran green for months while never posting a single review.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Grant the tools the plugin's command + subagents need (mirrors the command's
          # allowed-tools frontmatter). Prompt-mode runs get NO tool grants by default - the
          # earlier runs logged 27 permission denials per review.
          #
          # The test-running grants exist because this workflow fires on `pull_request` open/sync,
          # i.e. BEFORE the CI test jobs have finished - so "just read the CI results" is not
          # available to the reviewer, and without these it can only assert what the author claimed.
          # PR astubbs#100 is the cautionary case: a regression test was named so that surefire never
          # collected it, and the suite was green precisely because the new test never ran. Only
          # actually executing the suite (and checking WHICH tests ran) catches that class of bug.
          #
          # PREFER the repo's own wrappers over a hand-rolled ./mvnw line: the wrappers pin the group
          # exclusions and CI profile, so the reviewer runs what CI runs. ./mvnw is granted as well
          # (see below) for the targeted runs a wrapper cannot express. Chaos is NOT granted - it
          # needs Docker and takes ~2 minutes per scenario arm, far too slow for a per-PR review
          # pass, and it is non-gating anyway.
          #
          # BOTH `bin/foo.sh` and `./bin/foo.sh` are granted for every script. These are PREFIX
          # matches, not globs: `Bash(bin/ci-unit-test.sh:*)` does not match `./bin/ci-unit-test.sh`,
          # so granting only the bare form denied every natural invocation. That is not theoretical -
          # it is why the review on astubbs#108 logged 10 permission denials, gave up before running
          # anything, and still reported success. A grant that cannot match is worse than no grant:
          # it reads as capability the reviewer does not have.
          #
          # Also grants the repo's fast, read-only VERIFICATION scripts (bin/check-*.sh,
          # bin/test-check-copyright-headers.sh, bin/test-check-review-posted.sh,
          # bin/check-shell-sigpipe.sh, bin/todo-index.sh) plus the two gate self-tests under
          # .github/scripts/, so the reviewer can independently re-run what a PR claims
          # rather than inferring it from the diff - e.g. `bin/check-copyright-headers.sh` to
          # confirm a header claim. NOT the quarantine/test RUNNERS (quarantined-test.sh,
          # quarantine-lane-report.sh) - those execute suites, are slow, and test execution is
          # already covered by the ci-*-test.sh wrappers above.
          #
          # Every grant here is a script that EXISTS ON THIS BRANCH. Granting one that only exists on
          # another branch makes the grant inert and the claim false - which is how `bin/todo-index.sh`
          # (added by astubbs#103) briefly ended up listed here. Its grant belongs in astubbs#103, with the script.
          #
          # ./mvnw IS granted, for the job the wrappers cannot do: running ONE test class. Verifying a
          # RED/GREEN claim means reverting the fix and re-running just the new test - a targeted
          # -Dtest=X run, seconds rather than the ~6 minutes of a full suite. Without it the reviewer
          # can only re-run everything, which it will not have time for, so the most valuable check it
          # can make - does this test actually fail without the fix? - was unavailable.
          #
          # The earlier objection stands as GUIDANCE, not a ban: a hand-rolled `-pl parallel-consumer-core
          # test` line skips the -Dexcluded.groups=performance,chaos,quarantined the wrappers hardcode
          # (a past P1 - that exclusion was once a silent no-op, now pinned by
          # QuarantinedAnnotationContractTest, which covers the wrappers but NOT a workflow-embedded
          # command) and drops clean/rerunFailingTestsCount. So: whole suite -> wrapper,
          # every time; ./mvnw only for a scoped -Dtest run, whose result is read as "did THIS test
          # pass", never as "the suite is green". The system prompt below says so explicitly.
          #
          # NOT blanket Bash(*): this job has no fork guard beyond sender.type != Bot (fork PRs are
          # currently protected only by not receiving secrets, so the action fails rather than runs),
          # and it reads attacker-influencable text (diff, PR body, comments), so an enumerable
          # allowlist is the safety margin against injection-into-execution. Keep it a list.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(bin/ci-unit-test.sh:*),Bash(./bin/ci-unit-test.sh:*),Bash(bin/ci-integration-test.sh:*),Bash(./bin/ci-integration-test.sh:*),Bash(bin/check-copyright-headers.sh:*),Bash(./bin/check-copyright-headers.sh:*),Bash(bin/check-shell-sigpipe.sh:*),Bash(./bin/check-shell-sigpipe.sh:*),Bash(bin/test-check-shell-sigpipe.sh:*),Bash(./bin/test-check-shell-sigpipe.sh:*),Bash(bin/test-check-copyright-headers.sh:*),Bash(./bin/test-check-copyright-headers.sh:*),Bash(bin/test-check-review-posted.sh:*),Bash(./bin/test-check-review-posted.sh:*),Bash(bin/check-quarantine-registry.sh:*),Bash(./bin/check-quarantine-registry.sh:*),Bash(bin/check-quarantine-owners.sh:*),Bash(./bin/check-quarantine-owners.sh:*),Bash(bin/todo-index.sh:*),Bash(./bin/todo-index.sh:*),Bash(node .github/scripts/issue-ref-gate.test.js:*),Bash(node .github/scripts/changelog-ref-gate.test.js:*),Bash(./mvnw:*),Bash(mvnw:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You CAN run this repo's tests yourself, and should when the PR adds or changes tests, or when a claim about test results is load-bearing to your review. Use bin/ci-unit-test.sh (fast, no Docker) or bin/ci-integration-test.sh (needs Docker); do NOT run the chaos suite, it is far too slow for a review pass. You can also run the repo's fast verification scripts directly to check a claim rather than trusting the PR body - e.g. bin/check-copyright-headers.sh, bin/check-quarantine-registry.sh - invoke them by their bare path, they are executable. For a SINGLE test class, use ./mvnw directly - e.g. ./mvnw -o -pl parallel-consumer-core -Dtest=SomeTest surefire:test - which takes seconds where a full suite takes minutes. That makes the highest-value check affordable: when a PR claims a test fails without its fix, revert the fix (git stash push the source files), run just that test, and confirm it actually goes RED - a test that passes either way proves nothing, and this is the single most common defect in a regression-test PR. Two rules for scoped runs: never report a targeted -Dtest result as though the suite were green (it skips the -Dexcluded.groups the wrappers pin, and covers one class), and always restore anything you stashed. For whole-suite evidence, use the wrappers, not a hand-rolled ./mvnw line. This workflow triggers BEFORE the CI test jobs finish, so their results are NOT available to you - if you want test evidence, execute it rather than deferring to CI or to the author's summary. When a PR adds a test, verify the suite ACTUALLY COLLECTED it (surefire only picks up *Test.java, Test*.java, *Tests.java, *TestCase.java - a test named otherwise silently never runs) rather than trusting a green total. If you run out of time, or a suite fails for environmental reasons, say so explicitly instead of implying you verified it. REVIEW THE PR TITLE AND DESCRIPTION AS PART OF THE DIFF, not as decoration. They are what a future reader gets instead of the diff, and on a squash merge the title BECOMES the commit title, so an inaccurate one is permanent. Check three things. (1) COMPLETENESS: does the description cover every substantive change in the diff? Descriptions are written early and drift as commits land, so a whole fix or workstream missing from an otherwise good description is the common failure - call out what is in the diff but not described. (2) ACCURACY: do specifics match reality - counts, file and test names, flags, numbers of things granted or changed, and any claimed verification? Re-derive them from the diff rather than trusting the prose; a stale "622 tests" or "two scripts" when the diff says otherwise is a real defect. Treat a checklist item marked N/A as a claim to verify like any other, especially "docs updated - N/A" when the diff changes docs. (3) TERMINOLOGY: does it use words the codebase uses, and does any word mislead? Flag a term that means something specific in this repo being used loosely - for example calling cross-test state contamination a "leak" in a repo where "leak" means a memory leak. Report these as normal findings, non-blocking unless the description actively misrepresents what the code does. BLOCKING FINDINGS MUST BE INLINE REVIEW COMMENTS. This repo sets required_review_thread_resolution, so an unresolved review thread is the ONLY thing that actually gates a merge - a finding written only in your summary comment can be, and will be, merged straight past. So: if you find something that should block the merge (a correctness bug, data loss or corruption, a security hole, a broken public contract, or a test that cannot do what it claims), raise it with mcp__github_inline_comment__create_inline_comment on the offending line, one thread per finding, each stating plainly what breaks and what would fix it. Keep the summary comment for everything else - context, praise, nits and non-blocking observations - and do NOT raise those inline, or routine notes become merge gates and the signal is lost. If you are unsure whether a finding is blocking, put it in the summary and say why you were unsure, rather than blocking on a maybe."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # A green `claude-review` must mean "this PR was reviewed", not "the job finished". The action
      # above exits 0 in several situations where it reviews nothing, and this job then reports
      # success indistinguishably from "reviewed, no findings". That is not hypothetical here three
      # times over:
      #
      #   1. The `--comment` note above: the plugin printed its review to the log and posted nothing.
      #   2. The action's workflow-validation guard, which skips it whenever THIS FILE differs from
      #      the default branch, i.e. on every PR that edits the reviewer. PR astubbs#124 hit it and
      #      sat mergeable with a green check and no review of any kind.
      #   3. The reviewer announced it would review in the background, and then the job ended. On PR
      #      astubbs#271 the sticky comment said "Claude finished @astubbs's task in 4m 10s" over a
      #      task list with two boxes still unticked and a closing line promising findings "once
      #      complete"; no review was ever submitted. The same shape hit astubbs#266 three times.
      #      `track_progress: true` is what makes this the DEFAULT path rather than an edge case -
      #      the tracking comment carries the run URL and is posted at the START of the run, so a
      #      gate that only asks "did a comment cite this run" is satisfied before any review begins.
      #      The gate now also requires that comment to have no unticked task-list box left in it,
      #      which is the reviewer's own account of whether it finished.
      #
      # The `--jq` below emits a boundary line between comment bodies. Without it the gate receives
      # every comment on the PR as one undivided stream and cannot tell whose unticked box it is
      # looking at - which would fail runs that genuinely reviewed, as on astubbs#257 where one run
      # left a stale tracker behind alongside a full review. Keep the marker identical to
      # COMMENT_BOUNDARY in bin/check-review-posted.sh.
      #
      # Runs on failure too (not just success): a crashed or timed-out action must not leave the
      # unreviewed state unreported either. Skipped on cancellation, where the concurrency group has
      # already superseded this run with a newer one.
      #
      # Rationale, matching rules, and what this deliberately does NOT prove: bin/check-review-posted.sh.
      - name: Assert a review was actually posted
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not inline ${{ }} in the script body - the outcome is a fixed enum, but the
          # habit is what keeps the next value someone adds here out of the shell.
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              --paginate --jq '.[] | .body, "<!-- check-review-posted: comment boundary -->"' \
            | bash bin/check-review-posted.sh "${{ github.run_id }}" "$REVIEW_OUTCOME"

