name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    if: github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    # Bounded because the reviewer may now run test suites (see --allowedTools): a wedged suite
    # must not hold a runner indefinitely. Generous enough for a unit run on a 2-core hosted box.
    timeout-minutes: 30
    permissions:
      contents: read
      # write, not read: the reviewer now creates INLINE review comments for blocking findings (see the
      # blocking-findings instruction in claude_args). The action may well use its own app token - the
      # summary comment already posts under `read` - but a silently-failing inline comment would mean a
      # blocking finding never gates the merge, which is the whole point. Drop back to read if it proves
      # unnecessary.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: the reviewer compares against the PR base, which a depth-1 clone can't reach.
          fetch-depth: 0

      # The reviewer is allowed to run the unit/integration suites itself (see --allowedTools below),
      # so the job needs a JDK and a warm Maven cache - otherwise every invocation fails or spends
      # its budget re-downloading the world.
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Post visible "review in progress" status on the PR (sticky tracking comment) so it's clear a
          # review is running, not just silent until it finishes.
          track_progress: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is REQUIRED for the review to be posted: without it the plugin's step 7
          # explicitly stops after printing the summary to the action log ("If --comment argument
          # was NOT provided, stop here. Do not post any GitHub comments.") - which is why this
          # workflow ran green for months while never posting a single review.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # Grant the tools the plugin's command + subagents need (mirrors the command's
          # allowed-tools frontmatter). Prompt-mode runs get NO tool grants by default - the
          # earlier runs logged 27 permission denials per review.
          #
          # The test-running grants exist because this workflow fires on `pull_request` open/sync,
          # i.e. BEFORE the CI test jobs have finished - so "just read the CI results" is not
          # available to the reviewer, and without these it can only assert what the author claimed.
          # PR #100 is the cautionary case: a regression test was named so that surefire never
          # collected it, and the suite was green precisely because the new test never ran. Only
          # actually executing the suite (and checking WHICH tests ran) catches that class of bug.
          #
          # Deliberately the repo's own wrappers rather than blanket Bash(./mvnw:*): the wrappers
          # pin the group exclusions and CI profile, so the reviewer runs what CI runs. Chaos is
          # NOT granted - it needs Docker and takes ~2 minutes per scenario arm, far too slow for a
          # per-PR review pass, and it is non-gating anyway.
          #
          # Also grants the repo's fast, read-only VERIFICATION scripts (bin/check-*.sh,
          # bin/test-check-copyright-headers.sh) so the reviewer can independently re-run what a PR
          # claims rather than inferring it from the diff - e.g. `bin/check-copyright-headers.sh` to
          # confirm a header claim. NOT the quarantine/test RUNNERS (quarantined-test.sh,
          # quarantine-lane-report.sh) - those execute suites, are slow, and test execution is
          # already covered by the ci-*-test.sh wrappers above.
          #
          # Every grant here is a script that EXISTS ON THIS BRANCH. Granting one that only exists on
          # another branch makes the grant inert and the claim false - which is how `bin/todo-index.sh`
          # (added by #103) briefly ended up listed here. Its grant belongs in #103, with the script.
          #
          # Deliberately NO bespoke `./mvnw ...` grant either. An earlier revision granted a hand-rolled
          # `-pl parallel-consumer-core test` invocation, which contradicted the paragraph above: it
          # skipped the -Dexcluded.groups=performance,chaos,quarantined that the wrappers hardcode
          # (a past P1 - the exclusion was once a silent no-op for unit tests, now pinned by
          # QuarantinedAnnotationContractTest, which covers the wrappers but NOT a workflow-embedded
          # command), was core-only, and dropped clean/-Dlicense.skip/rerunFailingTestsCount. If the
          # reviewer needs to run tests, it runs what CI runs.
          #
          # NOT blanket Bash(*): this job has no fork guard beyond sender.type != Bot (fork PRs are
          # currently protected only by not receiving secrets, so the action fails rather than runs),
          # and it reads attacker-influencable text (diff, PR body, comments), so an enumerable
          # allowlist is the safety margin against injection-into-execution. Keep it a list.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(bin/ci-unit-test.sh:*),Bash(bin/ci-integration-test.sh:*),Bash(bin/check-copyright-headers.sh:*),Bash(bin/test-check-copyright-headers.sh:*),Bash(bin/check-quarantine-registry.sh:*),Bash(bin/check-quarantine-owners.sh:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "You CAN run this repo's tests yourself, and should when the PR adds or changes tests, or when a claim about test results is load-bearing to your review. Use bin/ci-unit-test.sh (fast, no Docker) or bin/ci-integration-test.sh (needs Docker); do NOT run the chaos suite, it is far too slow for a review pass. You can also run the repo's fast verification scripts directly to check a claim rather than trusting the PR body - e.g. bin/check-copyright-headers.sh, bin/check-quarantine-registry.sh - invoke them by their bare path, they are executable. This workflow triggers BEFORE the CI test jobs finish, so their results are NOT available to you - if you want test evidence, execute it rather than deferring to CI or to the author's summary. When a PR adds a test, verify the suite ACTUALLY COLLECTED it (surefire only picks up *Test.java, Test*.java, *Tests.java, *TestCase.java - a test named otherwise silently never runs) rather than trusting a green total. If you run out of time, or a suite fails for environmental reasons, say so explicitly instead of implying you verified it. REVIEW THE PR TITLE AND DESCRIPTION AS PART OF THE DIFF, not as decoration. They are what a future reader gets instead of the diff, and on a squash merge the title BECOMES the commit title, so an inaccurate one is permanent. Check three things. (1) COMPLETENESS: does the description cover every substantive change in the diff? Descriptions are written early and drift as commits land, so a whole fix or workstream missing from an otherwise good description is the common failure - call out what is in the diff but not described. (2) ACCURACY: do specifics match reality - counts, file and test names, flags, numbers of things granted or changed, and any claimed verification? Re-derive them from the diff rather than trusting the prose; a stale "622 tests" or "two scripts" when the diff says otherwise is a real defect. Treat a checklist item marked N/A as a claim to verify like any other, especially "docs updated - N/A" when the diff changes docs. (3) TERMINOLOGY: does it use words the codebase uses, and does any word mislead? Flag a term that means something specific in this repo being used loosely - for example calling cross-test state contamination a "leak" in a repo where "leak" means a memory leak. Report these as normal findings, non-blocking unless the description actively misrepresents what the code does. BLOCKING FINDINGS MUST BE INLINE REVIEW COMMENTS. This repo sets required_review_thread_resolution, so an unresolved review thread is the ONLY thing that actually gates a merge - a finding written only in your summary comment can be, and will be, merged straight past. So: if you find something that should block the merge (a correctness bug, data loss or corruption, a security hole, a broken public contract, or a test that cannot do what it claims), raise it with mcp__github_inline_comment__create_inline_comment on the offending line, one thread per finding, each stating plainly what breaks and what would fix it. Keep the summary comment for everything else - context, praise, nits and non-blocking observations - and do NOT raise those inline, or routine notes become merge gates and the signal is lost. If you are unsure whether a finding is blocking, put it in the summary and say why you were unsure, rather than blocking on a maybe."
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

