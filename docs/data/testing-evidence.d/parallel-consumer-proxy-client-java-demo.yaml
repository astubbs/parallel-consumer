schema_version: 1
kind: testing-evidence
module_evidence:
  - artifact: parallel-consumer-proxy-client-java-demo
    deferred:
      reason: >-
        A demo is not a product surface, so there is no support claim here to evidence - but it is tested, and how it is tested is worth stating so nobody assumes otherwise. Its unit lane covers the flag and environment precedence ten languages copy, the arithmetic that produces every published number, the guard that makes an arm fail rather than report a partial count, and a parity check that the hand-written control arm asks the sidecar for the same session the client library asks for - the defect class that has twice made an arm measure something other than what it claimed. Its integration lane runs the whole demo against a real broker with real spawned sidecar processes, which is what catches the failure this branch family has actually had four times: code that does not run at all. What that suite does NOT evidence is the client library's semantics; those are asserted by the conformance suites recorded against parallel-consumer-proxy-client-java-direct and -grpc, and counting them twice here would overstate both.
      lifted_by: >-
        Nothing is expected to lift it; the demo has no published surface of its own to evidence.
