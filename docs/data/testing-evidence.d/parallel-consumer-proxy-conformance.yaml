schema_version: 1
kind: testing-evidence
module_evidence:
  - id: proxy-conformance-suite
    artifact: parallel-consumer-proxy-conformance
    coverage: >-
      The shared cross-language conformance suite itself, and its own negative controls. It drives a language's conformance runner - a small program with an identical command-line contract in every language - against an engine hosted in the suite's own JVM over mock Kafka clients, with no broker and no Docker, and asserts engine-side truth the client cannot see. Four scenarios are wired and pass for TEN BINDINGS - the engine itself driven by a plain Java function; the three JVM clients, of which java-direct and java-grpc are driven as client OBJECTS in the suite's own JVM and Kotlin through a spawned runner; and the Go, Python, TypeScript, Rust, Ruby and .NET clients through their runners: a processed record advances the committed offset; an unreported record holds the commit back; a failed record is redelivered with attempt 2 and the previous reason verbatim; and a held record admits a concurrent dispatch on another key while fencing its own. Every one was proven able to fail, by making the runner do the wrong thing and watching the suite name it - for the three JVM bindings by four separate sabotages, one per scenario, each turning exactly that scenario's row red for every binding and leaving the other twelve rows green: a success reported as a failure, silence reported as a success, a failure reason that is not the contract's literal, and a mutex around the whole processor. A JVM CLIENT IS DRIVEN AS AN OBJECT RATHER THAN AS A CHILD PROCESS, because neither Java transport has a sidecar spawn to exercise and the suite can hold the very object an application holds; the prescription is not relaxed with it, since the in-process bindings and the control arm execute one shared implementation of the runner contract, so no assertion can be written to suit them. Kotlin does own a spawn, so its runner is a real child process and the spawn path stays covered. THE ENGINE IS ONE OF THE BINDINGS, and it is the control arm: a scenario red against Parallel Consumer driven by a plain Java function is a wrong scenario rather than a broken client, and it runs in every selection so that answer arrives in the same job as the client that went red. It earned that on the day it was written, by catching a binding that read a failure reason off the wrapper exception core records rather than the cause the engine's own codec unwraps. The suite's own machinery carries four controls: a runner that is absent fails rather than skipping, a runner that crashes fails with its exit status and output, two languages driven at once are judged separately with their overlap measured rather than assumed, and a language selector naming something unregistered fails rather than selecting nothing - the shape that would let a CI row report green having evaluated no scenarios at all.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/README.md
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/CoreBinding.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/SelectorMatchingNothingFailsTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/ConformanceScenarios.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-go/cmd/conformance-runner/main.go
    limitation: >-
      NOT YET EVERY CLIENT. The three JVM clients joined the suite in this change; the clients still outside it are C++, Swift and Scala, whose own waves own that gap, and until they are in it their conformance is asserted only by their own suites. Four scenarios of the eleven named in the client-authoring guide, because the harness serves only those four: the liveness lease, the manifest reconnect, worker death, terminal outcomes and the shutdown drain are un-negotiated rather than passing. The mock lane only: committed offsets are read from a mock consumer's commit history, not from a broker through the Admin API. And the suite is deliberately bounded to the client/sidecar contract - it does not re-test engine internals, which are covered far more cheaply from inside the JVM.
