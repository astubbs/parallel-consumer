module_evidence:
  - id: proxy-conformance-suite
    artifact: parallel-consumer-proxy-conformance
    coverage: >-
      The shared cross-language conformance suite itself, and its own negative controls. It drives a language's conformance runner - a small program with an identical command-line contract in every language - against an engine hosted in the suite's own JVM over mock Kafka clients, with no broker and no Docker, and asserts engine-side truth the client cannot see. Five scenarios are wired and pass for THIRTEEN BINDINGS - the engine itself driven by a plain Java function; the four JVM clients, of which java-direct and java-grpc are driven as client OBJECTS in the suite's own JVM and Kotlin and Scala through spawned runners; and the Go, Python, TypeScript, Rust, Ruby, .NET, C++ and Swift clients through their runners: a processed record advances the committed offset; an unreported record holds the commit back; a failed record is redelivered with attempt 2 and the previous reason verbatim; a held record admits a concurrent dispatch on another key while fencing its own; and THE IN-FLIGHT CEILING BOUNDS UNRESOLVED RECORDS, which is the only scenario that constrains how many records may be outstanding at once. Every one was proven able to fail, by making the runner do the wrong thing and watching the suite name it - for the three JVM bindings by four separate sabotages, one per scenario, each turning exactly that scenario's row red for every binding and leaving the other rows green: a success reported as a failure, silence reported as a success, a failure reason that is not the contract's literal, and a mutex around the whole processor. A JVM CLIENT IS DRIVEN AS AN OBJECT RATHER THAN AS A CHILD PROCESS, because neither Java transport has a sidecar spawn to exercise and the suite can hold the very object an application holds; the prescription is not relaxed with it, since the in-process bindings and the control arm execute one shared implementation of the runner contract, so no assertion can be written to suit them. Kotlin does own a spawn, so its runner is a real child process and the spawn path stays covered. THE ENGINE IS ONE OF THE BINDINGS, and it is the control arm: a scenario red against Parallel Consumer driven by a plain Java function is a wrong scenario rather than a broken client, and it runs in every selection so that answer arrives in the same job as the client that went red. It earned that on the day it was written, by catching a binding that read a failure reason off the wrapper exception core records rather than the cause the engine's own codec unwraps. THE CEILING SCENARIO IS THE FIRST WHOSE CEILING IS SMALLER THAN ITS OWN RECORD COUNT, and it exists because every client that went wrong in this fan-out went wrong at the same place: max_concurrency bounds records dispatched and not yet reported - queued PLUS executing - and three of the first five clients bounded their queue instead, which was found by reading them side by side rather than by any test. Six records on six DISTINCT keys against a ceiling of two, so key ordering is not what limits concurrency; the prescribed hold-until-ceiling-full behaviour reports nothing until the ceiling's worth of records are inside the user function at once and then keeps the full group still for a fixed 250ms settle, and the suite reads the peak from the ORDER of the runner's dispatch and settled lines rather than from any clock. Both halves of the assertion are load-bearing: at most the ceiling is the product's claim, and every record eventually delivered and committed is what stops a client satisfying it by never asking for work. Written as one equality - peak EQUALS ceiling - because filling the group guarantees the ceiling is reached, so anything else is the client holding a slot it should have freed or freeing one it should still have held. PROVEN ABLE TO FAIL IN TWO LANGUAGES, one on the JVM and one not: Go and Kotlin were each made to declare double the ceiling the scenario prescribed, and the suite read a peak of four against a bound of two and reddened that row alone, leaving the other four scenarios green in both. The control arm was sabotaged the same way and failed the same way, which is what says the scenario is a claim about the product rather than about a client. WHAT IT CANNOT SEE, stated so a green run is not over-read: while the proxy is correct it never over-dispatches, so a client bounding its queue rather than its unresolved records is never offered the record that would expose it - that stays a matter for each client's own tests. What this catches is the consequence reaching the engine: a ceiling the client mis-declares, an executor pool wider than it, or a record resolved before its function returned. The suite's own machinery carries four controls: a runner that is absent fails rather than skipping, a runner that crashes fails with its exit status and output, two languages driven at once are judged separately with their overlap measured rather than assumed, and a language selector naming something unregistered fails rather than selecting nothing - the shape that would let a CI row report green having evaluated no scenarios at all.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/README.md
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/CoreBinding.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/SelectorMatchingNothingFailsTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/ConformanceScenarios.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/TranscriptOverlapTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-go/cmd/conformance-runner/main.go
    limitation: >-
      Five scenarios of the twelve named in the client-authoring guide, because the harness serves only those five: the liveness lease, the manifest reconnect, worker death, terminal outcomes and the shutdown drain are un-negotiated rather than passing. The mock lane only: committed offsets are read from a mock consumer's commit history, not from a broker through the Admin API. And the suite is deliberately bounded to the client/sidecar contract - it does not re-test engine internals, which are covered far more cheaply from inside the JVM.
