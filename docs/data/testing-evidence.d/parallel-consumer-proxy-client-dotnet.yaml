# One module, one file, one owner: bin/check-docs-data.sh merges this fragment into the
# testing-evidence corpus, and only the .NET client wave ever edits it.

schema_version: 1
kind: testing-evidence
module_evidence:
  - id: proxy-client-dotnet
    artifact: parallel-consumer-proxy-client-dotnet
    coverage: >-
      One conformance scenario, a-processed-record-advances-the-committed-offset, run end to end
      over real gRPC against the test-mode sidecar: the sidecar is spawned as a child process, its
      port read from the lifecycle channel, the fresh-session handshake completed, a dispatch wave
      queued and handed to a task executor, the user function run, the outcome reported with the
      token echoed verbatim, and the session closed by half-close and the lifecycle pipe. The
      assertion that it can fail was established by a negative control - returning Outcome.Fail from
      the user function instead of succeeding produced two redeliveries with the attempt count
      incremented and the failure reason verbatim, and the test went red. The module's lint is the
      SDK's own Roslyn analyzers at latest-recommended with warnings as errors, running on every
      local build; that it can fail was established the same way, by deliberately introducing a
      possibly-null dereference (CS8602) and a culture-dependent string comparison (CA1310) and
      watching the build go red.
      Beside that, and not replacing it, .NET is wired into the shared cross-language conformance
      suite: a conformance runner at tests/ConformanceRunner implements the contract every language
      implements, and the suite drives it through all four scenarios the harness serves - the
      processed record, the unreported record, the failure-and-redelivery history, and a held record
      admitting a concurrent delivery on another key - asserting engine state this client cannot
      see. Each of the four was proven able to fail by sabotaging the runner, including the one
      sabotage that works on the ordering scenario: a semaphore around the whole processor, which
      deadlocks and exits 1.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-dotnet/tests/ConformanceRunner/Program.cs
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-dotnet/tests/Bz.Stub.ParallelConsumer.Proxy.Client.Tests/SessionTests.cs
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-dotnet/Directory.Build.props
    limitation: >-
      One scenario of eleven, and the harness negotiates only the dispatch capability, so every
      liveness, reconnect, worker-death, terminal and drain duty is untested because it is
      un-negotiated rather than because it passed. Subscription is not a live variable either: the
      mock harness seeds its records regardless of the topic a client subscribes to, so a
      wrong-topic run still passes and cannot be used as a control. This module's own tests exercise the queue at a
      depth of one record; the shared conformance suite reaches three with one held, but FIFO
      hand-out with FEWER executors than records and the overflow protocol violation still have no
      test, because every conformance scenario sizes the ceiling to its own shape.
