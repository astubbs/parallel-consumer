schema_version: 1
kind: testing-evidence
module_evidence:
  - id: proxy-client-scala-alpha
    artifact: parallel-consumer-proxy-client-scala
    coverage: >-
      Two end-to-end tests spawn the real test-mode sidecar as a child process and drive it over the
      real gRPC wire - launch, port line, loopback connect, handshake, dispatch, the user's function,
      the report with the delivery token echoed, then a clean client-initiated shutdown and reap. The
      first runs the shared scenario a-processed-record-advances-the-committed-offset and asserts the
      negotiated capability set came back as dispatch alone, the delivery state the specification
      promises, and that the session's future completes on close. The second runs
      a-failed-record-is-redelivered-with-its-failure-history and is the one that proves a report
      actually reached the engine: the redelivery arrives with attempt 2 and the prescribed reason
      byte for byte. Unit tests cover the single translation this module performs in both directions
      - the options, the collapse of the two failure fields into one Option, absent key or value as
      None, the outcome arms - the rule that a client never invents a verdict (a record handed out
      after hand-out stopped, and a future that never completes, both reported as nothing, against
      three controls that do reach a verdict), and the credential-hygiene rule that no options or
      record rendering prints a payload or a property map. Static analysis is the Scala compiler with
      -Xlint -Wunused -Werror, the flags the CI row runs, proven able to fail against an injected
      unused private method and an unused import.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-scala/src/test/scala/bz/stub/parallelconsumer/client/scaladsl/OneRecordThroughTheSidecarTest.scala
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-scala/src/test/scala/bz/stub/parallelconsumer/client/scaladsl/NoVerdictIsInventedTest.scala
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-scala/src/test/scala/bz/stub/parallelconsumer/client/scaladsl/BridgeTest.scala
    limitation: >-
      First wave only. The suite exercises a handful of records against a mock-Kafka sidecar: there
      is no broker test, no multi-record concurrency or FIFO hand-out test, no overflow negative
      control, and nothing covering connection loss, lease expiry, worker death, terminal outcomes or
      the Shutdown drain - because none of those paths is implemented here, and the ones that are
      belong to the shared gRPC transport and are tested there. The cross-language conformance runner at
      scripts/conformance-runner is registered in the shared suite and answers all four scenarios
      alongside every other binding, so this client's behaviour at the protocol boundary is asserted
      by the same definitions and the same assertions as everyone else's. What it has NOT had is its
      own red-then-green pass through that suite: the wave that wrote it proved the runner by hand
      against the test-mode sidecar - all four behaviour tokens, all three exit statuses - and
      deliberately left the registry entry to be landed separately, because three agents were editing
      that file and a lost update there is silent. So the scenarios are green here and were proven
      able to fail for other bindings, but not sabotaged against this one.
