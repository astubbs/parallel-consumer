# One module, one file, one owner: bin/check-docs-data.sh merges this fragment into the
# testing-evidence corpus, and only the proxy work ever edits it.

schema_version: 1
kind: testing-evidence
module_evidence:
  - id: proxy-engine
    artifact: parallel-consumer-proxy
    coverage: >-
      118 tests over the engine seam, the transport and the configuration handler. The engine's
      hardest behaviour is covered by its own classes rather than inferred from the clients:
      LivenessLeaseTest and ProxyProcessorLivenessTest for the session lease and its expiry,
      ReconnectWindowTest for the three-state window that holds a dropped session's records rather
      than returning them, ManifestReconcilerTest for what a reconnecting client reclaims, and
      ProxyProcessorProduceTest for the produce path.
      This module also supplies the harness the whole cross-language suite runs on. ConformanceHarness
      drives three lanes - the engine held in-process behind a plain Java function, the same fixture
      reached by spawning the test-mode sidecar and speaking the production gRPC protocol at it, and
      the mock Kafka clients lent to a client that brings its own engine - so a foreign client
      exercises the real transport rather than a test-only bridge. All thirteen conformance
      bindings, and therefore every language, assert against this module's fixture.
      Behaviour is established able to fail rather than assumed: each conformance scenario was
      proven by a mutation that turns exactly its own row red while the others stay green, and the
      thread confinement in the engine was proven by un-confining one field at a time.
    inspect:
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/harness/ConformanceHarness.java
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/engine/ProxyProcessorLivenessTest.java
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/engine/ReconnectWindowTest.java
    limitation: >-
      Exactly one test class reaches a real Kafka broker: SidecarLifecycleIT, in this module's
      src/test-integration, which extends BrokerIntegrationTest and so is covered by the ambient-probe
      machinery. It spawns the sidecar as a genuine operating-system process against a Testcontainers
      broker and drives the spawning contract end to end - a real ephemeral port, a real gRPC session,
      Kafka clients built from the properties that travelled the wire, one record produced to the
      broker and dispatched to a foreign client, and a clean exit 0 once the parent's pipe closes -
      alongside a second test that two spawned sidecars bind different ports. Everything else in the
      module reaches Kafka through LongPollingMockConsumer. So real rebalance, real partition
      revocation and real broker latency remain unexercised, and no commit round-trip is asserted:
      the success Report is sent, but what the broker then holds is never read back.
      The production entry point is Main, in src/main, and it hosts a real engine - ConfigureHandler
      builds a ProxyProcessor when a client's Configure arrives, and shutdown drains the records that
      client is still holding. It refuses arguments, binds an ephemeral loopback port, announces it as
      the first line of stdout, dies with its parent on EOF of the inherited pipe with
      ParentDeathWatchdog's pid poll as the backstop (KTD19), and reports EXIT_USAGE,
      EXIT_DRAIN_TIMED_OUT and EXIT_BIND_FAILED. That is U10, landed. What is still missing is
      packaging: the pom declares no mainClass, so nothing here produces a runnable artifact and every
      caller - SidecarLifecycleIT included - spawns Main by classpath and class name. Two further
      mains live in src/test rather than being shipped: NoEngineMain, the engine-less build the
      cross-language handshake tests spawn, and TestModeMain, which boots the engine on mock Kafka
      clients.
      Exactly-once is unreachable through this module: ExternalEngine throws on transactional commit
      mode, which is why the interaction model keeps produce on the engine side.
      The liveness lease, the reconnect window and manifest reconciliation are proven engine-side
      only. No client is asked to demonstrate any of them, so a client that never heartbeats would
      pass every shared scenario today.
