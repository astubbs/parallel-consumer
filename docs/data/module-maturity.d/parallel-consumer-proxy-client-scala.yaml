# One module, one file, one owner: bin/check-docs-data.sh merges this fragment into the
# module-maturity corpus, and only the Scala client wave ever edits it.

schema_version: 1
kind: module-maturity
modules:
  - artifact: parallel-consumer-proxy-client-scala
    maturity: alpha
    reliability_confidence: >-
      No reliability claim. This wave carries records end to end over the real protocol and nothing
      beyond it: the liveness lease, the manifest reconnect, worker-death reporting and terminal
      outcomes are later waves, so a record whose session is interrupted has no recovery path yet.
      The client declares only the dispatch capability, so the proxy asks nothing of it that it does
      not do. Because it wraps the shared JVM gRPC transport rather than implementing its own
      session, its reliability is that transport's - a session defect fixed there is fixed here with
      no work in this module.
    api_expectation: >-
      Experimental and expected to change. The surface mirrors the shared client API every language
      implements, rendered in Scala - Option where the reference uses Optional, a sealed Outcome,
      case classes with default arguments instead of a builder, and a user function returning
      scala.concurrent.Future - and changes to that shared shape land here. Scala 2.13, chosen
      because Kafka-adjacent Scala still overwhelmingly runs it and a 2.13 artefact is usable from
      Scala 3 while the reverse is not; the pom carries the argument.
    support_posture: >-
      Not published to any package index and not supported for production use; built from a
      checkout. The stable modules' release gate says nothing about this module.
    evidence_id: proxy-client-scala-alpha
    use_this_if: >-
      You want ordered concurrent Kafka consumption from Scala with a Future-based surface and no
      effect-system dependency, and you are willing to track an experimental client through its
      remaining waves.
    opt_in: >-
      Nothing reaches it unless an application constructs it. It is a JVM module with no foreign
      toolchain, so an ordinary reactor build compiles it and runs its unit tests; the end-to-end
      tests against the sidecar run only under -Dpc.foreignClients, which is where their harness
      classpath comes from.
    isolated_from_stable_modules: true
    tracking: >-
      astubbs#242 - the language-proxy plan; this row is updated by each Scala wave as its scope
      grows.
