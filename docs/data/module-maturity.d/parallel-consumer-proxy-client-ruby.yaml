# One module, one file, one owner: bin/check-docs-data.sh merges this fragment into the
# module-maturity corpus, and only the Ruby client wave ever edits it.

schema_version: 1
kind: module-maturity
modules:
  - artifact: parallel-consumer-proxy-client-ruby
    maturity: alpha
    package_ecosystem: rubygems
    package_coordinate: >-
      Not published. Installed from a checkout, by pointing a Gemfile at
      parallel-consumer-proxy-clients/parallel-consumer-proxy-client-ruby; the RubyGems name is claimed
      but no version is published.
    reliability_confidence: >-
      Wave one only: one record carried end to end over the real wire against the test-mode sidecar. The
      connect, configure, dispatch, invoke, report and clean-shutdown path works; the liveness lease,
      heartbeats, the manifest reconnect, worker-death reporting, terminal outcomes and the shutdown
      drain are not implemented at all, so nothing about a session that loses its connection or outlives
      a lease has been exercised.
    api_expectation: >-
      PROVISIONAL. The surface (open/poll/wait/close, a block returning an Outcome or raising) has not
      yet had its idiomatic-Ruby review, and the reference wrapper surface it mirrors may itself move
      when the fan-out's wave syncs resolve divergences. Two shape decisions the specification does not
      settle - poll being non-blocking, and executors being threads rather than processes - are argued
      in docs/inflight/clients/ruby.md and could be reopened by a sync.
    support_posture: >-
      Not supported for external use. It exists to falsify the frozen protocol documents - whether an
      author with no access to the proxy's Java can build a working client from them - and the answer to
      that, in docs/inflight/clients/ruby.md, is its real output.
    evidence_id: proxy-client-ruby
    tracking: astubbs#242
    opt_in: >-
      Nothing reaches it unless an application constructs it. Its Maven module runs no Ruby at all
      unless -Dpc.foreignClients is passed, so the reactor build is unaffected by its presence.
    isolated_from_stable_modules: true
    use_this_if: >-
      You are working on the language-proxy fan-out itself and want the smallest complete example of a
      thread-based foreign-language client. Nobody should consume it from an application yet.
