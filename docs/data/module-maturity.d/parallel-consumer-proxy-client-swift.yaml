# One module, one file, one owner: bin/check-docs-data.sh merges this fragment into the
# module-maturity corpus, and only the Swift client wave ever edits it.

schema_version: 1
kind: module-maturity
modules:
  - artifact: parallel-consumer-proxy-client-swift
    maturity: alpha
    minimum_java: 17
    package_ecosystem: none
    package_coordinate: not published - built from source in a container
    reliability_confidence: >-
      Wave one only: records carried end to end over the real wire against the test-mode sidecar, in
      all four conformance scenarios the harness serves today. The connect, configure, dispatch,
      invoke, report and clean-shutdown path works, including concurrent execution across shards
      while one record is held. The liveness lease, heartbeats, the manifest reconnect, worker-death
      reporting, terminal outcomes and the proxy-initiated shutdown drain are not implemented at all,
      so nothing about a session that loses its connection or outlives a lease has been exercised -
      and they are not declared in the handshake either, so the proxy never sends them.
    api_expectation: >-
      PROVISIONAL. The surface (ParallelConsumerClient.connect / poll / sessionEnd / shutdown, a
      processor returning Outcome or throwing) has not had its idiomatic-Swift review, and the
      reference wrapper surface it mirrors may itself move when the fan-out's wave syncs resolve
      divergences. One choice is already known to be a divergence rather than a settled convention:
      the authoring guide's logging table (its 10.2) has no Swift row, so the swift-log Logger
      defaulted to SwiftLogNoOpLogHandler is this wave's answer and is owed back to the guide.
    support_posture: >-
      Not supported for external use, and published nowhere: there is no Swift package registry entry
      here, only a SwiftPM package that builds inside its own image. It exists to falsify the frozen
      protocol documents - whether an author with no access to the proxy's Java can build a working
      client from them - and the answer to that, in docs/inflight/clients/swift.md, is its real
      output.
    evidence_id: proxy-client-swift
    tracking: astubbs#242
    use_this_if: >-
      You are working on the language-proxy fan-out itself and want to see the surface in a language
      whose concurrency model is structured and compiler-checked rather than thread-based - or you
      want the worked example of a client whose whole toolchain lives in a container. Nobody should
      consume it from an application yet.
