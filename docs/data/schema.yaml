schema_version: 1
kind: documentation-data-schema
consumer_contract:
  source_of_truth: These files are hand-maintained release-documentation data, not site-renderer output.
  renderer_rule: A renderer may choose presentation but must not strengthen a claim or omit a stated boundary.
  release_rule: Release-scoped claims are conditional until the release-validation data says their evidence holds.
kinds:
  module-maturity:
    required:
      - release
      - axes
      - release_validation
      - modules
    module_required:
      - artifact
      - maturity
      - reliability_confidence
      - api_expectation
      - evidence_id
      - use_this_if
  roadmap:
    required:
      - release
      - reader_contract
      - themes
      - one_point_zero
      - update_policy
      - v6_stability_exception
    theme_required:
      - id
      - order
      - title
      - rationale
      - current_direction
  testing-evidence:
    required:
      - release
      - reader_contract
      - release_claim
      - v6_stability_exception
      - claim_boundaries
      - test_layers
      - test_harness
      - module_evidence
      - quality_system
      - regression_controls
      - quarantine
      - investigation_records
    test_layer_required:
      - id
      - command
      - merge_gate
      - proves
      - why_it_matters
      - limitation
      - inspect
    module_evidence_required:
      - id
      - artifact
      - coverage
      - inspect
      - limitation
    quality_system_required:
      - id
      - detects
      - posture
      - inspect
  feature:
    required:
      - title
      - category
      - module
      - maturity
      - availability
      - summary
      - use_this_when
      - setup
      - opt_in
      - boundaries
    optional:
      - references
      - validation
      - release_assumptions
    availability:
      published:
        required:
          - status
          - since
          - evidence
        evidence_required:
          - tag
          - path
          - basis
        evidence_optional:
          - commit
        optional:
          - documented_since
          - milestones
        milestone_required:
          - release
          - basis
        milestone_optional:
          - commit
      planned:
        required:
          - status
          - target_release
