  - id: proxy-conformance-suite
    artifact: parallel-consumer-proxy-conformance
    coverage: >-
      The shared conformance suite itself, its core control arm, and its own negative controls. Five
      scenarios are wired and pass for TWO BINDINGS - Parallel Consumer driven by a plain Java
      function, and java-direct, the shared client API bound in-process to core - against an engine
      hosted in the suite's own JVM over mock Kafka clients, with no broker and no Docker, asserting
      engine-side truth no client can see: a processed record advances the committed offset; an
      unreported record holds the commit back; a failed record is redelivered with attempt 2 and the
      previous reason verbatim; a held record admits a concurrent dispatch on another key while
      fencing its own; and the in-flight ceiling bounds unresolved records, which is the only scenario
      that constrains how many may be outstanding at once. THE ENGINE IS ONE OF THE BINDINGS and it is
      the control arm - a scenario red against a plain Java function is a wrong scenario rather than a
      broken client, and it runs in every selection so that answer arrives in the same job as the
      client that went red. THE PRESCRIPTION IS NOT RELAXED for an in-process binding: the control arm
      and the client binding execute one shared implementation of the runner contract, so no assertion
      can be written to suit either. EVERY SCENARIO WAS PROVEN ABLE TO FAIL by breaking the
      engine-side behaviour it pins - a redelivery carrying a reason the worker never gave reddened
      that scenario's two cells and nothing else; a worker pool wider than the declared ceiling
      reddened the ceiling scenario's two and nothing else; key ordering that stopped sharding by key
      reddened the ordering and ceiling scenarios; a success never recorded reddened eight cells and
      left the negative control's two GREEN, while counting a record complete at dispatch reddened the
      negative control - the two arms together are what say it is a control. The fixture is proven
      load-bearing the same way: seeding nothing into the embedded-client lane reddened all five
      java-direct cells and left all five core cells green.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/README.md
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/CoreBinding.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/ConformanceScenarios.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/SelectorMatchingNothingFailsTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/TranscriptOverlapTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-conformance/src/test/java/bz/stub/parallelconsumer/conformance/TheEngineArrivingMustBringTheGrpcBindingTest.java
    limitation: >-
      TWO BINDINGS, NOT THIRTEEN, and the missing ones are named rather than approximated. The
      java-grpc cell needs a sidecar with a dispatch engine behind it and the sidecar hosts none, so it
      is ABSENT RATHER THAN STUBBED - a stand-in would make agreement between bindings a statement
      about the stand-in - and a guard test in each affected module fails the build if the engine ever
      arrives without it. The ten foreign clients and the machinery that spawns their runners are a
      separate extraction. Five scenarios of the twelve named in the client-authoring guide, because
      the harness serves only those five: the liveness lease, the manifest reconnect, worker death,
      terminal outcomes and the shutdown drain are un-negotiated rather than passing. The mock lane
      only - committed offsets are read from a mock consumer's commit history, not from a broker
      through the Admin API. And the suite is deliberately bounded to the client/sidecar contract: it
      does not re-test engine internals, which are covered far more cheaply from inside the JVM.
  - id: streams-alpha
    artifact: parallel-consumer-streams-spike
    coverage: Planned alpha evidence must exercise the release artifact's opt-in boundary, comparison switch and supported topology/recovery claims.
    inspect:
      - astubbs#255
    limitation: No stable-module reliability claim applies before this module has its own release-time evidence.
  - id: connect-alpha
    artifact: parallel-consumer-connect
    coverage: Planned alpha evidence must exercise connector task lifecycle, offsets, rebalances, recovery and its opt-in artifact boundary.
    inspect:
      - astubbs#240
    limitation: No stable-module reliability claim applies before this module has its own release-time evidence.
regression_controls:
  diagnosis_first:
    # AGENTS.md states this rule; it is not restated here, because a paraphrase that cites the
    # original as its own evidence drifts from it silently.
    rule: AGENTS.md#testing
  negative_control:
    rule: Where practical, a regression test must fail without its fix or a deliberately broken control arm.
    examples:
      - investigation: ../solutions/test-flakiness/latest-reset-nudge-race-committedoffsetremoved-2026-07-30.md
        control: The old single-nudge pattern fails deterministically; LatestResetTailNudgeIT passes with the shared helper.
      - investigation: ../solutions/test-flakiness/vacuous-await-condition-brokerpoller-backpressure-2026-07-31.md
        control: Synchronizing record arrival makes the old vacuous await fail deterministically before the test is rewritten.
      - pull_request: https://github.com/astubbs/parallel-consumer/pull/265
        control: A deliberately non-blocking function makes the repaired BlockedThreadAsserter guard fail 20/20 times.
  ambient_probe:
    rule: AGENTS.md#testing
    mechanism: AmbientProbeExtension
quality_system:
  - id: test-convention-architecture
    detects: Accidental Testcontainers or integration-test discovery inside the unit lane.
    posture: Required by the ordinary test path.
    inspect: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/TestConventionsArchTest.java
  - id: required-suite-gates
    detects: Unit, integration and performance regressions before merge.
    posture: Merge-gated.
    inspect: .github/workflows/maven.yml
  - id: quarantine-audit
    detects: Registry drift, missing diagnosis and invalid owner claims before test execution.
    posture: Merge-gated audit; quarantined execution remains visible in its separate non-gating lane.
    inspect: .github/workflows/maven.yml
  - id: static-analysis
    detects: Static bug patterns and duplicate code in the PR path, and advisories against the dependencies a PR itself adds or changes.
    posture: PR analysis with its workflow-specific gate status; do not infer a clean bill of health beyond the tool's scope.
    inspect: .github/workflows/maven.yml
  - id: whole-tree-cve-scan
    detects: Published advisories against any component in the resolved dependency tree, including transitive ones no PR touches and ones a standing tree acquires while nothing changes.
    posture: >-
      Runs on every in-repo PR and weekly on a schedule, and a finding fails it - but the job is not
      yet a required status check, and fork PRs are skipped because they receive no credentials. Its
      first duty is to prove it scanned at all: the plugin reports BUILD SUCCESS when the scanner is
      unreachable, so a scan that cannot be shown to have happened fails with exit 1 where a real
      finding fails with exit 2, and green means the audit ran rather than that Maven did. Known
      findings are suppressed by id with a stated retirement condition and the suppression count is
      printed on every run, green ones included: that list is a maintained artifact, not evidence
      that nothing is there.
    inspect: bin/check-ossindex-audit.sh, run by .github/workflows/dependency-audit.yml
  - id: cve-exclusion-expiry
    detects: A CVE suppression marked temporary that has outlived its 90-day window, and any whose marker is missing, unparseable or dated in the future.
    posture: >-
      Runs in the no-network hygiene lane rather than beside the scan whose escape hatch it polices,
      so a credential expiry or a fork PR cannot leave the list unwatched; not yet a required status
      check. Anything it cannot date fails rather than reading as not-expired-yet, and exit 3 is kept
      distinct from the scan's two reds because neither the tree nor the lane is at fault - the
      bookkeeping has rotted. What expires is the classification, never a claim about an upstream
      release being late, so the red is always clearable by retiring the entry or re-arguing it.
      Dates and structure only; green means every entry is classified and in date, not that any
      exclusion deserves to be there - whether a stated reason is any good stays a review question.
    inspect: bin/check-cve-exclusions.sh, run by .github/workflows/repo-hygiene.yml
  - id: mutation-analysis
    detects: Assertions that survive relevant mutations in changed offset code.
    posture: Advisory PR-scoped signal; full sweep is separately invoked.
    inspect: bin/ci-mutation-test.sh
  - id: review-delivery
    detects: A review that never happened or never finished, rather than claiming a review because a job was green.
    posture: >-
      Split in two: the review is requested on demand, and a cheap always-on gate requires that a finished
      review already exists on the PR. Deliberately not per-commit: enforcing that here cost a contested
      timestamp comparison and the reviewed-SHA plumbing, and the coverage it protected came from an
      auto-reviewer on every push, switched off on 2026-08-19 on cost grounds and now on request only. No
      check reads the commits after the reviewed one, and that gap is accepted rather than covered; the
      reasoning is parked in docs/inflight/ci-strict-review-gate-freshness.md. There is no
      skip word, and a fork head is refused outright, so a red gate on an unreviewed PR is the expected state,
      not a fault. Comment metadata only; it cannot judge whether the review was any good, nor tell a review
      from any other answer the bot gave.
    inspect: bin/check-review-posted.sh, gated by .github/workflows/claude-code-review.yml and dispatched by .github/workflows/claude-code-review-dispatch.yml
investigation_records:
  - defect: Drain-path zombie and busy-spin under contention.
    proof: A real drain-path defect was isolated while investigating a flaky integration test; no timeout was loosened.
    recurrence_guard: BrokerPollSystemDrainTest and the documented diagnosis.
    source: ../solutions/test-flakiness/pc-silent-stall-under-contention-2026-07-29.md
  - defect: Latest-offset-reset nudge race in the integration harness.
    proof: The old control arm fails deterministically when reset position is established after its only nudge.
    recurrence_guard: LatestResetTailNudgeIT and BrokerIntegrationTest.awaitWithTopicNudge.
    source: ../solutions/test-flakiness/latest-reset-nudge-race-committedoffsetremoved-2026-07-30.md
  - defect: Vacuous backpressure await condition.
    proof: Arrival synchronization proves the original condition was unsatisfiable after work arrived.
    recurrence_guard: A rewritten steady-state assertion with named 150/50 bounds.
    source: ../solutions/test-flakiness/vacuous-await-condition-brokerpoller-backpressure-2026-07-31.md
  - defect: Thread-parallel test contention made suite behavior depend on shared static state.
    proof: Process forks were measured as faster and reliable while JUnit thread parallelism was intermittent.
    recurrence_guard: CI uses JVM forks; the module configuration leak and causality-sleep sweep are tracked in astubbs#265.
    source: ../solutions/test-flakiness/unit-tests-parallelise-by-forking-not-threading-2026-07-29.md
quarantine:
  # The registry states its own rules and is the source for them. Do not restate them here; they
  # would drift, and this file would then contradict the document it is citing as evidence.
  rules: ../quarantined-tests.md
  # DELIBERATELY NOT A STATE ASSERTION - not a count, and not "empty"/"non-empty" either. "Empty" was
  # written when it was true and was still here after two tests were quarantined, contradicting the
  # registry this file cites as its own evidence. Nothing validates this field, so ANY assertion about
  # the registry's contents rots the same way the moment the registry changes; "non-empty" would go
  # stale on the next re-enable exactly as "empty" did on the next quarantine. The only value that
  # cannot drift is the one that names where the state is actually held.
  current_status: Held in the registry linked above, which is the live list; this file deliberately does not restate it.
  verification:
    - bin/check-quarantine-registry.sh
    - bin/check-quarantine-owners.sh
  meaning: A mechanism that exists and is enforced is a different claim from having no mechanism. What is held out of the gates at any moment is the registry's to state, not this file's.
transparency:
  solved: ../solutions/
  open: ../inflight/
  rule: Surface a thin or unresolved area as open work instead of weakening a claim to make it sound complete.
