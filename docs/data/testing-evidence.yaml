schema_version: 1
kind: testing-evidence
release: 0.6.0.0
reader_contract:
  audience: Skeptical technical evaluator who needs to verify claims quickly.
  presentation_rule: A renderer should keep the inspection path, claim boundary and limitation beside every claim.
  argument: Show how the suite can be wrong and how the project notices, rather than using test counts as a proxy for quality.
release_claim:
  condition: >-
    0.6.0.0 ships only when every known CRITICAL defect in its release scope has a landed resolution
    and a reproducible guard. Critical is the line; non-critical defects are not claimed to be fixed.
  status_until_cut: Release gate; not a claim about an uncut source tree.
  known_defect_scope: Diagnosed product defects recorded in the release ledger, solution corpus and selected v6 fix queue.
  does_not_claim: Unknown defects cannot exist, every desired capability ships, or an alpha module inherits stable-module confidence.
v6_stability_exception:
  # The release note carries the positioning paragraph. Not repeated here.
  positioning: ../inflight/release-0.6.0.0.md
  release_gate: >-
    Before cutting 0.6.0.0, reconcile the known-defect scope against the final merged queue, verify each resolution's
    recurrence guard, and leave no known critical defect open. Amend the claim rather than cut the release if this fails.
  # No snapshot of the open queue lives here. roadmap.yaml's update_policy states the rule this data
  # follows: do not copy individual issue state into a document, link readers to the tracker instead.
  # A snapshot of open pull requests is stale the day after it is written and nothing updates it.
  queue: Open v6 product-fix and test-integrity pull requests on astubbs/parallel-consumer are the release inputs.
  explicit_deferrals: Virtual threads, micro-batching and the dead-letter queue are deferred features, not open defects.
claim_boundaries:
  - The data records known failure modes and their controls; it does not claim that unknown defects cannot exist.
  - A passing test does not replace diagnosis, a control arm or investigation evidence for a concurrency fix.
  - An experimental module must supply its own evidence and does not inherit the stable-module claim.
  - A green non-gating lane is evidence with a stated scope, not a merge or release approval.
test_layers:
  - id: unit
    proves: Deterministic behavior in isolation, including offset encoding, foreign metadata handling and commit decisions.
    command: bin/ci-unit-test.sh
    merge_gate: true
    why_it_matters: Deterministic fakes make scheduler, ordering and offset decisions directly observable without broker timing.
    limitation: Does not prove broker protocol, consumer-group or transaction behavior.
    inspect:
      - path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/AbstractParallelEoSStreamProcessorTestBase.java
        demonstrates: Shared deterministic processor harness with a long-polling mock consumer and commit history.
      - path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/BatchTestMethods.java
        demonstrates: Common batch behavior checks applied across processing adapters.
  - id: broker-integration
    proves: Consumer-group progress, rebalances, transactions and real Kafka behavior.
    command: bin/ci-integration-test.sh
    merge_gate: true
    why_it_matters: Uses real Kafka brokers and deliberately isolates broker work by JVM fork in CI so a passing run is not shared-broker luck.
    limitation: The standard suite cannot exhaust every schedule or reproduce every production topology.
    inspect:
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/BrokerIntegrationTest.java
        demonstrates: Shared real-broker base with diagnostic waits and failure context.
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/utils/KafkaClientUtils.java
        demonstrates: Canonical production of test records and real Kafka clients, including controlled topic setup.
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/RebalanceEoSDeadlockTest.java
        demonstrates: The confluentinc#857 deadlock condition under a real broker.
  - id: performance
    proves: Behavior under sustained concurrent processing.
    command: bin/performance-test.sh
    merge_gate: true
    why_it_matters: Makes performance-tagged behavior visible in the ordinary PR path instead of relying only on developer machines.
    limitation: Passing a performance suite is not a throughput promise for every workload or hardware profile.
    inspect:
      - path: bin/performance-test.sh
        demonstrates: Performance-tagged tests run with their tags explicitly selected.
  - id: mutation
    proves: Tests detect meaningful changes to the code they cover.
    command: bin/ci-mutation-test.sh
    merge_gate: false
    status: Advisory, PR-scoped evidence.
    why_it_matters: A green assertion is stronger when a relevant code mutation has been shown to make it fail.
    limitation: It covers changed, decidable offset classes on a PR; a skipped or narrow run is not a project-wide coverage claim.
    inspect:
      - path: bin/ci-mutation-test.sh
        demonstrates: PR-scoped mutation selection, and an exit code that separates a scored run from a skip and from a lane that could not run at all.
  - id: chaos
    proves: Rebalance, revocation and stalled-progress behavior under calibrated disruption.
    command: bin/chaos-test.sh
    merge_gate: false
    status: >-
      Runs per PR on the self-hosted highcpu lane and on demand as a seeded investigation lane. That lane
      is explicitly non-gating - it is skipped for fork PRs and its runner may be offline - so it cannot
      block a merge. What the chaos entry's optional flag buys is that a red shows as red rather than
      neutral, which makes it a real finding to act on rather than a required check.
    why_it_matters: Seeded schedules, progress probes and a no-loss/bounded-duplicate ledger target alive-but-not-progressing failures that normal tests can miss.
    limitation: A calibrated detector hunts known failure classes; it does not establish the absence of every concurrency defect.
    inspect:
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/chaostests/ChaosScenarioBase.java
        demonstrates: Reproducible chaos schedules with recorded seeds and workload control.
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/chaostests/ChaosChurnStormIT.java
        demonstrates: Calibrated consumer-churn detection for stalled progress.
      - path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/chaostests/ChaosRevokeUnderWorkIT.java
        demonstrates: Revocation while work is active and protocol-invisible lag stagnation detection.
  - id: soak
    proves: Long-running behavior outside the merge gate.
    command: bin/soak-test.sh
    merge_gate: false
    why_it_matters: Deliberate CPU pressure and repeated measurement expose failure-rate behavior that a short test cannot.
    limitation: A successful finite soak is a sample, not a reliability proof.
    inspect:
      - path: bin/soak-test.sh
        demonstrates: Failure-rate measurement under deliberately constrained CPU, with per-run logs.
test_harness:
  deterministic_harness:
    claim: The core harness makes ordering, commit and bounded-concurrency assertions causal rather than wall-clock guesses.
    inspect:
      - parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/AbstractParallelEoSStreamProcessorTestBase.java
      - parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/BatchTestMethods.java
  real_broker_harness:
    claim: Shared broker utilities make transactional clients, topic creation and failure diagnostics consistent instead of reimplemented per test.
    inspect:
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/BrokerIntegrationTest.java
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/utils/KafkaClientUtils.java
  failure_classification:
    claim: The ambient probe records rebalance dwell, stagnant lag and frozen committed offsets on a broker-test failure, separating contention evidence from a lost-progress lead.
    limitation: The probe is observational and best-effort; a clean probe does not prove the test has no fault.
    inspect:
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/AmbientProbeExtension.java
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/chaostests/ProgressProbe.java
module_evidence:
  - id: core
    artifact: parallel-consumer-core
    coverage: Deterministic processor/offset tests, real-broker integration, ambient diagnostics and chaos scenarios.
    inspect:
      - parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/AbstractParallelEoSStreamProcessorTestBase.java
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/RebalanceEoSDeadlockTest.java
      - parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/chaostests/ChaosChurnStormIT.java
    limitation: The breadth of core evidence does not automatically prove an adapter's own execution boundary.
  - id: vertx
    artifact: parallel-consumer-vertx
    coverage: Adapter unit harness plus a real-Kafka, WireMock-backed concurrency and drain integration test.
    inspect:
      - parallel-consumer-vertx/src/test/java/bz/stub/parallelconsumer/vertx/VertxBaseUnitTest.java
      - parallel-consumer-vertx/src/test-integration/java/bz/stub/parallelconsumer/vertx/integrationTests/VertxConcurrencyIT.java
    limitation: The real-broker adapter test is one configured workload, not a full broker matrix.
  - id: reactor
    artifact: parallel-consumer-reactor
    coverage: Reactor adapter tests inherit processor semantics and exercise delayed reactive completion, bounded concurrency and commits.
    inspect:
      - parallel-consumer-reactor/src/test/java/bz/stub/parallelconsumer/reactor/ReactorUnitTestBase.java
      - parallel-consumer-reactor/src/test/java/bz/stub/parallelconsumer/reactor/ReactorPCTest.java
    limitation: Reactor currently has no adapter-specific real-broker integration suite.
  - id: mutiny
    artifact: parallel-consumer-mutiny
    coverage: Mutiny adapter tests inherit processor semantics and exercise delayed Uni completion, bounded concurrency and commits.
    inspect:
      - parallel-consumer-mutiny/src/test/java/bz/stub/parallelconsumer/mutiny/MutinyUnitTestBase.java
      - parallel-consumer-mutiny/src/test/java/bz/stub/parallelconsumer/mutiny/MutinyPCTest.java
    limitation: Mutiny currently has no adapter-specific real-broker integration suite; its Java 17 runtime floor is independently verified at release.
  - id: examples
    artifact: parallel-consumer-examples
    coverage: Runnable application wiring for core, Reactor and Vert.x plus real-broker Streams and metrics examples.
    inspect:
      - parallel-consumer-examples/parallel-consumer-example-core/src/test/java/bz/stub/parallelconsumer/examples/core/CoreAppTest.java
      - parallel-consumer-examples/parallel-consumer-example-streams/src/test/java/bz/stub/parallelconsumer/examples/streams/integrationTests/StreamsAppTest.java
      - parallel-consumer-examples/parallel-consumer-example-metrics/src/test/java/bz/stub/parallelconsumer/examples/metrics/integrationTests/CoreAppMetricsIntegrationTest.java
    limitation: Examples demonstrate wiring and operability; they are not a runtime-library compatibility guarantee.
  - id: proxy-protocol
    artifact: parallel-consumer-proxy-protocol
    coverage: >-
      Codegen wiring proven by compiled protobuf and gRPC stubs; full-field round-trips of every frozen
      message including optional-field presence and unknown-field preservation; a checked-in canonical
      session asserted in BOTH directions, because a same-runtime round trip only proves Java agrees with
      Java and these bytes are the fixed point independently generated parsers must meet; and the
      specification-to-schema diff enforced empty from the generated descriptors. Compatibility is
      enforced outside the JVM suite by bin/check-proto-breaking.sh, whose own ability to say no is
      pinned by bin/test-check-proto-breaking.sh.
    inspect:
      - parallel-consumer-proxy-protocol/src/test/java/bz/stub/parallelconsumer/proxy/protocol/GoldenSessionBytesTest.java
      - parallel-consumer-proxy-protocol/src/test/java/bz/stub/parallelconsumer/proxy/protocol/SpecificationCoverageTest.java
      - bin/test-check-proto-breaking.sh
    limitation: >-
      This is evidence about a CONTRACT, not about behaviour. It proves the schema encodes, decodes and
      is documented as it claims; it proves nothing about a proxy serving it or a client speaking it,
      because no engine and no client library exists on master yet.
  - id: proxy-sidecar
    artifact: parallel-consumer-proxy
    coverage: >-
      The process lifecycle end to end, driven through the entry point rather than asserted on its
      parts: arguments refused with a message naming where configuration actually goes; an ephemeral
      loopback port bound, announced on stdout line one and proven to answer; two sidecars binding
      different ports so one host running two applications is not a bind race; a real gRPC session
      reaching the hosted service and being refused with a status that names what is missing; and the
      listener proven GONE after parent death, which is what separates "run returned" from "the
      server was shut down". Plus the transport's own admission rules - loopback-only bind, the
      non-loopback opt-in and its warning, the authority allowlist and the one-connection slot -
      each asserted with service-invocation counters rather than on the client-visible status alone.
    inspect:
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/MainTest.java
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/transport/ProxyServerTest.java
      - parallel-consumer-proxy/src/test/java/bz/stub/parallelconsumer/proxy/lifecycle/ParentDeathWatchdogTest.java
    limitation: >-
      Evidence about a PROCESS, not about processing. No engine is hosted, so no record has been
      dispatched, no verdict returned and no offset committed; and the sidecar has never run against
      a broker, because it cannot be configured to reach one.
  - id: proxy-client-java
    artifact: parallel-consumer-proxy-client-java
    coverage: >-
      The DIRECT transport over core's mock Kafka clients: a record delivered as the API's own type,
      a success applied as BOTH a committed offset and a produced record - the assertions chosen
      because a transport that ran the user function and dropped its verdict looks identical from the
      processor's side - a failure redelivered carrying the reason the previous attempt gave, the
      session's end completing on close and not before, and poll refused a second time. The gRPC
      transport against a REAL sidecar started through its own entry point: the handshake reaching the
      session service and its refusal reaching the caller from both connect() and sessionEnd(),
      asserted on the STATUS CODE, because the authority allowlist and the admission slot answer with
      different codes before the service method runs - with a control arm pointed at a port nothing is
      listening on, so the assertion cannot pass on any failure at all. Against a scripted proxy: a
      mid-session stream error ending the session with its cause and releasing the executors, and a
      close mid-processing reporting the user function's own outcome rather than a fabricated one.
      Plus the wire mapping's decided conversions, above all the delivery token echoed byte for byte.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-direct/src/test/java/bz/stub/parallelconsumer/client/direct/DirectParallelConsumerClientTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-harness/src/test/java/bz/stub/parallelconsumer/client/harness/SidecarHandshakeTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-grpc/src/test/java/bz/stub/parallelconsumer/client/grpc/SessionEndTest.java
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-java/parallel-consumer-proxy-client-java-api/src/test/java/bz/stub/parallelconsumer/client/ClientSurfaceArchTest.java
    limitation: >-
      NO RECORD HAS CROSSED THE WIRE. The sidecar on this branch hosts no engine, so every gRPC
      assertion past the handshake is against a proxy the test itself scripts - which can prove how
      the transport reacts, and cannot prove that a real engine would ever behave that way. Nothing
      here has run against a broker, in either transport. The shared conformance suite IS here now and
      the direct transport answers it, both through the transport-parameterised suite in the api
      module's test-jar and as a binding of the cross-binding matrix; what is still missing is the
      half that makes the two transports answerable to the SAME scenarios, because the gRPC cell needs
      an engine to dispatch and has none - see proxy-conformance-suite.
  - id: proxy-client-kotlin
    artifact: parallel-consumer-proxy-client-kotlin
    coverage: >-
      The handshake against a REAL sidecar process started through the proxy module's own entry point: Configure reaching the session service and the service's refusal reaching the caller in this language's own error idiom, asserted on the STATUS CODE because the authority allowlist and the admission slot answer with different codes before the service method runs - with a control arm pointed at a port nothing is listening on, so the assertion cannot pass on any failure at all. Beside it, the library's own logic over scripted or in-process fixtures: the dispatch queue's hand-out and its overflow-is-a-protocol-violation rule, the in-flight ceiling counting queued plus executing, the session's end carrying its cause, wire and outcome conversion, and that no verdict is invented for work the user's function did not finish.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-kotlin
    limitation: >-
      NO RECORD HAS CROSSED THE WIRE. The sidecar this client connects to hosts no engine and refuses every session, so what is evidenced ends at the handshake; everything past it is against fixtures this module writes, which can prove how the client reacts and cannot prove that a real engine would behave that way. Nothing has run against a broker. Its conformance runner compiles and is registered; nothing has executed it, because that needs an engine - see proxy-conformance-suite.
