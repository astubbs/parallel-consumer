  - id: proxy-client-cpp
    artifact: parallel-consumer-proxy-client-cpp
    coverage: >-
      Its own suite, run INSIDE its build image - the dispatch queue's hand-out and its overflow rule, the option validation, and the port line found among the sidecar's log chatter - plus a statically linked artifact that runs on a host with none of the image's libraries, with a dynamically linked control beside it that must fail there.
    inspect:
      - parallel-consumer-proxy-clients/parallel-consumer-proxy-client-cpp
    limitation: >-
      NO RECORD HAS CROSSED THE WIRE, and unlike the other eight languages this one has not spoken to a real sidecar at all: its toolchain lives in a container with no JVM in it, so the handshake-against-a-real-sidecar check the others carry has nowhere to run here. What is evidenced is the library's own logic and the portability of what the image produced. Its conformance runner compiles and is registered; nothing has executed it, because that needs an engine behind the sidecar - see proxy-conformance-suite.
  - id: proxy-client-swift
    artifact: parallel-consumer-proxy-client-swift
    coverage: >-
