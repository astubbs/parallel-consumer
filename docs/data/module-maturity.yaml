schema_version: 1
kind: module-maturity
release: 0.6.0.0
reader_contract:
  question: Can I rely on this module in production, and can I safely compile against it long term?
  answer_shape: Reliability confidence and API stability are independent fields; project version alone answers neither.
axes:
  reliability:
    claim: >-
      A release does not ship until every known CRITICAL defect in its scope is resolved and
      evidenced. Critical is the line. Non-critical defects are not claimed to be fixed, and "all
      known defects" would be a claim this project cannot support.
    scope: >-
      One claim, uniform across the published modules. All of them depend on parallel-consumer-core
      and run the same engine, so a reliability statement about core is a statement about all of
      them and there is no per-module gradient to publish. An experimental module never borrows it.
    evidence: testing-evidence.yaml
    does_not_claim: >-
      That no unknown defect exists, that every non-critical defect is fixed, or that a future
      feature is needed before the published modules can be relied on.
  api_stability:
    claim: Stable-module APIs remain pre-1.0 and can change before 1.0.
    does_not_mean: The stable modules are unreliable or experimental.
release_validation:
  known_defect_gate:
    condition: >-
      Reconcile the release ledger, solution corpus and v6 stability queue; every known CRITICAL defect must have a
      merged resolution and its named recurrence guard must pass before 0.6.0.0 is cut.
    evidence: testing-evidence.yaml#v6_stability_exception
    explicit_non_defect_deferrals:
      - Virtual threads
      - Micro-batching
      - Dead-letter queue
  automated:
    - Release workflow verifies the current master CI run succeeded.
    - Release workflow blocks when any @Quarantined annotation is present in the source; a dry run warns instead.
  manual:
    - Confirm that no known critical defect remains in the v6 release scope; amend the release claim rather than waive an open item.
    - Verify the confluentinc#857 deadlock resolution with RebalanceEoSDeadlockTest and the post-fix parallel-integration proof.
    - Verify each alpha module's artifact boundary and user-facing setup against the built release artifact.
  on_failure: Do not cut the release; amend this data and the README to match the actual release posture.
modules:
  - artifact: parallel-consumer-core
    maturity: production-use
    minimum_java: 8
    reliability_confidence: Covered by the release gate on known critical defects; same engine as core.
    api_expectation: Pre-1.0 API; compatible change is preferred but not guaranteed.
    support_posture: Maintained for production use when the release validation passes.
    evidence_id: core
    use_this_if: You need ordered concurrent Kafka consumption in a standard Java application.
  - artifact: parallel-consumer-vertx
    maturity: production-use
    minimum_java: 8
    reliability_confidence: Covered by the release gate on known critical defects; same engine as core.
    api_expectation: Pre-1.0 API; compatible change is preferred but not guaranteed.
    support_posture: Maintained for production use when the release validation passes.
    evidence_id: vertx
    use_this_if: Your processing uses Vert.x asynchronous APIs.
  - artifact: parallel-consumer-reactor
    maturity: production-use
    minimum_java: 8
    reliability_confidence: Covered by the release gate on known critical defects; same engine as core.
    api_expectation: Pre-1.0 API; compatible change is preferred but not guaranteed.
    support_posture: Maintained for production use when the release validation passes.
    evidence_id: reactor
    use_this_if: Your processing uses Project Reactor.
  - artifact: parallel-consumer-mutiny
    maturity: production-use
    minimum_java: 17
    reliability_confidence: Covered by the release gate on known critical defects; same engine as core.
    api_expectation: Pre-1.0 API; compatible change is preferred but not guaranteed.
    support_posture: Maintained for production use when the release validation passes.
    evidence_id: mutiny
    feature: ../features/mutiny-integration.yaml
    use_this_if: Your processing uses SmallRye Mutiny.
  - artifact: parallel-consumer-proxy-protocol
    maturity: alpha
    minimum_java: 17
    reliability_confidence: >-
      The v1 wire schema is frozen and its encoding is pinned by checked-in golden bytes, but no
      engine and no client has carried a record over it on this branch - so what is evidenced is
      encoding fidelity and specification coverage, not protocol behaviour.
    api_expectation: >-
      FROZEN, which is a stronger promise than the pre-1.0 modules make and a narrower one: the wire
      may only GAIN. Nothing in it may be removed, renumbered, retyped or renamed, and
      bin/check-proto-breaking.sh fails a change that tries. A capability token, not a version
      number, is how a client learns what an addition means.
    support_posture: >-
      Experimental. Published to no registry; no client library speaks it, and the sidecar on master
      hosts no engine, so nothing has yet had to be compatible with it.
    evidence_id: proxy-protocol
    tracking: astubbs#242
    use_this_if: >-
      You are writing a client against the proxy protocol. The two artifacts to work from are the
      schema and parallel-consumer-proxy-protocol/docs/protocol-specification.md; the client-authoring
      guide beside them says what an implementation must do.
  - artifact: parallel-consumer-proxy
    maturity: alpha
    minimum_java: 17
    reliability_confidence: >-
      What is evidenced is the process boundary, and only that: the sidecar binds loopback on an
      ephemeral port, announces it, admits exactly one stream, rejects an unlisted declared authority
      before the service method runs, and releases the socket when its parent dies. It hosts NO
      Parallel Consumer engine - a session is answered UNIMPLEMENTED - so nothing here evidences a
      record being processed, an offset being committed, or any protocol behaviour beyond the
      handshake being refused.
    api_expectation: >-
      Pre-1.0 and expected to change substantially: the engine, its connect-time configuration and
      the shutdown drain are still to arrive, and the seam they plug into is the one thing here most
      likely to move.
    support_posture: >-
      Experimental. Published to no registry, and there is no supported way to run it against a
      broker yet because it cannot be configured.
    evidence_id: proxy-sidecar
    tracking: astubbs#242
    use_this_if: >-
      You are reviewing or extending the sidecar's packaging and process lifecycle. There is no
      user-facing reason to depend on it yet.
  - artifact: parallel-consumer-proxy-client-java
    maturity: alpha
    minimum_java: 17
    reliability_confidence: >-
      Two transports behind one surface, evidenced very differently. The DIRECT transport is
      evidenced end to end - a record through the user function, its verdict applied as a committed
      offset and a produced record, a failure redelivered carrying its reason - because the engine it
      binds is parallel-consumer-core, which is ordinary. The gRPC transport is evidenced as far as a
      real sidecar can take it, which today is the handshake: it reaches a running sidecar's session
      service and reports the refusal it is given. Its dispatch, report and shutdown paths are
      implemented and exercised against a scripted proxy, never yet against a real engine, so nothing
      here evidences a record crossing the wire.
    api_expectation: >-
      Pre-1.0 and expected to change: this surface is the one the other client languages mirror, and
      what it must stay expressible in is a harder constraint than Java alone would impose. It carries
      no transport type by construction - an ArchUnit rule over the bytecode and an enforcer ban over
      the dependency tree both fail the build if one appears.
    support_posture: >-
      Experimental. Published to no registry; the whole clients tree skips deploy and install, so the
      only way to use it is from this checkout.
    evidence_id: proxy-client-java
    tracking: astubbs#242
    use_this_if: >-
      You are writing or reviewing a proxy client. This is the reference surface the other languages
      mirror, and parallel-consumer-proxy-protocol/docs/client-authoring-guide.md is what to read
      beside it.
  - artifact: parallel-consumer-proxy-conformance
    maturity: alpha
    minimum_java: 17
    reliability_confidence: >-
      A test module, not a product one: no main sources, no published artifact, and nothing downstream
      may depend on it. What it evidences belongs to the clients it drives and is recorded on their
      rows. Its own claim is narrower and worth stating because a suite that cannot fail is worse than
      no suite: five scenarios run against two bindings - Parallel Consumer driven by a plain Java
      function, and the direct client bound in-process to it - and each was proven able to fail by
      breaking the engine-side behaviour it pins and watching exactly that row go red.
    api_expectation: >-
      There is no API. The scenario names are stable because they are the shared vocabulary every
      client's tests use, and the runner contract is frozen in the same sense - adding a behaviour
      token is a change to every client.
    support_posture: >-
      Experimental. Published to no registry, has no main sources, and is not runnable except through
      this repository's build.
    evidence_id: proxy-conformance-suite
    tracking: astubbs#242
    use_this_if: >-
      You are writing a proxy client in any language, or changing what the product promises one. This
      module is where "correct" is defined, once, for all of them.
  - artifact: parallel-consumer-examples
    maturity: reference-example
    reliability_confidence: Exercises supported module use cases; it is not a runtime library dependency.
    api_expectation: Examples change with the APIs they demonstrate.
    support_posture: Use as starting points, not as a compatibility surface.
    evidence_id: examples
    use_this_if: You want runnable examples before choosing a stable integration module.
