schema_version: 1
kind: feature
title: Managed executor service integration
category: integration
module: parallel-consumer-core
maturity: production-use
availability:
  status: published
  since: 0.3.2.0
  evidence:
    tag: 0.3.2.0
    path: CHANGELOG.adoc
    basis: Added managed executor service support for Java EE environments.
summary: Use a JNDI-managed executor for Parallel Consumer control work when the runtime owns application threads.
use_this_when:
  - Your Java EE or Jakarta EE environment requires work to run through its managed executor service.
setup:
  option: ParallelConsumerOptions.managedExecutorService
  default_jndi_name: java:comp/DefaultManagedExecutorService
opt_in:
  mechanism: Set the managed executor JNDI name in the options.
  isolated_from_stable_modules: false
boundaries:
  - In Java SE, failed JNDI lookup falls back to an internally created single-thread executor.
  - The configured executor must be valid for the runtime; this option does not create or tune the server-managed resource.
references:
  - label: Managed executor option
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/ParallelConsumerOptions.java
