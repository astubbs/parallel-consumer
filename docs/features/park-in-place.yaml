schema_version: 1
kind: feature
title: Park in place - a record gives up without a dead-letter topic
category: processing
module: parallel-consumer-core
maturity: alpha
availability:
  status: planned
  target_release: 0.6.0.0
release_assumptions:
  - >-
    Both APIs park in 0.6.0.0. Park is the engine's behaviour, and a classic-API processing function reaches it by
    throwing a retriable exception carrying a park reason; what the fluent API adds is declaring it as a route's
    reaction to running out of attempts, together with the retry limit that gets a record there. This record
    describes what a route author sees. The engine-level record, park-in-place-engine, owns the mechanism, the
    classic-API entry point and the guarantees underneath, and is where a claim about either belongs.
  - There is no dead-letter setting and no export command in this release, and resume refuses, so nothing here may claim a parked record can be moved or re-attempted without a restart.
summary: >-
  A record that has run out of attempts stays where it is - incomplete in the offset map, holding no worker - while
  the partition commits past it, so one poison record costs neither a stopped topic nor a dead-letter topic you
  did not want to run.
use_this_when:
  - A poison record must stop consuming retries without stopping the topic, and without being copied somewhere else first.
  - You want the retry limit and the reaction to it declared on the route, as data, rather than counted inside the
    processing function.
  - You want a finite default retry limit and cannot afford the record to be silently marked succeeded when it is reached.
  - An operator needs to see which records gave up, when, after how many attempts and with which failure.
setup:
  declare:
    - Nothing. Ten attempts followed by park is the default on every fluent-API route.
    - afterRetries(park()) states it explicitly; afterRetries(park().thenRetryAfter(d).forCycles(n)) is scheduled retry.
    - retryLimit(n) and retryDelay(d) per route, or withDefaultRetryLimit and withDefaultRetryDelay for the
      instance.
  observe:
    - instance.topic(name).parked() for one route, instance.parkedAllTopics() for the instance-wide roll-up. Each
      parked record carries its offset, key, attempt count, last failure, the reason it parked and how long it has
      been parked.
    - pc.partition.parked.records and pc.partition.parked.oldest.age, tagged by topic and partition.
    - onParked, which fires once per record per assignment.
opt_in:
  mechanism: >-
    The default reaction on any fluent-API route - a record is attempted ten times and then parks with nothing
    declared at all. No option turns it on or off. The classic API reaches the same engine behaviour by throwing,
    which park-in-place-engine describes; what is the default here is a choice a classic-API function makes per
    record.
  isolated_from_stable_modules: false
boundaries:
  - Under key ordering a parked record holds its key, so later records with that key wait behind it; every other
    key on the partition is unaffected. Under partition ordering it holds its partition, so park serves key and
    unordered processing, and a partition-ordered instance needs the record to leave the topic instead, which
    this release cannot do.
  - Consumer-group lag reads as stuck at the oldest parked record, because the committed offset cannot advance past
    an incomplete one even while everything after it commits in the metadata.
  - The attempt count is per assignment. A rebalance or a restart delivers a parked record again and it is
    attempted afresh - which is also the only way to release one in this release, since resume refuses and there
    is nothing that copies a record out.
  - A parked record deleted from the broker by retention is unaffected while the instance runs, because it is held
    in memory; a restart loses it. Nothing in this release makes a parked set survive a restart, and there is no
    setting to declare that would.
  - Parked records count against the partition's offset-map payload, and nothing shrinks it while they stay
    parked, so a partition whose payload reaches the engine's pressure threshold stops taking work.
  - A parked record is deliberately invisible to the slow-work scan, so it is not counted against the partition's
    slow-records meter and its topic is not named in the periodic waiting-too-long warning. Slow work means work
    that should have moved and has not, and a parked record is work the definition stopped on purpose. The
    consequence to know is that the parked view and the parked gauges are the whole signal - nothing else will
    mention a parked record again.
  - A close that drains waits for records queued behind a parked key, which is work it can never take, so such a
    close waits out its drain timeout.
validation:
  - Confirm the parked count for the route matches the records you expect to have given up, and that offsets past them commit.
  - Confirm a second instance joining the same group after a close is given the parked records and nothing else.
references:
  - label: README section
    path: README.adoc#park-in-place
  - label: Broker-backed proof that offsets past a parked record commit
    path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/FluentQuickstartIT.java
  - label: A parked record is not slow work, with a still-slow control arm in the same test
    path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/fluent/ParkedRecordsAreNotSlowWorkTest.java
readme_anchor: park-in-place
