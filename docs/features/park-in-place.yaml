schema_version: 1
kind: feature
title: Park in place - a record gives up without a dead-letter topic
category: processing
module: parallel-consumer-core
maturity: alpha
availability:
  status: planned
  target_release: 0.6.0.0
release_assumptions:
  - Available on the fluent API only in 0.6.0.0; the classic API keeps retrying for ever, which is unchanged.
  - Dead-lettering, resume and the handle's export command are refused in this release, so nothing here may claim a parked record can be moved or re-attempted without a restart.
summary: >-
  A record that has run out of attempts stays where it is - incomplete in the offset map, holding no worker - while
  the partition commits past it, so a dead-letter topic becomes a relief valve rather than a requirement.
use_this_when:
  - A poison record must stop consuming retries without stopping the topic, and without being copied somewhere else first.
  - You want a finite default retry limit and cannot afford the record to be silently marked succeeded when it is reached.
  - An operator needs to see which records gave up, when, after how many attempts and with which failure.
setup:
  declare:
    - Nothing. Ten attempts followed by park is the default on every fluent-API route.
    - afterRetries(park()) states it explicitly; afterRetries(park().thenRetryAfter(d).forCycles(n)) is scheduled retry.
    - retryLimit(n) and retryDelay(d) per route, or defaultRetryLimit and defaultRetryDelay for the instance.
  observe:
    - handle.topic(name).parked() for one route, handle.parkedAllTopics() for the instance.
    - pc.route.parked.records and pc.route.parked.oldest.age, tagged by topic and partition.
    - onParked, which fires once per record per assignment.
opt_in:
  mechanism: The default reaction on any fluent-API route. The classic API is unaffected.
  isolated_from_stable_modules: false
boundaries:
  - Under key ordering a parked record holds its key, so later records with that key wait behind it; every other
    key on the partition is unaffected. Under partition ordering it holds its partition, so park serves key and
    unordered processing and a partition-ordered instance should declare a dead-letter destination instead.
  - Consumer-group lag reads as stuck at the oldest parked record, because the committed offset cannot advance past
    an incomplete one even while everything after it commits in the metadata.
  - The attempt count is per assignment. A rebalance or a restart delivers a parked record again and it is
    attempted afresh - which is also the only way to release one in this release, since resume and the export
    command are refused.
  - A parked record deleted from the broker by retention is unaffected while the instance runs, because it is held
    in memory; a restart loses it. A route whose parked records must survive a restart needs a dead-letter
    destination or an age bound.
  - Parked records count against the partition's offset-map payload. With no dead-letter destination declared, a
    partition whose payload reaches the engine's pressure threshold stops taking work.
  - A parked record is reported as slow work in this release - it counts against the partition's slow-records meter
    and is named in the periodic waiting-too-long warning - because parking is expressed as a retry with a
    far-future delay. It is noise rather than a symptom.
  - A close that drains waits for records queued behind a parked key, which is work it can never take, so such a
    close waits out its drain timeout.
validation:
  - Confirm the parked count for the route matches the records you expect to have given up, and that offsets past them commit.
  - Confirm a second instance joining the same group after a close is given the parked records and nothing else.
references:
  - label: README section
    path: README.adoc#park-in-place
  - label: Broker-backed proof that offsets past a parked record commit
    path: parallel-consumer-core/src/test-integration/java/bz/stub/parallelconsumer/integrationTests/FluentQuickstartIT.java
readme_anchor: park-in-place
