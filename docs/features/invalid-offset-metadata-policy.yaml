schema_version: 1
kind: feature
title: Unreadable offset-metadata policy
category: delivery
module: parallel-consumer-core
maturity: production-use
availability:
  status: published
  since: 0.5.2.6
  evidence:
    tag: 0.5.2.6
    path: CHANGELOG.adoc
    basis: Added an error policy for recognized non-Parallel-Consumer offset metadata on assignment.
summary: Choose whether offset metadata this build cannot read stops the application or is discarded so processing resumes from the committed offset.
use_this_when:
  - A consumer group might previously have been used by Kafka Streams, another framework, or operator tooling.
  - A rolling upgrade or rollback puts a newer and an older Parallel Consumer in the same group, so an older instance may read metadata written with an encoding it does not have.
  - Operations need an explicit policy instead of discovering unreadable offset metadata during assignment.
setup:
  option: ParallelConsumerOptions.invalidOffsetMetadataPolicy
  values:
    - IGNORE is the default; it logs a warning, discards the metadata and resumes from the committed offset.
    - FAIL stops rather than discard an offset map, because discarding one replays records that completed but were not committed.
opt_in:
  mechanism: Set invalidOffsetMetadataPolicy to an InvalidOffsetMetadataHandlingPolicy value when building ParallelConsumerOptions.
  isolated_from_stable_modules: false
boundaries:
  - The policy governs every payload this build cannot read - a magic byte no encoding claims, an encoding with no decoder here, metadata recognized as Kafka Streams', and a body that is not something any encoder here could have produced.
  - It does not govern a payload that decodes successfully into a wrong-but-plausible offset map; nothing in such a payload proves it wrong.
  - Under IGNORE the offset map is discarded, not repaired, so records completed but not yet committed before that point are replayed.
references:
  - label: Offset-metadata policy
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/ParallelConsumerOptions.java
  - label: Where the policy is applied
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/offsets/EncodedOffsetPair.java
