schema_version: 1
kind: feature
title: Wait for the engine to end, and be told why, instead of polling
category: operability
module: parallel-consumer-core
maturity: alpha
availability:
  status: planned
  target_release: next-0x
release_assumptions:
  - Not in 0.6.0.0. Until the release that carries it is cut, everything here is a claim about the source, not about a published artifact.
summary: >-
  controlThreadCompletion() hands out a CompletableFuture that completes when the engine's control
  thread ends - exceptionally, carrying the same throwable getFailureCause() records, when it ended
  by throwing. A supervisor waits on it, or composes it with its own shutdown signal, rather than
  asking isClosedOrFailed() on a timer.
use_this_when:
  - A supervisor, health check or application shutdown must react to the engine ending, including ending on its own because the control thread died.
  - You want the engine's ending combined with some other signal in a single wait, with no polling interval of your own to choose.
  - You want the failure that ended the instance handed to you by the wait, rather than fetched afterwards.
setup:
  mechanism: >-
    processor.controlThreadCompletion() returns a CompletableFuture<Void>. It completes normally when
    the control thread exits cleanly, and exceptionally when it exits by throwing or when the
    control task could not be submitted at all.
  carries: Nothing on the normal path - the value is Void, because the only information the control task's return ever had was that it returned.
opt_in:
  mechanism: Call the accessor. Nothing changes for an instance that never does; no engine path reads the future.
  isolated_from_stable_modules: false
boundaries:
  - It is declared on the abstract processor base, not on the ParallelConsumer or ParallelStreamProcessor interface. Code holding the interface that the factory method returns cannot reach it and should keep using isClosedOrFailed(); reaching it means holding the concrete processor type.
  - It completes when the CONTROL thread ends - not when a user function throws. A processing function that fails, however often, leaves it uncompleted, because the instance has not ended. This is the confusion worth naming before you build an alarm on it.
  - The future handed out is the instance's own, not a detached copy. Completing or cancelling it from outside corrupts no engine state, but it tells every other waiter the instance ended when it has not. Treat it as read-only; nothing enforces that.
  - It answers at a slightly different moment from isClosedOrFailed(). An instance whose run state has reached closed, but whose control thread has not yet exited, already reads as closed there and is not yet complete here.
  - An engine that failed completes it with the throwable the engine records as its failure cause, which for a fault inside user code is the engine's own wrapper with the original beneath it. Unwrap if you need the original.
validation:
  - Close an instance and confirm the future completes.
  - Make the control thread fail and confirm the future completes exceptionally with the same throwable the instance reports as its failure cause.
  - Confirm a processing function that throws repeatedly leaves the future uncompleted.
references:
  - label: The accessor and the contract stated on it
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/internal/AbstractParallelEoSStreamProcessor.java
  - label: Completion on close, on control-thread failure, and not on a user-function throw
    path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/ControlThreadCompletionTest.java
