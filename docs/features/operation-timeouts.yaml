schema_version: 1
kind: feature
title: Producer-send and synchronous-commit timeouts
category: operability
module: parallel-consumer-core
maturity: production-use
availability:
  status: published
  since: 0.4.0.1
  evidence:
    tag: 0.4.0.1
    path: CHANGELOG.adoc
    basis: Both options landed in this release - a timeout for blocking producer sends, and offsetCommitTimeout for periodic synchronous commits.
summary: Bound how long a produce flow waits for Kafka send completion and how long synchronous commit mode waits for an offset commit.
use_this_when:
  - A blocked Kafka operation must fail or retry within the application's latency budget.
setup:
  options:
    - ParallelConsumerOptions.sendTimeout for producer send completion.
    - ParallelConsumerOptions.offsetCommitTimeout for PERIODIC_CONSUMER_SYNC and PERIODIC_TRANSACTIONAL_PRODUCER commits.
opt_in:
  mechanism: Set the relevant Duration on ParallelConsumerOptions.
  isolated_from_stable_modules: false
boundaries:
  - A send timeout causes the input record to be reprocessed, so align it with producer delivery settings and idempotency needs.
  - offsetCommitTimeout is a whole-operation retry budget for the synchronous consumer and transactional producer commit modes; asynchronous commits are not bounded by it. Exhausting it consults the commit-failure handler - see commit-failure-seam.yaml.
references:
  - label: Timeout options
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/ParallelConsumerOptions.java
