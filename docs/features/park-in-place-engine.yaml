schema_version: 1
kind: feature
title: Park in place - a record gives up where it is, with no dead-letter topic
category: processing
module: parallel-consumer-core
maturity: alpha
availability:
  status: planned
  target_release: next-0x
release_assumptions:
  - Not in 0.6.0.0. Until the release that carries it is cut, everything here is a claim about the source, not about a published artifact.
  - This is the engine's own park, reachable from any classic-API processing function. A fluent API that offers park as a declared retry outcome describes the same engine behaviour from the caller's side and should point here rather than restate it.
summary: >-
  A processing function throws PCRetriableException(message).park(reason) and the record stops
  retrying for good: it stays incomplete in the offset map, holds no worker, never becomes due again
  on its own, and carries a phrase an operator reads back. Offsets after it keep committing, so one
  poison record no longer means a stopped topic or a dead-letter topic you did not want to run.
use_this_when:
  - A payload can never succeed - it cannot be decoded, or it names something that does not exist - and copying it to another topic first is more machinery than the problem deserves.
  - You want retries to stop consuming worker time and log volume without the record being silently marked as succeeded.
  - An operator needs to be told which records gave up, when, and in what words, rather than inferring it from a retry counter.
setup:
  declare:
    - throw new PCRetriableException(message).park(reason) from the processing function. The reason is required; a park with nothing to say is refused at the call site.
    - Combine with notAnAttempt() for a delivery that never ran - a payload that failed to decode before your work started.
    - Do not also call retryAfter(delay). The park wins, in either chaining order, and the delay is discarded - a park is never due again, which no deadline can express. The engine logs the discarded delay at DEBUG rather than refusing the throw. Ask for one or the other.
  observe:
    - pc.partition.parked.records and pc.partition.parked.oldest.age, tagged by topic and partition. They appear when the partition is assigned and go when it is revoked, so a partition that moves away takes its numbers with it.
    - RecordContext.isParked() and RecordContext.getParkedReason(), for a record that comes back after a rebalance or a restart and is being attempted afresh.
opt_in:
  mechanism: Park a record by throwing a PCRetriableException that carries a park reason. Nothing parks on its own, and no option enables or disables it.
  isolated_from_stable_modules: false
boundaries:
  - A parked record holds its shard. Under key ordering that is its key, so later records with the same key wait behind it and every other key on the partition is unaffected; under partition ordering it is the whole partition, which makes park a poor fit there - a partition-ordered instance wants a dead-letter destination instead.
  - Consumer-group lag reads as stuck at the oldest parked record. The committed offset cannot move past an incomplete one, even while everything after it is recorded in the commit metadata, so lag-based alerting sees a stall that processing does not have.
  - Nothing un-parks a record while the instance runs. There is no resume and no export. It is delivered again only after a rebalance or a restart, and is then attempted afresh, with its attempt count starting over; if that fresh attempt fails for an ordinary reason it stops being parked.
  - The parked set lives in memory. A restart loses it, and the records come back through ordinary redelivery because their offsets were never committed - so a route whose parked records must be durable needs a dead-letter destination, not this.
  - Park ends the retry churn, not the residency. The record stays inside the instance and stays incomplete, so it still counts against the partition's encoded offset payload. The relief a dead-letter topic gives - the record leaving - is not what this offers.
  - A parked record is deliberately invisible to the slow-work scan and to the controller's next-deadline calculation. That is what stops it being reported as an instance in trouble, and it also means the parked gauges and the reason string are the whole signal - nothing else will mention it again.
  - After a revocation, entries for a partition this instance no longer holds are cleared only while it is running or draining. Pause the instance, or close it without draining, and those entries are held until the process ends. The gauges already exclude them, so this is memory, not a wrong number.
  - A close that drains waits for records queued behind a parked key, which is work it can never take, so such a close waits out its drain timeout. A close that does not drain is unaffected.
  - Park is not success. The record is never marked complete, so an offset-map-based view of progress is right to show it as outstanding.
  - Park is how you say never, and a very large retryAfter is not. A delay longer than PC can schedule is refused at the call site, naming park as the thing you meant - a park is a state, so no arithmetic can turn it back into a hot retry, which a delay expressing never eventually could.
validation:
  - Park a record and confirm that offsets after it on the same partition commit, and that pc.partition.parked.records for that partition reports it.
  - Revoke the partition and confirm both gauges are gone, and that a fresh assignment of the same partition does not inherit the previous generation's count.
  - Confirm nothing in the periodic slow-work warning names the parked record.
