schema_version: 1
kind: feature
title: Hand Parallel Consumer a consumer configuration instead of a consumer
category: operability
module: parallel-consumer-core
maturity: alpha
availability:
  status: planned
  target_release: next-0x
release_assumptions:
  - Not in 0.6.0.0. Until the release that carries it is cut, everything here is a claim about the source, not about a published artifact.
readme_anchor: common_preparation
summary: >-
  consumerConfig takes the client properties you already have - bootstrap servers, group id,
  deserialisers - and lets Parallel Consumer build the KafkaConsumer itself, so an application
  holding nothing but connection settings no longer has to construct a client purely to hand it
  straight back. It is the mirror of producerConfig, which the producer side has always had.
use_this_when:
  - Your configuration arrives as properties - a file, a framework's binder, environment variables - and building a client from them is the only reason you touch the Kafka client API at all.
  - You are wrapping Parallel Consumer in something of your own and do not want that wrapper growing its own client construction.
  - You want the settings Parallel Consumer requires of its consumer to be checked when you build the options, rather than discovered at runtime.
setup:
  either:
    - consumer - a finished KafkaConsumer instance, exactly as before.
    - consumerConfig - a map of Kafka consumer properties for Parallel Consumer to build one from.
  required_on_the_configuration_path:
    - key.deserializer and value.deserializer, because Parallel Consumer is generic over its key and value types and never decodes a record itself.
  ask: isConsumerInstanceSupplied() reports which path an options object took.
opt_in:
  mechanism: Set consumerConfig instead of consumer when building ParallelConsumerOptions. Setting consumer is unchanged.
  isolated_from_stable_modules: false
boundaries:
  - The instance path is unchanged for every existing user. Supply a consumer and it takes exactly the path it always took; nothing about an existing application's client, its lifecycle or its settings is affected by this option existing.
  - Supply one or the other, never both - that is refused, naming both options. Never neither, either: a consumer is the one thing Parallel Consumer cannot run without, which is where this differs from producerConfig, since the producer is optional.
  - An explicit enable.auto.commit of true is REFUSED, not overridden. Parallel Consumer commits offsets itself, and quietly doing the opposite of what your map says is how a misconfiguration survives to the day somebody reads the map and believes it. Both spellings are refused - the boolean and the string a properties file produces.
  - An absent enable.auto.commit is the ordinary case and is set to false for you, with a line saying so at DEBUG.
  - Deserialisers are refused as a missing option rather than left to the client constructor, so the message names the option you set rather than a property key you never typed. There is no default pair that would not be silently wrong for most callers.
  - Both refusals happen when the options are validated, which is before the client is built - so an unusable configuration fails without a consumer ever existing.
  - The map you supply is not modified. Parallel Consumer builds from a copy, so the auto-commit setting it applies is not visible in the map you still hold.
  - This changes where a consumer is constructed, not how it behaves. Everything else in the map is passed to the Kafka client untouched, and every consumer setting means what it means to Kafka.
validation:
  - Build options with a configuration missing a deserialiser and confirm the refusal names the option rather than failing later inside the client.
  - Build options with enable.auto.commit set to true, in both spellings, and confirm each is refused rather than silently corrected.
  - Confirm an existing application that supplies a consumer instance is unaffected.
references:
  - label: The option, its validation and the companion accessor
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/ParallelConsumerOptions.java
  - label: Where the consumer is resolved and built
    path: parallel-consumer-core/src/main/java/bz/stub/parallelconsumer/internal/PCModule.java
  - label: Validation of the configuration path
    path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/ParallelConsumerOptionsConsumerConfigTest.java
  - label: A consumer Parallel Consumer built for itself
    path: parallel-consumer-core/src/test/java/bz/stub/parallelconsumer/internal/PcBuiltConsumerTest.java
  - label: Setup guidance for both clients
