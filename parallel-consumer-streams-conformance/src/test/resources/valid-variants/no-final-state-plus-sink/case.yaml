# AE8's second half: the same stateless topology with a sink loads, because its sink's final record
# per key is a final state to compare.
name: no-final-state-plus-sink
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: m, map-values: {of: in, fn: upper}}
  - {sink: {of: m, topic: out}}
inputs:
  - {key: a, value: "1", at-ms: 0}
perturbation:
  - {key: b, value: "1", at-ms: 0}
