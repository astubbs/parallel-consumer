# The multi-source rule's positive side: every record names its topic, so a two-source case is
# well-formed and each record is piped to exactly the source it names, in list order.
name: multi-source-named-topics
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: l, source: {topic: left}}
  - {id: r, source: {topic: right}}
  - {id: g, group-by-key: {of: l}}
  - {id: c, count: {of: g, store: counts}}
inputs:
  - {key: a, value: "1", at-ms: 0, topic: left}
  - {key: a, value: "2", at-ms: 1000, topic: right}
perturbation:
  - {key: b, value: "1", at-ms: 0, topic: left}
  - {key: b, value: "2", at-ms: 1000, topic: right}
