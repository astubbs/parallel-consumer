# R1: every input record carries an explicit timestamp, so no case inherits wall-clock time.
name: missing-timestamp
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: g, group-by-key: {of: in}}
  - {id: c, count: {of: g, store: counts}}
inputs:
  - {key: a, value: "1", at-ms: 0}
  - {key: a, value: "2"}
perturbation:
  - {key: b, value: "1", at-ms: 0}
