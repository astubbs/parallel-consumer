# KTD5: under close-driven suppression the driver emits a window only when a later record advances
# stream time to its close, and never on close(). A pinned-emit case with no such record observes
# nothing about emit while passing every proof on its store alone.
name: pinned-emit-no-trailing-record
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: g, group-by-key: {of: in}}
  - {id: w, windowed-by: {of: g, size-ms: 3600000, advance-ms: 3600000, grace-ms: 0, retention-ms: 3600000}}
  - {id: c, count: {of: w, store: counts}}
  - {id: s, to-stream: {of: c}}
  - {sink: {of: s, topic: out}}
inputs:
  - {key: a, value: "1", at-ms: 0}
  - {key: a, value: "2", at-ms: 60000}
perturbation:
  - {key: b, value: "1", at-ms: 0}
  - {key: a, value: "2", at-ms: 60000}
emit: on-window-close
