# A join is the one non-linear operation: two DISTINCT handles go in and one comes out. Naming the
# same handle on both sides is a chain wearing a join's spelling.
name: self-join
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: s1, source: {topic: left}}
  - {id: t0, source: {topic: right}}
  - {id: tg, group-by-key: {of: t0}}
  - {id: t1, reduce: {of: tg, fn: last-wins, store: right-table}}
  - {id: j, join: {stream: s1, table: s1, fn: concat-sides}}
  - {sink: {of: j, topic: out}}
inputs:                                 # two sources, so every record names its topic - this fixture
  - {key: a, value: "1", at-ms: 0, topic: left}   # trips the self-join rule and nothing else
perturbation:
  - {key: b, value: "1", at-ms: 0, topic: left}
