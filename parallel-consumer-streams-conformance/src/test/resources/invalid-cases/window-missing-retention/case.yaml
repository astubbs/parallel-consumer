# All four window fields are always present - the proto's TimeWindowSpec comment owns the why:
# a defaulted retention is Kafka's own size + grace, under which coexisting windows are gone for a
# reason with nothing to do with the host's code.
name: window-missing-retention
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: g, group-by-key: {of: in}}
  - {id: w, windowed-by: {of: g, size-ms: 3600000, advance-ms: 300000, grace-ms: 0}}
  - {id: c, count: {of: w, store: counts}}
inputs:
  - {key: a, value: "1", at-ms: 0}
perturbation:
  - {key: b, value: "1", at-ms: 0}
