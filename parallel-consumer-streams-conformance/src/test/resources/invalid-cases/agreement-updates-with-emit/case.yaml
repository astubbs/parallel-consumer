# AE5's second half: naming a close-driven emit rule does not buy the level. Refused identically,
# and this fixture satisfies every other rule so the refusal it produces is the agreement one alone.
name: agreement-updates-with-emit
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: g, group-by-key: {of: in}}
  - {id: w, windowed-by: {of: g, size-ms: 3600000, advance-ms: 3600000, grace-ms: 0, retention-ms: 3600000}}
  - {id: c, count: {of: w, store: counts}}
  - {id: s, to-stream: {of: c}}
  - {sink: {of: s, topic: out}}
inputs:
  - {key: a, value: "1", at-ms: 0}
  - {key: z, value: "-", at-ms: 7200000}
perturbation:
  - {key: b, value: "1", at-ms: 0}
  - {key: z, value: "-", at-ms: 7200000}
agreement: final-state+updates
emit: on-window-close
