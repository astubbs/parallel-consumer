# One source, so the topic could have been defaulted - but the record names one, and it names a topic
# no source declares. A record piped to a topic nothing reads is a record that vanishes, which is the
# silent shape this rung exists to refuse.
name: record-topic-not-declared
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: g, group-by-key: {of: in}}
  - {id: c, count: {of: g, store: counts}}
inputs:
  - {key: a, value: "1", at-ms: 0, topic: elsewhere}
perturbation:
  - {key: b, value: "1", at-ms: 0}
