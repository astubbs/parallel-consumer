# The map-values floor, and KTD13's `upper` half of its vocabulary. Stateless, so the sink IS the
# final state: a non-windowed sink folds to the last record per key, which is why the twin changes
# the value of a key that appears once - a change map-values cannot absorb, since `upper` is
# injective on the ASCII this case pipes.
name: map-values-upper-to-sink
base-instant: 2025-01-01T02:00:00Z
topology:
  - {id: in, source: {topic: in}}
  - {id: m, map-values: {of: in, fn: upper}}
  - {sink: {of: m, topic: out}}
inputs:
  - {key: a, value: "ab", at-ms: 0}
  - {key: b, value: "cd", at-ms: 1000}
perturbation:                           # b's only value changes, so its uppercase changes with it
  - {key: a, value: "ab", at-ms: 0}
  - {key: b, value: "zz", at-ms: 1000}
agreement: final-state
