  - id: sweep-2023-topic-priority
    group: features
    summary: Prioritise some subscribed topics over others via reserved concurrency shares
    fork: {branches: [features/queue-priority], prs: [], fork_issues: [236], status: none}
    upstream: {repo: confluentinc/parallel-consumer, issues: [50], prs: [441], related: [372], status: closed, last_checked: 2026-08-07}
    adoc_anchor: null
    notes: >
      Reservation model, not strict priority: a tier gets up to its share only if it
      has records to use it, so low tiers are not starved. Nothing in ShardManager or
      options expresses per-topic weighting today. The harder half is fetch-side --
      prioritisation only bites among buffered records, so DynamicLoadFactor must know
      the reservation targets or high-priority topics have nothing queued to promote.
      Draft: PR #441 astubbs/features/queue-priority @383a87456. Has unanswered user
      demand on the PR (C0mbatwombat, notification use-case).

